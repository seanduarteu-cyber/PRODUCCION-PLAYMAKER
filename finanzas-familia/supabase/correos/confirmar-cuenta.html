<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#15201b;line-height:1.5">
  <h2 style="color:#0e7458;margin:0 0 12px">Confirma tu correo</h2>
  <p style="margin:0 0 16px">Hola. Para activar tu cuenta en <b>Finanzas Familia</b>, escribe este código en la app:</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:8px;background:#e0f2ea;color:#0a5c46;padding:16px;text-align:center;border-radius:12px;margin:0 0 16px">{{ .Token }}</p>
  <p style="margin:0 0 12px">También puedes tocar este botón desde el mismo teléfono donde creaste la cuenta:</p>
  <p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="background:#0e7458;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;display:inline-block;font-weight:bold">Confirmar mi correo</a></p>
  <p style="color:#5f6d67;font-size:13px;margin:0">El código vence en 1 hora. Si no creaste esta cuenta, ignora este correo.</p>
</div>
