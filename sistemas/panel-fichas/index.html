  }

  /* ---- catálogo único de moldes (tabla moldes): lo leen el Panel y la Planificación ---- */
  const telasPlanas = cat => {
    const lineas = cat.filter(c => c.tipo === 'tela' && !c.padre);
    const out = [];
    lineas.forEach(l => {
      out.push(l.nombre);
      cat.filter(c => c.tipo === 'tela' && c.padre === l.id).forEach(h => out.push(l.nombre + ' · ' + h.nombre));
    });
    return out;
  };
  // Tela principal de la línea Nacional o Pro: las piezas solo ofrecen telas de esa línea
  const normT = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const lineaFiltroTela = tela => /(^|\s)(nacional|pro)$/.test(normT(tela)) ? tela : '';
  // Lista de telas con buscador: filtra mientras se escribe (todas las palabras, sin importar tildes)
  const comboTela = (attrs, valor, lista, linea) => '<div class="cbx" ' + attrs + '>' +
    '<button type="button" class="cbx-btn' + (valor ? '' : ' vacio') + '" aria-haspopup="listbox">' + esc(valor || 'Sin definir') + '</button>' +
    '<div class="cbx-pop" hidden><input type="search" class="cbx-q" placeholder="Buscar tela…" autocomplete="off" aria-label="Buscar tela">' +
    '<div class="cbx-lista" role="listbox">' + [''].concat(lista).concat(valor && lista.indexOf(valor) < 0 ? [valor] : [])
      .map(t => '<button type="button" class="cbx-op' + (t === valor ? ' on' : '') + '" data-v="' + esc(t) + '">' + esc(t || 'Sin definir') + '</button>').join('') +
    '</div><div class="cbx-vacio" hidden>No hay telas con ese nombre' + (linea ? ' en ' + esc(linea) : '') + '.</div>' +
    (linea ? '<div class="cbx-nota">Solo telas ' + esc(linea) + ' (la tela principal)</div>' : '') + '</div></div>';
  function bindComboTela(cb, elegir) {
    const btn = cb.querySelector('.cbx-btn'), pop = cb.querySelector('.cbx-pop'), q = cb.querySelector('.cbx-q'), vacio = cb.querySelector('.cbx-vacio');
    const ops = Array.from(cb.querySelectorAll('.cbx-op'));
    const filtrar = () => { const ws = normT(q.value).split(/\s+/).filter(Boolean); let n = 0;
      ops.forEach(o => { const si = !ws.length || ws.every(w => normT(o.textContent).indexOf(w) >= 0); o.hidden = !si; if (si) n++; }); vacio.hidden = n > 0; };
    btn.addEventListener('click', () => { const abrir = pop.hidden;
      document.querySelectorAll('.cbx-pop').forEach(x => { x.hidden = true; });
      if (abrir) { pop.hidden = false; pop.style.left = '0'; pop.style.width = '';
        const r = pop.getBoundingClientRect(), an = document.documentElement.clientWidth;
        if (r.right > an - 8) pop.style.left = Math.min(0, an - 8 - r.right) + 'px';
        if (pop.getBoundingClientRect().left < 8) { pop.style.left = (8 - cb.getBoundingClientRect().left) + 'px'; pop.style.width = (an - 16) + 'px'; }
        q.value = ''; filtrar(); q.focus(); } });
    q.addEventListener('input', filtrar);
    q.addEventListener('keydown', e => {
      if (e.key === 'Escape') { pop.hidden = true; btn.focus(); }
      else if (e.key === 'Enter') { e.preventDefault(); const o = ops.find(x => !x.hidden); if (o) o.click(); }
    });
    ops.forEach(o => o.addEventListener('click', () => {
      const v = o.dataset.v; elegir(v);
      btn.textContent = v || 'Sin definir'; btn.classList.toggle('vacio', !v);
      ops.forEach(x => x.classList.toggle('on', x === o)); pop.hidden = true;
    }));
  }
  // un clic fuera cierra la lista
  document.addEventListener('click', e => { if (!(e.target.closest && e.target.closest('.cbx'))) document.querySelectorAll('.cbx-pop').forEach(x => { x.hidden = true; }); });
  const selTela = (attrs, valor, lista) => '<select ' + attrs + '><option value="">Sin definir</option>' +
    lista.map(t => '<option value="' + esc(t) + '"' + (t === valor ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
    (valor && lista.indexOf(valor) < 0 ? '<option value="' + esc(valor) + '" selected>' + esc(valor) + '</option>' : '') + '</select>';
  const piezasDe = m => Array.isArray(m.piezas) ? m.piezas : JSON.parse(m.piezas || '[]');
  // sin el SQL 17A (sin orden en la base) la sección y el orden salen del catálogo ordenado, si el código coincide
  // códigos que cambió el catálogo (N° → código anterior): la base aún sin actualizar se reconoce igual
  const CODIGOS_ANTERIORES = { 102: 'RB-HOMUCC02' };   // E02 es sin mangas: RB-HOMUCC02 → RB-HOMUCC03 (SQL 19B)
  const catDeFila = r => r.orden == null && CAT_RESPALDO[r.numero] && (CAT_RESPALDO[r.numero].c === r.codigo || CODIGOS_ANTERIORES[r.numero] === r.codigo) ? CAT_RESPALDO[r.numero] : null;
  const filaAMolde = r => { const cat = catDeFila(r);
    return { n: r.numero, c: r.codigo, d: cat ? cat.d : (r.deporte || ''), ca: r.calce || 'Unisex', i: r.infantil ? 1 : 0,
      t: r.prenda === 'camiseta' ? 'polera' : r.prenda, o: r.orden != null ? r.orden : cat ? cat.o : null, e: etqMolde(r.numero) + ' · ' + r.codigo + ' — ' + r.descripcion, piezas: piezasDe(r) }; };
  const moldesVigentes = filas => filas.filter(r => r.activo !== false).map(filaAMolde).sort((a, b) => ordenMolde(a) - ordenMolde(b));

  async function cargarMoldes() {
    if (st.moldes) return st.moldes;
    try {
      st.moldes = await API.moldes() || []; st.moldesError = '';
      // el catálogo de la base reemplaza a la lista escrita en el código
      if (st.moldes.length) MOLDES = moldesVigentes(st.moldes);

    catch (e) { st.moldes = null; st.moldesError = /moldes/.test(e.message || '') ? 'falta-tabla' : 'conexion'; }

  }

  // próximo N° libre: normales 01–99 (siguen el catálogo) o especiales E01–E99 (guardados como 101–199)
  const sigMolde = especial => (st.moldes || []).filter(m => especial ? m.numero > 100 && m.numero < 200 : m.numero < 100)
    .reduce((n, m) => Math.max(n, m.numero), especial ? 100 : 0) + 1;

  async function pantMoldes() {
    if (!Array.isArray(st.cat)) { try { st.cat = await API.catalogo() || []; } catch (e) { st.cat = []; } }

          '</div>' + pie + '</div>';

    const lista = enOrden.filter(m => !filtro || m.prenda === filtro || deporteFila(m) === filtro);
    const deportes = Array.from(new Set(enOrden.map(deporteFila).filter(Boolean)));
    // sin el SQL 17A ningún molde tiene orden: se agrupan solo por deporte
    const hayOrden = st.moldes.some(m => m.orden != null || catDeFila(m));
    const seccionFila = m => hayOrden && ordenFila(m) >= 9000 ? 'Fuera del catálogo ordenado' : (deporteFila(m) || 'Sin deporte');
    const ed = st.moldeEdit;

    let h = barra('Catálogo de moldes', 'catalogo') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Catálogo de<br>moldes</h1>' +
      '<p class="bajada">El catálogo oficial de moldes vigentes. Es el mismo para el Panel y la Planificación: en las fichas solo se eligen moldes de esta lista ' +
      '(o se ingresan a mano y quedan marcados). Aquí se define también el despiece de cada molde.</p>';

    if (ed) {
      h += '<div class="campo molde-ed"><label>' + (ed.nuevo ? 'Nuevo molde N° ' + etqMolde(ed.numero) : 'Molde N° ' + etqMolde(ed.numero)) + '</label>' +
        (ed.nuevo ? '<label for="me-serie">Numeración</label><select id="me-serie"><option value="n"' + (ed.numero < 100 ? ' selected' : '') + '>N° ' + etqMolde(sigMolde(false)) +
          ' · sigue la numeración del catálogo</option><option value="e"' + (ed.numero > 100 ? ' selected' : '') + '>' + etqMolde(sigMolde(true)) + ' · molde especial</option></select>' : '') +
        '<label for="me-cod">Código</label><input id="me-cod" maxlength="30" value="' + esc(ed.codigo) + '" placeholder="Ej: FUTHOMV01">' +
        '<label for="me-des">Descripción</label><input id="me-des" maxlength="80" value="' + esc(ed.descripcion) + '" placeholder="Ej: Fútbol, cuello v">' +
        '<div class="me-fila"><div><label for="me-pre">Prenda</label><select id="me-pre">' +
        PRENDAS.filter(p => !p.origen).map(p => '<option value="' + p.id + '"' + (ed.prenda === p.id ? ' selected' : '') + '>' + esc(p.nom) + '</option>').join('') + '</select></div>' +
        '<div><label for="me-dep">Deporte</label><input id="me-dep" maxlength="30" list="me-deportes" value="' + esc(ed.deporte) + '"><datalist id="me-deportes">' +
        deportes.map(d => '<option value="' + esc(d) + '">').join('') + '</datalist></div>' +
        '<div><label for="me-cal">Calce</label><select id="me-cal">' + ['Masculino', 'Femenino', 'Unisex'].map(c => '<option' + (ed.calce === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
        '<div><label for="me-inf">Talla</label><select id="me-inf"><option value="0"' + (ed.infantil ? '' : ' selected') + '>Adulto</option><option value="1"' + (ed.infantil ? ' selected' : '') + '>Infantil</option></select></div></div>' +
        '<label>Despiece (piezas que se cortan)</label>' +
        '<div class="me-copiar"><select id="me-copiar"><option value="">Copiar las piezas de otro molde…</option>' +
        st.moldes.filter(m => m.numero !== ed.numero && piezasDe(m).length).map(m => '<option value="' + m.numero + '">' + etqMolde(m.numero) + ' · ' + esc(m.codigo) + ' (' + piezasDe(m).length + ' piezas)</option>').join('') +
        '</select></div>' +
        '<div class="mini" style="margin:4px 0 6px">Consumo: metros de tela que usa esa pieza en <b>una prenda</b> (todas sus unidades). Con esto Producción descuenta la tela del inventario al ingresar cada pedido.</div>' +
        '<table class="dp-tabla"><thead><tr><th>Pieza</th><th>Cant. por prenda</th><th>Consumo por prenda (m)</th><th>Tela sugerida</th><th></th></tr></thead><tbody>' +
        ed.piezas.map((p, i) => '<tr><td><input data-mp="' + i + '" data-k="pieza" maxlength="40" value="' + esc(p.pieza) + '" placeholder="Ej: Costadillo"></td>' +
          '<td><input data-mp="' + i + '" data-k="cant" type="number" min="1" max="20" value="' + (p.cant || 1) + '"></td>' +
          '<td><input data-mp="' + i + '" data-k="consumo" type="number" min="0" max="20" step="0.01" value="' + (p.consumo != null && p.consumo !== '' ? p.consumo : '') + '" placeholder="Ej: 0,45"></td>' +

      '<optgroup label="Por prenda">' + PRENDAS.filter(p => st.moldes.some(m => m.prenda === p.id)).map(p => '<option value="' + p.id + '"' + (filtro === p.id ? ' selected' : '') + '>' + esc(p.nom) + '</option>').join('') + '</optgroup></select>';

    if (sinDesp) h += '<div class="mini" style="margin-top:6px">' + sinDesp + ' moldes aún sin despiece definido.</div>';

      const pz = piezasDe(m);
      // título de la sección del catálogo cuando cambia (y «Fuera del catálogo» para los que no tienen orden)
      const sec = seccionFila(m), secAnt = k ? seccionFila(lista[k - 1]) : null;
      return (sec !== secAnt ? '<div class="mc-seccion">' + esc(sec) + '</div>' : '') + '<div class="molde-card' + (m.activo === false ? ' inactivo' : '') + '"><div class="mc-cab"><div><b>' + etqMolde(m.numero) + ' · ' + esc(m.codigo) + '</b> — ' + esc(m.descripcion) +
        '<div class="mini">' + esc(prendaDe(m.prenda).nom) + ' · ' + esc(m.calce || '') + (m.infantil ? ' infantil' : '') + (m.activo === false ? ' · no vigente' : '') + '</div></div>' +
        '<div class="mc-acc"><button class="btn plano chico" data-me-editar="' + m.numero + '">Editar</button></div></div>' +
        '<div class="mc-guia"><img src="' + URL_MOLDE(m.numero) + '?v=' + (st.guiaV || 0) + '" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'mini\',textContent:\'Sin guía de tallas\'}))">' +
        '<a href="' + URL_MOLDE(m.numero) + '?v=' + (st.guiaV || 0) + '" target="_blank" rel="noopener">Guía de tallas</a></div>' +
        '<div class="mc-piezas">' + (pz.length ? pz.map(p => esc(p.pieza) + (p.cant > 1 ? ' ×' + p.cant : '') + (p.consumo ? ' ' + String(p.consumo).replace('.', ',') + ' m' : '') + (p.tela ? ' <span>(' + esc(p.tela) + ')</span>' : '')).join(' · ') : '<span>Sin despiece definido</span>') +
        (pz.length ? '<div class="mini">' + (pz.some(p => p.consumo) ? 'Consumo por prenda: ' + String(Math.round(pz.reduce((s2, p) => s2 + (+p.consumo || 0), 0) * 100) / 100).replace('.', ',') + ' m' + (pz.some(p => !p.consumo) ? ' (faltan piezas sin consumo)' : '') : 'Sin consumo de tela definido') + '</div>' : '') + '</div></div>';
    }).join('') : '<div class="mini">No hay moldes con este filtro.</div>';
    h += '</div>';
    app.innerHTML = h + '<button class="btn plano" data-ir="catalogo">Volver al catálogo</button>' + pie + '</div>';

    const fil = document.getElementById('me-filtro');
    fil.addEventListener('change', () => { st.moldeFiltro = fil.value; render(); });
    const bn = document.getElementById('me-nuevo');
    if (bn) bn.addEventListener('click', () => {
      const prox = sigMolde(false);
      st.moldeEdit = { nuevo: true, numero: prox, codigo: '', descripcion: '', deporte: '', calce: 'Unisex', infantil: false, prenda: PRENDAS.some(p => p.id === filtro) ? filtro : 'camiseta', activo: true,
        piezas: [{ pieza: 'Frente', cant: 1, tela: '' }, { pieza: 'Espalda', cant: 1, tela: '' }] };
      st.error = ''; render(); window.scrollTo(0, 0);
    });
    const gs = document.getElementById('me-guias');
    if (gs) gs.addEventListener('change', async () => {
      const files = Array.from(gs.files || []); if (!files.length) return;
      const ok = [], mal = [];
      st.guiasMsg = { txt: 'Subiendo ' + files.length + ' guía(s)…' }; render();
      for (const f of files) {
        const n = numeroDeArchivo(f.name);
        if (n == null || !st.moldes.some(m => m.numero === n)) { mal.push(f.name + ' (no corresponde a un molde del catálogo)'); continue; }
        if (guiaDelCatalogo(n)) { mal.push(f.name + ' (el molde ' + etqMolde(n) + ' ya tiene la guía del catálogo)'); continue; }
        try { await subirGuiaMolde(n, f); ok.push(etqMolde(n)); } catch (e) { mal.push(f.name + ' (' + (e.message || '').slice(0, 60) + ')'); }
      }
      st.guiaV = Date.now();
      st.guiasMsg = { error: mal.length > 0, txt: (ok.length ? 'Guías subidas: ' + ok.join(', ') + '. ' : '') + (mal.length ? 'No se subieron: ' + mal.join(' · ') : '') };
      render();
    });
    app.querySelectorAll('[data-me-editar]').forEach(b => b.addEventListener('click', () => {
      const m = st.moldes.find(x => x.numero === +b.dataset.meEditar);
      st.moldeEdit = { nuevo: false, numero: m.numero, codigo: m.codigo, descripcion: m.descripcion, deporte: m.deporte || '', calce: m.calce || 'Unisex',
        infantil: !!m.infantil, prenda: m.prenda, activo: m.activo !== false, piezas: JSON.parse(JSON.stringify(piezasDe(m))) };
      st.error = ''; render(); window.scrollTo(0, 0);
    }));
    if (!ed) return;
    const leer = () => {
      ed.codigo = document.getElementById('me-cod').value.trim().toUpperCase();
      ed.descripcion = document.getElementById('me-des').value.trim();
      ed.prenda = document.getElementById('me-pre').value; ed.deporte = document.getElementById('me-dep').value.trim();
      ed.calce = document.getElementById('me-cal').value; ed.infantil = document.getElementById('me-inf').value === '1';
      const act = document.getElementById('me-act'); if (act) ed.activo = act.checked;
    };
    app.querySelectorAll('[data-mp]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const p = ed.piezas[+el.dataset.mp]; p[el.dataset.k] = el.dataset.k === 'cant' ? Math.max(1, parseInt(el.value, 10) || 1) : el.value;
    }));
    app.querySelectorAll('[data-mp-quitar]').forEach(b => b.addEventListener('click', () => { leer(); ed.piezas.splice(+b.dataset.mpQuitar, 1); render(); }));
    document.getElementById('me-add').addEventListener('click', () => { leer(); ed.piezas.push({ pieza: '', cant: 1, tela: '' }); render(); });
    document.getElementById('me-copiar').addEventListener('change', e => {
      const o = st.moldes.find(m => m.numero === +e.target.value); if (!o) return;
      leer(); ed.piezas = JSON.parse(JSON.stringify(piezasDe(o))); render();
    });
    const serie = document.getElementById('me-serie');
    if (serie) serie.addEventListener('change', () => {
      leer(); ed.numero = sigMolde(serie.value === 'e');
      if (serie.value === 'e' && !ed.deporte) ed.deporte = ESPECIALES;
      render();
    });
    const gu = document.getElementById('me-guia');
    if (gu) gu.addEventListener('change', async () => {
      const f = gu.files && gu.files[0]; if (!f) return;
      try { await subirGuiaMolde(ed.numero, f); st.guiaV = Date.now(); st.error = ''; }
      catch (e) { st.error = 'No se pudo subir la guía. ' + (e.message || '').slice(0, 120); }
      leer(); render();
    });
    document.getElementById('me-cancelar').addEventListener('click', () => { st.moldeEdit = null; st.error = ''; render(); });
    document.getElementById('me-guardar').addEventListener('click', async () => {
      leer();
      const consumoDe = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n * 1000) / 1000 : null; };
      const piezas = ed.piezas.map(p => { const q = { pieza: (p.pieza || '').trim(), cant: Math.max(1, parseInt(p.cant, 10) || 1), tela: p.tela || '' };
        const c = consumoDe(p.consumo); if (c != null) q.consumo = c; return q; }).filter(p => p.pieza);
      if (!ed.codigo) { st.error = 'Escribe el código del molde.'; return render(); }
      if (!ed.descripcion) { st.error = 'Escribe la descripción del molde.'; return render(); }
      if (st.moldes.some(m => m.numero !== ed.numero && m.codigo === ed.codigo && m.calce === ed.calce && !!m.infantil === ed.infantil && m.prenda === ed.prenda && m.descripcion === ed.descripcion)) {
        st.error = 'Ya existe un molde igual en el catálogo.'; return render();
      }
      const fila = { numero: ed.numero, codigo: ed.codigo, descripcion: ed.descripcion, deporte: ed.deporte || null, calce: ed.calce, infantil: ed.infantil,
        prenda: ed.prenda, piezas: piezas, activo: ed.activo, updated_at: new Date().toISOString() };
      try {
        await API.guardarMolde(fila);
        const antes = st.moldes.find(m => m.numero === fila.numero);   // conserva su orden en el catálogo
        st.moldes = st.moldes.filter(m => m.numero !== fila.numero).concat([Object.assign({ orden: antes ? antes.orden : null }, fila)]);
        MOLDES = moldesVigentes(st.moldes);
        st.moldeEdit = null; st.error = ''; render();
      } catch (e) { st.error = 'No se pudo guardar. ' + (e.message || '').slice(0, 600); render(); }
    });
  }

  /* ---- catálogo de telas, moldes y aplicaciones ---- */
  async function pantCatalogo() {
    if (!Array.isArray(st.cat)) {
      app.innerHTML = barra('Catálogo técnico', 'tecnica') + '<div class="pmk-wrap"><div class="cargando">Cargando…</div></div>';
      try { st.cat = await API.catalogo() || []; } catch (e) {
        app.innerHTML = barra('Catálogo técnico', 'tecnica') + '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return;
      }
    }
    const cat = st.cat;
    const lineas = cat.filter(c => c.tipo === 'tela' && !c.padre);

    let h = barra('Catálogo técnico', 'tecnica') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Catálogo<br>técnico</h1>' +
      '<p class="bajada">Lo que aparece en las listas de la ficha técnica. Lo que cargues acá queda disponible para todas las fichas.</p>';

    // --- telas en dos niveles ---
    h += '<div class="campo"><label>Telas</label>' +
      '<div class="ayuda">Cada línea agrupa sus telas. En la ficha técnica se elige primero la línea y después la tela exacta.</div>';
    lineas.forEach(l => {
      const hijas = cat.filter(c => c.padre === l.id);
      h += '<div class="cat-linea"><div class="cat-item cat-padre"><span class="n">' + esc(l.nombre) + '</span>' +
        '<button data-borrar-cat="' + esc(l.id) + '" aria-label="Quitar">×</button></div>';
      hijas.forEach(c => {
        h += '<div class="cat-item cat-hija"><span class="n">' + esc(c.nombre) + '</span>' +
          '<button data-borrar-cat="' + esc(c.id) + '" aria-label="Quitar">×</button></div>';
      });
      if (!hijas.length) h += '<div class="mini cat-hija-vacia">Sin telas cargadas en esta línea.</div>';
      h += '<div class="cat-add cat-hija"><input type="text" id="add-hija-' + esc(l.id) + '" maxlength="60" ' +
        'placeholder="Nombre de la tela"><button class="btn chico" data-add-hija="' + esc(l.id) + '">Agregar</button></div></div>';
    });
    h += '<div class="cat-add"><input type="text" id="add-tela" placeholder="Agregar línea de tela" maxlength="60">' +
      '<button class="btn chico" data-add-cat="tela">Agregar línea</button></div></div>';

    // --- moldes y aplicaciones, listas simples ---
    [['molde', 'Moldes', 'molde'], ['aplicacion', 'Aplicaciones', 'aplicación']].forEach(g => {
      const items2 = cat.filter(c => c.tipo === g[0] && !c.padre);
      h += '<div class="campo"><label>' + g[1] + '</label>';
      items2.forEach(c => {
        h += '<div class="cat-item"><span class="n">' + esc(c.nombre) + '</span>' +
          '<button data-borrar-cat="' + esc(c.id) + '" aria-label="Quitar">×</button></div>';
      });
      if (!items2.length) h += '<div class="mini">Sin opciones cargadas.</div>';
      h += '<div class="cat-add"><input type="text" id="add-' + g[0] + '" placeholder="Agregar ' + g[2] + '" maxlength="60">' +
        '<button class="btn chico" data-add-cat="' + g[0] + '">Agregar</button></div></div>';
    });

    if (st.error) h += '<div class="aviso error">' + esc(st.error) + '</div>';
    app.innerHTML = h + '<button class="btn" data-ir="moldes">Catálogo de moldes y despiece</button>' +
      '<button class="btn plano" data-ir="tecnica">Volver a la ficha técnica</button>' + pie + '</div>';

    async function agregar(tipo, nombre, padre) {
      const id = tipo.slice(0, 4) + '-' + Date.now().toString(36) + Math.floor(Math.random() * 100);
      const fila = { id: id, tipo: tipo, nombre: nombre };
      if (padre) fila.padre = padre;
      await API.crearCatalogo(fila);
      st.cat.push(fila);
    }

    app.querySelectorAll('[data-add-cat]').forEach(b => b.addEventListener('click', async () => {
      const tipo = b.dataset.addCat;
      const inp = document.getElementById('add-' + tipo);
      const nombre = (inp.value || '').trim();
      if (!nombre) return;
      b.disabled = true; b.textContent = '…';
      try { await agregar(tipo, nombre, null); st.error = ''; render(); }
      catch (e) { st.error = 'No se pudo agregar. ' + (e.message || '').slice(0, 100); render(); }
    }));

    app.querySelectorAll('[data-add-hija]').forEach(b => b.addEventListener('click', async () => {
      const padre = b.dataset.addHija;
      const inp = document.getElementById('add-hija-' + padre);
      const nombre = (inp.value || '').trim();
      if (!nombre) return;
      b.disabled = true; b.textContent = '…';
      try { await agregar('tela', nombre, padre); st.error = ''; render(); }
      catch (e) { st.error = 'No se pudo agregar. ' + (e.message || '').slice(0, 100); render(); }
    }));

    app.querySelectorAll('[data-borrar-cat]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.borrarCat;
      const hijas = st.cat.filter(c => c.padre === id);
      if (hijas.length) {
        st.error = 'Esa línea tiene ' + hijas.length + ' telas adentro. Quítalas primero.';
        return render();
      }
      b.disabled = true;
      try {
        await API.borrarCatalogo(id);
        st.cat = st.cat.filter(c => c.id !== id);
        st.error = ''; render();
      } catch (e) { b.disabled = false; }
    }));
  }

    let h = barra(f.cliente, 'lista') + '<div class="pmk-wrap">' +
      '<h1 class="tit">' + esc(f.proyecto) + '</h1>' +

        .map(x => { const k = x.split(':')[0];

      '</div>';

    if (st.pest === 'avance') {

        ': revisa su despiece, telas y montaje en la ficha técnica.<br><button class="btn plano chico" data-ir="tecnica" style="margin-top:8px">Ir a la ficha técnica</button></div>';
      h += '<div class="campo">' + bloqueAvance(f, dets) + '</div>';

        chk(!!f.entrega_cliente, 'Fechas de entrega definidas', 'data-ir="tecnica"', 'Definir fechas') +
