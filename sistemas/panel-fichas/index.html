    } else if (st.pest === 'listado') {
      const ep = st.editPersona && st.editPersona.ref === f.ref ? st.editPersona : null;
      h += '<div class="btn-par" style="margin-top:12px"><button class="btn" data-ir="listado-ed">Editar todo el listado</button><button class="btn plano chico" id="ep-nueva">+ Agregar persona</button></div>';
      if (ep) h += formPersona(f, ep, idsPersona(f, dets, ids));
      if (!dets.length) h += '<div class="vacio"><div class="t">Sin datos</div><div class="d">El cliente aún no carga detalle.</div></div>';
      else h += '<div class="ayuda" style="margin-top:12px"><b>Editar todo el listado</b> abre a todas las personas en una sola pantalla: corriges lo que haga falta, marcas las que se eliminan y guardas todo junto. ' +
        'Con <b>Editar</b> y <b>Eliminar</b> de cada fila corriges o quitas a una persona. ' +
        'Toca la columna <b>' + esc(nombreArq(f)) + '</b> para marcar o quitar a quien lleva ese diseño, si el cliente no lo indicó.</div>' +
        tablaDetalle(f, dets, idsPersona(f, dets, ids));
    } else {
      if (!avs.length) h += '<div class="vacio"><div class="t">Sin avisos</div><div class="d">El cliente no ha agregado prendas por sobre lo vendido.</div></div>';
      avs.forEach(a => {
        h += '<div class="notif' + (a.visto ? ' visto' : '') + '">' +
          '<div class="que">El cliente agregó ' + a.exceso + ' ' + esc(tieneNombreD(f, a.prenda) ? nomDT(f, a.prenda) : prendaDe(a.prenda).nom.toLowerCase()) + '</div>' +
          '<div class="quien">' + a.agregadas + ' cargadas · ' + a.habilitadas + ' vendidas · ' + esc(fechaTxt(a.created_at)) + '</div>';
        if (!a.visto) h += '<div class="btn-par"><button class="btn verde" data-ajustar="' + esc(a.id) + '">Ajustar a ' + a.agregadas + '</button>' +
          '<button class="btn plano" data-visto="' + esc(a.id) + '">Marcar visto</button></div>' +
          '<div class="mini" style="margin-top:8px">Ajustar cuadra la ficha con lo cargado. Recuerda actualizar la cotización.</div>';
        else h += '<div class="mini" style="margin-top:8px">Visto' + (a.visto_por ? ' por ' + esc(a.visto_por) : '') + '</div>';
        h += '</div>';
      });
    }

    h += '<div class="btn-par"><button class="btn oscuro" data-ir="pdf">Descargar PDF</button>' +
      '<button class="btn plano" id="btn-csv">Descargar Excel</button></div>' +
      '<button class="btn plano" id="btn-estado">' + (f.estado === 'confirmado' ? 'Reabrir para edición' : 'Confirmar ficha y enviar a producción') + '</button>';
    app.innerHTML = h + pie + '</div>';

    app.querySelectorAll('[data-pest]').forEach(b => b.addEventListener('click', () => { st.pest = b.dataset.pest; st.editPersona = null; render(); }));
    document.getElementById('btn-csv').addEventListener('click', () => descargarCSV(f, dets, idsPersona(f, dets, ids)));
    const bl2 = document.getElementById('chk-link');
    const bc2 = document.getElementById('chk-confirmar');
    if (bc2) bc2.addEventListener('click', () => { const b = document.getElementById('btn-estado'); if (b) b.click(); });
    const bl = document.getElementById('btn-link') || bl2;
    if (bl) bl.addEventListener('click', e => {
      navigator.clipboard.writeText(linkCliente(f))
        .then(() => { e.target.textContent = 'Link copiado'; });
    });
    document.getElementById('btn-estado').addEventListener('click', async () => {
      const nuevo = f.estado === 'confirmado' ? 'abierto' : 'confirmado';
      if (nuevo === 'confirmado') {
        const avc = avanceFicha(f, dets);
        const falta = [!avc.completo && 'tallas completas', !f.entrega_cliente && 'fechas de entrega'].filter(Boolean);
        if (falta.length) { alert('Aún no se puede confirmar. Falta: ' + falta.join(', ') + '.'); return; }
      } else if (!confirm('¿Reabrir la ficha? Si el pedido ya ingresó a producción, seguirá allá; los cambios de tallas habrá que avisarlos al taller.')) return;
      try {
        await API.estadoFicha(f.ref, nuevo);
        let specs = null;
        if (nuevo === 'abierto' && specsDe(f)._revision) {
          const r = await API.ficha(f.ref); specs = JSON.parse(JSON.stringify(specsDe(r && r[0] ? r[0] : f))); delete specs._revision;
          await API.specsFicha(f.ref, specs);
        }
        st.ficha = Object.assign({}, f, { estado: nuevo }, specs ? { specs: specs } : {}); render();
      } catch (e) {}
    });
    // listado: agregar, editar o eliminar personas
    const abrirForm = ep => { st.editPersona = Object.assign({ ref: f.ref, nombre: '', estampado: '', numero: '', calce: '', manga: 'Corta', arquero: false, obs: '', tallas: {} }, ep); st.epScroll = true; render(); };
    const bNueva = document.getElementById('ep-nueva');
    if (bNueva) bNueva.addEventListener('click', () => abrirForm({ nuevo: true, id: (Date.now() * 1000 + Math.floor(Math.random() * 1000)).toString() }));
    app.querySelectorAll('[data-ep-editar]').forEach(b => b.addEventListener('click', () => {
      const d = dets.find(x => String(x.id) === b.dataset.epEditar); if (!d) return;
      abrirForm({ id: d.id, nombre: d.nombre || '', estampado: d.estampado || '', numero: d.numero || '', calce: d.calce || '', manga: d.manga || 'Corta',
        arquero: !!d.arquero, obs: d.obs || '', tallas: Object.assign({}, tallasDe(d)), disenos: Object.assign({}, disenosDe(d)) });
    }));
    const borrarPersona = async (d, b) => {
      if (!confirm('¿Eliminar a ' + nomPersona(d) + (d.numero && String(d.nombre || '').trim() ? ' (N° ' + d.numero + ')' : '') + ' de la lista de tallas?\n\nSe quita de la ficha y no se puede deshacer.' +
        (f.estado === 'confirmado' ? '\n\nLa ficha ya está confirmada: si el pedido ya entró a producción, avisa el cambio al taller.' : ''))) return;
      if (b) b.disabled = true;
      try {
        await API.borrarPersona(d.id);
        await sincronizarAvisos(f, await API.detalles(f.ref));
        st.editPersona = null; render();
      } catch (e) { if (b) b.disabled = false; alert('No se pudo eliminar. ' + (e.message || '').slice(0, 120)); }
    };
    app.querySelectorAll('[data-ep-borrar]').forEach(b => b.addEventListener('click', () => {
      const d = dets.find(x => String(x.id) === b.dataset.epBorrar); if (d) borrarPersona(d, b);
    }));
    const formEp = document.getElementById('form-persona');
    if (formEp) {
      const ep = st.editPersona;
      if (st.epScroll) { st.epScroll = false; formEp.scrollIntoView({ block: 'start' }); }
      document.getElementById('ep-cancelar').addEventListener('click', () => { st.editPersona = null; render(); });
      const bEl = document.getElementById('ep-eliminar');
      if (bEl) bEl.addEventListener('click', () => { const d = dets.find(x => String(x.id) === String(ep.id)); if (d) borrarPersona(d, bEl); });
      document.getElementById('ep-guardar').addEventListener('click', async () => {
        const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const tallas = {};
        formEp.querySelectorAll('[data-ep-talla]').forEach(s2 => { if (s2.value) tallas[s2.dataset.epTalla] = s2.value; });
        const disenos = {};
        formEp.querySelectorAll('[data-ep-dis]').forEach(s2 => { if (s2.value && tallas[s2.dataset.epDis]) disenos[s2.dataset.epDis] = +s2.value; });
        const datos = { nombre: val('ep-nombre'), estampado: val('ep-estampado').toUpperCase(), numero: val('ep-numero').toUpperCase(), calce: val('ep-calce'),
          manga: Object.keys(tallas).some(k => basePrenda(k) === 'camiseta') ? (val('ep-manga') || 'Corta') : '', arquero: !!(document.getElementById('ep-arq') || {}).checked, obs: val('ep-obs'), tallas: tallas, disenos: disenos };
        Object.assign(ep, datos, { error: '' });   // si algo falta, el formulario queda con lo escrito
        // basta con el calce y la talla: el nombre y el número son opcionales
        const err = !Object.keys(tallas).length ? 'Marca la talla de al menos una prenda.' : !datos.calce ? 'Elige el calce.' : '';
        if (err) { ep.error = err; return render(); }
        const b = document.getElementById('ep-guardar'); b.disabled = true; b.textContent = 'Guardando…';
        try {
          if (ep.nuevo) await API.agregarPersona(Object.assign({ id: ep.id, ref: f.ref }, datos));
          else await API.editarPersona(ep.id, datos);
          await sincronizarAvisos(f, await API.detalles(f.ref));
          st.editPersona = null; render();
        } catch (e) { ep.error = 'No se pudo guardar. ' + (e.message || '').slice(0, 600); render(); }
      });
    }
    app.querySelectorAll('[data-arq]').forEach(b => b.addEventListener('click', async () => {
      const d = dets.find(x => String(x.id) === b.dataset.arq); if (!d) return;
      b.disabled = true;
      try { await API.marcarArquero(d.id, !d.arquero); render(); }
      catch (e) { b.disabled = false; b.textContent = 'Reintentar'; }
    }));
    app.querySelectorAll('[data-visto]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true; b.textContent = 'Guardando…';
      try { await API.verAviso(b.dataset.visto, st.usuario); render(); } catch (e) { b.disabled = false; b.textContent = 'Reintentar'; }
    }));
    app.querySelectorAll('[data-ajustar]').forEach(b => b.addEventListener('click', async () => {
      const a = avs.find(x => String(x.id) === b.dataset.ajustar);
      b.disabled = true; b.textContent = 'Ajustando…';
      const nuevos = items(f).map(i => Object.assign({}, i));
      const ex = nuevos.find(i => i.prenda === a.prenda);
      if (ex) ex.cant = a.agregadas; else nuevos.push({ prenda: a.prenda, cant: a.agregadas });
      // cada molde de esa prenda sube a lo que cargó el cliente en su calce
      const specs = JSON.parse(JSON.stringify(specsDe(f))), sp = specs[a.prenda];
      const cals = sp && sp.moldes ? Object.keys(sp.moldes).filter(c => sp.moldes[c]) : [];
      if (cals.length) {
        const un = sp.unidades = (sp.unidades && typeof sp.unidades === 'object') ? sp.unidades : {};
        cals.forEach(c => { const n = dets.filter(d => tallasDe(d)[a.prenda] && d.calce === c).length; un[c] = Math.max(typeof un[c] === 'number' ? un[c] : 0, n); });
        const suma = cals.reduce((n, c) => n + un[c], 0), it = ex || nuevos[nuevos.length - 1];
        if (cals.length === 1) un[cals[0]] = it.cant = Math.max(it.cant, suma); else it.cant = Math.max(it.cant, suma);
      }
      try {
        await API.itemsYSpecs(f.ref, nuevos, specs);
        await API.verAviso(a.id, st.usuario);
        const fn = Object.assign({}, f, { items: nuevos, specs: specs });
        await sincronizarAvisos(fn, dets);
        st.ficha = fn; render();
      } catch (e) { b.disabled = false; b.textContent = 'Reintentar'; }
    }));
  }

  /* ---- Editar todo el listado: todas las personas de la ficha en una sola pantalla.
     Se corrige en la misma grilla (número, nombre a estampar, persona, calce, manga, talla de cada prenda,
     arquero y observaciones), se marcan las que se eliminan (sin perder el lugar) y se guarda todo junto.
     Después se puede devolver la ficha al cliente para que revise y vuelva a confirmar. ---- */
  const filaEd = d => ({ id: String(d.id), nombre: d.nombre || '', estampado: d.estampado || '', numero: d.numero || '', calce: d.calce || '',
    manga: d.manga || '', arquero: !!d.arquero, obs: d.obs || '', tallas: Object.assign({}, tallasDe(d)), disenos: Object.assign({}, disenosDe(d)) });
  const firmaEd = x => JSON.stringify([x.nombre.trim(), x.estampado.trim().toUpperCase(), x.numero.trim().toUpperCase(), x.calce, x.manga, !!x.arquero, x.obs.trim(),
    Object.keys(x.tallas).filter(k => x.tallas[k]).sort().map(k => k + '=' + x.tallas[k]),
    Object.keys(x.disenos || {}).filter(k => +x.disenos[k] && x.tallas[k]).sort().map(k => k + '#' + x.disenos[k])]);
  const vaciaEd = x => !x.nombre.trim() && !x.estampado.trim() && !x.numero.trim() && !x.obs.trim() && !Object.keys(x.tallas).some(k => x.tallas[k]);
  // nada: fila nueva vacía o nueva y eliminada · igual: sin cambios
  const estadoEd = x => x.borrar ? (x.nuevo ? 'nada' : 'borrar') : x.nuevo ? (vaciaEd(x) ? 'nada' : 'nueva') : (firmaEd(x) !== x.orig ? 'cambio' : 'igual');
  const normEd = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const mensajeCliente = (f, nota) => 'Hola, hicimos algunos ajustes en la lista de tallas de tu pedido «' + (f.proyecto || f.ref) + '» (' + f.ref + ')' +
    (nota ? ': ' + nota.replace(/[.\s]+$/, '') : '') + '.\nPor favor revísala en este link y, si está todo bien, vuelve a enviarla con «Revisar y enviar a producción»:\n' + linkCliente(f);

  async function pantListadoEd() {
    const f = st.ficha;
    if (!f) { st.pant = 'lista'; return render(); }
    let ed = st.ed && st.ed.ref === f.ref ? st.ed : null;
    if (!ed) {
      app.innerHTML = barra(f.cliente, '') + '<div class="pmk-wrap"><div class="cargando">Cargando el listado…</div></div>';
      let dets;
      try { dets = await API.detalles(f.ref); }
      catch (e) { app.innerHTML = barra(f.cliente, 'ficha') + '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return; }
      const sp = specsDe(f);
      ed = st.ed = { ref: f.ref, ids: idsPersona(f, dets, prendasEnJuego(f, dets)), filas: dets.map(d => { const x = filaEd(d); x.orig = firmaEd(x); x.antes = { numero: x.numero, estampado: x.estampado, nombre: x.nombre }; return x; }),
        flags: {}, flagsOrig: {}, ver: '', q: '', foco: null };
      ed.ids.filter(numeroOpcional).forEach(id => { ed.flags[id] = ed.flagsOrig[id] = ((sp[id] || {}).numero) || ''; });
    }
    const listo = st.edListo && st.edListo.ref === f.ref ? st.edListo : null;
    const hayCam = ed.ids.some(id => basePrenda(id) === 'camiseta');
    const hayArq = hayCam && ed.filas.some(x => x.arquero);   // solo fichas antiguas: el arquero ahora es otro diseño
    const conEst = hayCam || ed.filas.some(x => x.estampado);
    const opts = (ops, v) => ops.concat(v && ops.indexOf(v) < 0 ? [v] : []).map(o => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o || '—') + '</option>').join('');
    const tallasPara = id => { const pr = prendaDe(id); return pr.escala ? pr.escala : pr.sinTalla ? ['Sí'] : TALLAS; };
    const nomCol = id => tieneNombreD(f, id) ? nomD(f, id) : nomDT(f, id).split(' o ')[0].replace(/ \(.*\)$/, '');
    const arqCorto = nombreArq(f) === 'Líbero' ? 'Líb.' : 'Arq.';
    const conDis = ed.ids.filter(id => disenosPrenda(f, id).length > 1);   // prendas cuyo molde tiene varios diseños
    const cols = ['28px', '64px'].concat(conEst ? ['minmax(90px, 1.1fr)'] : []).concat(['minmax(90px, 1.1fr)', '108px']).concat(hayCam ? ['98px'] : [])
      .concat(ed.ids.map(() => 'minmax(66px, 88px)')).concat(conDis.map(() => '64px')).concat(hayArq ? ['40px'] : []).concat(['minmax(80px, 1fr)', '36px']);
    const celda = (et, html, titulo) => '<label class="ed-c"' + (titulo ? ' title="' + esc(titulo) + '"' : '') + '><span class="ed-l">' + esc(et) + '</span>' + html + '</label>';
    const filaHTML = (x, i) => '<div class="ed-fila" data-fila="' + i + '"><span class="ed-idx">' + (i + 1) + '</span>' +
      celda('N°', '<input type="text" data-k="numero" maxlength="6" value="' + esc(x.numero) + '">') +
      (conEst ? celda('Nombre a estampar', '<input type="text" data-k="estampado" maxlength="20" value="' + esc(x.estampado) + '" style="text-transform:uppercase">') : '') +
      celda('Persona', '<input type="text" data-k="nombre" maxlength="60" value="' + esc(x.nombre) + '">') +
      celda('Calce', '<select data-k="calce">' + opts(['', 'Masculino', 'Femenino', 'Infantil'], x.calce) + '</select>') +
      (hayCam ? celda('Manga', '<select data-k="manga">' + opts(['', 'Corta', 'Larga'], x.manga) + '</select>') : '') +
      ed.ids.map(id => celda(nomCol(id), '<select data-t="' + esc(id) + '">' + opts([''].concat(tallasPara(id)), x.tallas[id] || '') + '</select>', nomDT(f, id))).join('') +
      conDis.map(id => celda('Diseño ' + nomCol(id).toLowerCase(), '<select data-dis="' + esc(id) + '"><option value="">—</option>' +
        disenosPrenda(f, id).map(n => '<option value="' + n + '"' + (+(x.disenos || {})[id] === n ? ' selected' : '') + '>D' + n + '</option>').join('') + '</select>', 'Diseño de ' + nomDT(f, id).toLowerCase())).join('') +
      (hayArq ? celda(nombreArq(f), '<input type="checkbox" data-k="arquero"' + (x.arquero ? ' checked' : '') + '>', nombreArq(f)) : '') +
      celda('Observaciones', '<input type="text" data-k="obs" maxlength="200" value="' + esc(x.obs) + '">') +
      '<button type="button" class="ed-x" data-ed-x title="Eliminar">✕</button></div>';

    let h = barra(f.cliente, '') + '<div class="pmk-wrap">' +
      '<div class="ed-top"><button class="btn plano chico" id="ed-volver">← Volver a la ficha</button></div>' +
      '<h1 class="tit" style="margin-top:14px">Editar listado</h1>' +
      '<p class="bajada">' + esc(f.ref) + ' · ' + esc(f.proyecto || '') + ' · ' + ed.filas.filter(x => !x.nuevo).length + ' personas. ' +
        'Corrige en la grilla, marca con ✕ las que se eliminan (se pueden recuperar antes de guardar) y guarda todo junto.</p>';
    if (f.estado === 'confirmado' && !listo) h += '<div class="aviso">La ficha está confirmada. Puedes cambiar todo; al guardar te ofrece devolvérsela al cliente para que revise los cambios y la vuelva a confirmar.' +
      ' Si el pedido ya entró a producción, avisa el cambio al taller.</div>';
    if (listo) {
      h += '<div class="ed-listo"><div class="aviso ok" style="margin-top:0">' + esc(listo.txt) + '</div>';
      if (listo.mensaje) {
        h += '<label for="ed-msj">Mensaje para el cliente (cópialo y envíaselo)</label><textarea id="ed-msj" readonly>' + esc(listo.mensaje) + '</textarea>' +
          '<div class="btn-par"><button class="btn" id="ed-copiar">Copiar mensaje</button>' +
          '<a class="btn plano" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(listo.mensaje) + '">Abrir WhatsApp</a></div>';
      } else if (!listo.cerrado) {
        h += '<div style="margin-top:10px"><b>Los cambios ya están guardados. ' + (f.estado === 'confirmado' ? '¿Además se la devuelves al cliente?' : '¿Además le avisas al cliente?') + '</b></div>' +
          '<div class="mini">' + (f.estado === 'confirmado'
            ? 'La ficha queda abierta: al entrar a su link, el cliente ve un aviso con tu mensaje, revisa la lista y la vuelve a confirmar.'
            : 'La ficha está abierta: el cliente ya ve los cambios en su link. Al avisarle, ve un aviso con tu mensaje para que revise y confirme.') + '</div>' +
          '<label for="ed-nota">Qué cambiaste (opcional, lo ve el cliente)</label><input type="text" id="ed-nota" maxlength="200" placeholder="Ej: quitamos los números de los shorts, que no llevan">' +
          '<div class="btn-par"><button class="btn" id="ed-devolver">' + (f.estado === 'confirmado' ? 'Devolver al cliente para revisión' : 'Avisar al cliente') + '</button>' +
          '<button class="btn plano" id="ed-no-devolver">' + (f.estado === 'confirmado' ? 'Mantener confirmada' : 'No por ahora') + '</button></div>';
      }
      h += '</div>';
    }
    const shorts = ed.ids.filter(numeroOpcional);
    if (shorts.length) h += '<div class="ed-flags">' + shorts.map(id => '<label>' + esc(nomDT(f, id)) + ': ¿lleva número?<select data-ed-flag="' + esc(id) + '">' +
        [['', 'Sin definir'], ['si', 'Sí, lleva número'], ['no', 'No, sin número']].map(o => '<option value="' + o[0] + '"' + (ed.flags[id] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
        '</select></label>').join('') +
      '<div class="ayuda">Si no lleva, su ficha de producción sale sin la columna de número. No hace falta borrar los números que haya.</div></div>';
    // diseños: repartir copias repetidas entre los diseños, o poner uno a todas las que no tienen
    const rep2 = repartoRepetidos(f, ed.filas, ed.ids);
    const sinDis = id => ed.filas.filter(x => !x.borrar && x.tallas[id] && disenosMolde(f, id, x.calce).length > 1 && !+(x.disenos || {})[id]).length;
    if (conDis.length) h += '<div class="ed-flags">' +
      (rep2.length ? '<div style="flex-basis:100%"><b>' + new Set(rep2.map(r => r.fila)).size + ' filas son personas cargadas más de una vez, sin diseño:</b> lo normal es una por diseño. ' +
        '<button class="btn plano chico" id="ed-repartir" style="width:auto;display:inline-block;margin:6px 0 0">Repartirlas: la primera al Diseño 1, la segunda al Diseño 2…</button></div>' : '') +
      conDis.map(id => { const n0 = sinDis(id); return n0 ? '<label>' + esc(nomDT(f, id)) + ': ' + n0 + ' sin diseño<span style="display:flex;gap:6px;flex-wrap:wrap">' +
        disenosPrenda(f, id).map(n => '<button class="btn plano chico" style="width:auto;margin:0" data-ed-todos="' + esc(id) + '|' + n + '">Todas → Diseño ' + n + '</button>').join('') + '</span></label>' : ''; }).join('') +
      '<div class="ayuda">Los diseños se definen al subir los montajes. Quien no tenga diseño sale en la ficha en una hoja «Diseño sin indicar». Nada se guarda hasta «Guardar cambios».</div></div>';
    h += '<div class="ed-herr"><label>Buscar<input type="text" id="ed-q" value="' + esc(ed.q) + '" placeholder="Número, nombre…"></label>' +
      '<label>Ver<select id="ed-ver">' + [['', 'Todas las personas']].concat(ed.ids.map(id => [id, 'Con ' + nomDT(f, id).toLowerCase()]))
        .concat([['_cambios', 'Solo las que cambian'], ['_borrar', 'Solo las que se eliminan']])
        .map(o => '<option value="' + esc(o[0]) + '"' + (ed.ver === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></label>' +
      '<button class="btn plano" id="ed-nueva">+ Agregar persona</button></div>' +
      '<div class="ed-tabla" id="ed-tabla" style="--ed-cols:' + cols.join(' ') + '">' +
      '<div class="ed-fila ed-cab"><span>#</span><span>N°</span>' + (conEst ? '<span>Nombre a estampar</span>' : '') + '<span title="No va en la ficha de producción">Persona</span><span>Calce</span>' +
        (hayCam ? '<span>Manga</span>' : '') + ed.ids.map(id => '<span title="' + esc(nomDT(f, id)) + '">' + esc(nomCol(id)) + '</span>').join('') +
        conDis.map(id => '<span title="Diseño de ' + esc(nomDT(f, id).toLowerCase()) + '">Dis. ' + esc(nomCol(id).toLowerCase()) + '</span>').join('') +
        (hayCam ? '<span title="' + esc(nombreArq(f)) + '">' + arqCorto + '</span>' : '') + '<span>Observaciones</span><span></span></div>' +
      ed.filas.map(filaHTML).join('') + '</div>' +
      '<div class="aviso error" id="ed-error" hidden></div>' +
      '<div class="ed-barra"><span class="ed-res" id="ed-res"></span><button class="btn plano" id="ed-descartar">Descartar cambios</button><button class="btn" id="ed-guardar">Guardar cambios</button></div>';
    app.innerHTML = h + pie + '</div>';

    const tabla = document.getElementById('ed-tabla');
    const filaDe = el => { const div = el.closest('[data-fila]'); return div ? { div: div, x: ed.filas[+div.dataset.fila] } : null; };
    const pintar = (div, x) => {
      const e = estadoEd(x);
      div.classList.toggle('cambiada', e === 'cambio'); div.classList.toggle('nueva', !!x.nuevo && !x.borrar);
      div.classList.toggle('borrada', !!x.borrar); div.classList.toggle('con-error', !!x.error);
      div.querySelectorAll('input, select').forEach(el => { el.disabled = !!x.borrar; });
      const bx = div.querySelector('[data-ed-x]'); bx.textContent = x.borrar ? '↺' : '✕'; bx.title = x.borrar ? 'Recuperar' : 'Eliminar';
    };
    // mismo número en el mismo calce: se marca (no impide guardar)
    const marcarRepetidos = () => {
      const cuenta = {};
      ed.filas.forEach(x => { const n = x.numero.trim().toUpperCase(); if (n && !x.borrar) cuenta[x.calce + '|' + n] = (cuenta[x.calce + '|' + n] || 0) + 1; });
      tabla.querySelectorAll('[data-fila]').forEach(div => { const x = ed.filas[+div.dataset.fila], inp = div.querySelector('[data-k=numero]');
        const r = !x.borrar && cuenta[x.calce + '|' + x.numero.trim().toUpperCase()] > 1;
        inp.classList.toggle('rep', r); inp.title = r ? 'Número repetido en ' + (x.calce || 'el mismo calce').toLowerCase() : ''; });
    };
    const cuenta = () => {
      const c = { cambio: 0, nueva: 0, borrar: 0 };
      ed.filas.forEach(x => { const e = estadoEd(x); if (c[e] != null) c[e]++; });
      c.flags = Object.keys(ed.flags).filter(id => ed.flags[id] !== ed.flagsOrig[id]).length;
      c.total = c.cambio + c.nueva + c.borrar + c.flags; return c;
    };
    const resumen = () => {
      const c = cuenta();
      const partes = [c.cambio && c.cambio + (c.cambio === 1 ? ' persona corregida' : ' personas corregidas'), c.nueva && c.nueva + (c.nueva === 1 ? ' nueva' : ' nuevas'),
        c.borrar && c.borrar + ' para eliminar', c.flags && 'número de ' + Object.keys(ed.flags).filter(id => ed.flags[id] !== ed.flagsOrig[id]).map(id => nomDT(f, id).toLowerCase()).join(' y ')].filter(Boolean);
      // recién guardado y sin nada nuevo: se dice que quedó guardado (no «sin cambios», que parecía que no se guardó)
      const res = document.getElementById('ed-res');
      res.textContent = partes.length ? 'Sin guardar: ' + partes.join(' · ') : listo ? '✓ Cambios guardados' : 'Sin cambios por guardar';
      res.classList.toggle('ed-ok', !partes.length && !!listo);
      document.getElementById('ed-guardar').disabled = !c.total;
      document.getElementById('ed-guardar').textContent = !c.total && listo ? 'Guardado ✓' : 'Guardar cambios';
      document.getElementById('ed-descartar').disabled = !c.total;
      window.onbeforeunload = c.total ? () => true : null;
    };
    const filtrar = () => {
      const q = normEd(ed.q).trim();
      tabla.querySelectorAll('[data-fila]').forEach(div => {
        const x = ed.filas[+div.dataset.fila], e = estadoEd(x);
        const okVer = !ed.ver || (ed.ver === '_cambios' ? (e !== 'igual' && e !== 'nada') : ed.ver === '_borrar' ? !!x.borrar : !!x.tallas[ed.ver] || !!x.nuevo);
        const okQ = !q || normEd([x.numero, x.estampado, x.nombre, x.obs].join(' ')).indexOf(q) >= 0;
        div.hidden = !(okVer && okQ);
      });
    };
    const leer = el => {
      const r = filaDe(el); if (!r) return;
      if (el.dataset.t) r.x.tallas[el.dataset.t] = el.value;
      else if (el.dataset.dis) { r.x.disenos = Object.assign({}, r.x.disenos); r.x.disenos[el.dataset.dis] = +el.value || 0; }
      else if (el.dataset.k === 'arquero') r.x.arquero = el.checked;
      else r.x[el.dataset.k] = el.value;
      r.x.error = ''; pintar(r.div, r.x); if (el.dataset.k === 'numero' || el.dataset.k === 'calce') marcarRepetidos(); resumen();
    };
    tabla.addEventListener('input', e => { if (e.target.matches('input[type=text]')) leer(e.target); });
    tabla.addEventListener('change', e => { if (e.target.matches('select, input[type=checkbox]')) leer(e.target); });
    tabla.addEventListener('click', e => {
      const b = e.target.closest('[data-ed-x]'); if (!b) return;
      const r = filaDe(b); r.x.borrar = !r.x.borrar; r.x.error = '';
      pintar(r.div, r.x); marcarRepetidos(); resumen();
    });
    tabla.querySelectorAll('[data-fila]').forEach(div => pintar(div, ed.filas[+div.dataset.fila]));
    marcarRepetidos(); resumen(); filtrar();
    app.querySelectorAll('[data-ed-flag]').forEach(el => el.addEventListener('change', () => { ed.flags[el.dataset.edFlag] = el.value; resumen(); }));
    const bRep = document.getElementById('ed-repartir');
    if (bRep) bRep.addEventListener('click', () => {
      repartoRepetidos(f, ed.filas, ed.ids).forEach(r => { const x = ed.filas[r.fila]; x.disenos = Object.assign({}, x.disenos, { [r.id]: r.diseno }); });
      render();
    });
    app.querySelectorAll('[data-ed-todos]').forEach(b => b.addEventListener('click', () => {
      const [id, n] = b.dataset.edTodos.split('|');
      ed.filas.forEach(x => { if (!x.borrar && x.tallas[id] && disenosMolde(f, id, x.calce).indexOf(+n) >= 0 && !+(x.disenos || {})[id]) x.disenos = Object.assign({}, x.disenos, { [id]: +n }); });
      render();
    }));
    document.getElementById('ed-q').addEventListener('input', e => { ed.q = e.target.value; filtrar(); });
    document.getElementById('ed-ver').addEventListener('change', e => { ed.ver = e.target.value; filtrar(); });
    document.getElementById('ed-nueva').addEventListener('click', () => {
      const ult = ed.filas.slice().reverse().find(x => !x.borrar && x.calce);
      ed.filas.push({ id: (Date.now() * 1000 + Math.floor(Math.random() * 1000)).toString(), nuevo: true, nombre: '', estampado: '', numero: '',
        calce: ult ? ult.calce : '', manga: hayCam ? 'Corta' : '', arquero: false, obs: '', tallas: {}, disenos: {} });
      ed.ver = ''; ed.q = ''; ed.foco = ed.filas.length - 1; render();
    });
    if (ed.foco != null) {
      const div = tabla.querySelector('[data-fila="' + ed.foco + '"]'); ed.foco = null;
      if (div) { div.scrollIntoView({ block: 'center' }); const inp = div.querySelector('input[type=text]'); if (inp) inp.focus(); }
    }
    const salir = () => {
      if (cuenta().total && !confirm('Hay cambios sin guardar. ¿Salir sin guardarlos?')) return;
      window.onbeforeunload = null; st.ed = null; st.edListo = null; st.pant = 'ficha'; st.pest = 'listado'; render();
    };
    document.getElementById('ed-volver').addEventListener('click', salir);
    document.getElementById('ed-descartar').addEventListener('click', () => {
      if (!confirm('¿Descartar los cambios sin guardar?')) return;
      window.onbeforeunload = null; st.ed = null; render();
    });
    document.getElementById('ed-guardar').addEventListener('click', async () => {
      const errEl = document.getElementById('ed-error');
      const malas = [];
      ed.filas.forEach((x, i) => {
        x.error = '';
        const e = estadoEd(x); if (e !== 'nueva' && e !== 'cambio') return;
        if (!Object.keys(x.tallas).some(k => x.tallas[k])) x.error = 'no lleva ninguna prenda (márcala con ✕ si se elimina)';
        else if (!x.calce) x.error = 'le falta el calce';
        if (x.error) malas.push(i);
      });
      tabla.querySelectorAll('[data-fila]').forEach(div => pintar(div, ed.filas[+div.dataset.fila]));
      if (malas.length) {
        errEl.hidden = false;
        errEl.textContent = 'Revisa ' + (malas.length === 1 ? 'la fila ' : 'las filas ') + malas.map(i => (i + 1) + ' (' + ed.filas[i].error + ')').join(', ') + '.';
        ed.ver = ''; ed.q = ''; document.getElementById('ed-ver').value = ''; document.getElementById('ed-q').value = ''; filtrar();
        const div = tabla.querySelector('[data-fila="' + malas[0] + '"]'); if (div) div.scrollIntoView({ block: 'center' });
        return;
      }
      errEl.hidden = true;
      const c = cuenta(); if (!c.total) return;
      const borrar = ed.filas.filter(x => estadoEd(x) === 'borrar');
      const cambian = ed.filas.filter(x => { const e = estadoEd(x); return e === 'nueva' || e === 'cambio'; });
      if (borrar.length && !confirm('Se eliminan ' + borrar.length + (borrar.length === 1 ? ' persona' : ' personas') + ' de la lista de tallas: ' +
        borrar.slice(0, 8).map(nomPersona).join(', ') + (borrar.length > 8 ? '…' : '') + '.\n\n¿Guardar los cambios?')) return;
      const b = document.getElementById('ed-guardar'); b.disabled = true; b.textContent = 'Guardando…';
      try {
        if (cambian.length) await API.guardarPersonas(cambian.map(x => {
          const t = {}; Object.keys(x.tallas).forEach(k => { if (x.tallas[k]) t[k] = x.tallas[k]; });
          const cam = Object.keys(t).some(k => basePrenda(k) === 'camiseta');
          const dis = {}; Object.keys(x.disenos || {}).forEach(k => { if (+x.disenos[k] && t[k]) dis[k] = +x.disenos[k]; });
          return { id: x.id, ref: f.ref, nombre: x.nombre.trim(), estampado: x.estampado.trim().toUpperCase(), numero: x.numero.trim().toUpperCase(), calce: x.calce,
            manga: cam ? (x.manga || 'Corta') : '', arquero: !!x.arquero, obs: x.obs.trim(), tallas: t, disenos: dis };
        }));
        if (borrar.length) await API.borrarPersonas(borrar.map(x => x.id));
        let fn = f;
        const flags = Object.keys(ed.flags).filter(id => ed.flags[id] !== ed.flagsOrig[id]);
        if (flags.length) {
          const r = await API.ficha(f.ref); const fr = r && r[0] ? r[0] : f;
          const specs = JSON.parse(JSON.stringify(specsDe(fr)));
          flags.forEach(id => { specs[id] = specs[id] || {}; if (ed.flags[id]) specs[id].numero = ed.flags[id]; else delete specs[id].numero; });
          await API.specsFicha(f.ref, specs); fn = Object.assign({}, fr, { specs: specs });
        }
        const quedan = await API.detalles(f.ref);
        await sincronizarAvisos(fn, quedan);
        st.ficha = fn;
        // si quedaron menos prendas que las vendidas, el cliente no podrá volver a confirmar hasta completarlas
        const bajo = prendasEnJuego(fn, quedan).map(id => ({ id: id, c: habilitado(fn, id), a: asignadas(quedan, id, fn) })).filter(x => x.a < x.c);
        // qué cambió en número, nombre a estampar y persona (para confirmar a simple vista que quedó guardado)
        const cambiosVisibles = cambian.filter(x => !x.nuevo && x.antes).flatMap(x => [['numero', 'N°'], ['estampado', 'estampa'], ['nombre', 'persona']]
          .filter(([k]) => String(x.antes[k] || '').trim().toUpperCase() !== String(x[k] || '').trim().toUpperCase())
          .map(([k, et]) => et + ' ' + (String(x.antes[k] || '').trim() || '(vacío)') + ' → ' + (String(x[k] || '').trim().toUpperCase() || '(vacío)')));
        const txt = [c.cambio && c.cambio + (c.cambio === 1 ? ' persona corregida' : ' personas corregidas') +
            (cambiosVisibles.length ? ' (' + cambiosVisibles.slice(0, 6).join(', ') + (cambiosVisibles.length > 6 ? '…' : '') + ')' : ''),
          c.nueva && c.nueva + (c.nueva === 1 ? ' agregada' : ' agregadas'),
          c.borrar && c.borrar + (c.borrar === 1 ? ' eliminada' : ' eliminadas'), c.flags && 'número de ' + flags.map(id => nomDT(f, id).toLowerCase()).join(' y ') + ' actualizado'].filter(Boolean);
        st.edListo = { ref: f.ref, txt: 'Cambios guardados: ' + txt.join(', ') + '.' + (bajo.length ? ' Ojo: quedan ' + bajo.map(x => x.a + ' de ' + x.c + ' ' + nomDT(f, x.id).toLowerCase()).join(', ') +
          ' vendidas. Si el pedido cambió, ajusta las cantidades en «Editar prendas y moldes»; si no, el cliente tendrá que completarlas antes de volver a confirmar.' : '') };
        window.onbeforeunload = null; st.ed = null;
        await render(); window.scrollTo({ top: 0 });
      } catch (e) {
        b.disabled = false; b.textContent = 'Guardar cambios';
        errEl.hidden = false; errEl.textContent = 'No se pudo guardar. ' + (e.message || '').slice(0, 600);
      }
    });
    const bNo = document.getElementById('ed-no-devolver');
    if (bNo) bNo.addEventListener('click', () => {
      listo.cerrado = true;
      listo.txt += f.estado === 'confirmado' ? ' La ficha sigue confirmada; no se le avisó al cliente.' : ' No se le avisó al cliente.';
      render(); window.scrollTo({ top: 0 });
    });
    const bDev = document.getElementById('ed-devolver');
    if (bDev) bDev.addEventListener('click', async () => {
      const nota = (document.getElementById('ed-nota').value || '').trim();
      bDev.disabled = true; bDev.textContent = 'Guardando…';
      try {
        const r = await API.ficha(f.ref); const fr = r && r[0] ? r[0] : f;
        const specs = JSON.parse(JSON.stringify(specsDe(fr)));
        specs._revision = { at: new Date().toISOString(), por: st.usuario || '', nota: nota };
        await API.devolverFicha(f.ref, specs);
        st.ficha = Object.assign({}, fr, { estado: 'abierto', confirmado_at: null, specs: specs });
        listo.txt += f.estado === 'confirmado' ? ' La ficha quedó abierta para que el cliente la revise y la vuelva a confirmar.' : ' El cliente verá el aviso al entrar a su link.';
        listo.mensaje = mensajeCliente(st.ficha, nota);
        render();
      } catch (e) { bDev.disabled = false; bDev.textContent = 'Reintentar'; alert('No se pudo guardar. ' + (e.message || '').slice(0, 140)); }
    });
    const bCop = document.getElementById('ed-copiar');
    if (bCop) bCop.addEventListener('click', () => {
      const ta = document.getElementById('ed-msj');
      (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => { bCop.textContent = 'Mensaje copiado'; })
        .catch(() => { ta.select(); document.execCommand('copy'); bCop.textContent = 'Mensaje copiado'; });
    });
  }

  // Editar o agregar una persona de la lista de tallas (lo mismo que carga el cliente)
  function formPersona(f, ep, ids) {
    const conTalla = Object.keys(ep.tallas || {}).filter(k => ep.tallas[k]);
    const prendas = Array.from(new Set(items(f).map(i => i.prenda).filter(id => !porCantidad(id)).concat(ids).concat(conTalla)));   // medias: por cantidad, no por persona
    const hayCam = prendas.some(id => basePrenda(id) === 'camiseta');
    const opciones = (ops, v) => ops.concat(v && ops.indexOf(v) < 0 ? [v] : []).map(o => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o || '—') + '</option>').join('');
    const tallasPara = id => { const p = prendaDe(id); return p.escala ? p.escala : p.sinTalla ? ['Sí'] : TALLAS; };
    return '<div class="ep-form" id="form-persona"><div class="lab-mini" style="font-size:14px">' + (ep.nuevo ? 'Agregar persona' : 'Editar persona') + '</div>' +
      (f.estado === 'confirmado' ? '<div class="aviso" style="margin-top:8px">La ficha ya está confirmada. Si el pedido ya entró a producción, avisa el cambio al taller; la ficha de producción toma el cambio al volver a descargarla.</div>' : '') +
      '<div class="ep-grid">' +
        '<label>Nombre de la persona <span class="mini">(opcional)</span><input type="text" id="ep-nombre" maxlength="60" value="' + esc(ep.nombre) + '"></label>' +
        '<label>Nombre a estampar<input type="text" id="ep-estampado" maxlength="20" value="' + esc(ep.estampado) + '" placeholder="Vacío si no lleva" style="text-transform:uppercase"></label>' +
        '<label>Número<input type="text" id="ep-numero" maxlength="6" value="' + esc(ep.numero) + '"></label>' +
        '<label>Calce<select id="ep-calce">' + opciones(['', 'Masculino', 'Femenino', 'Infantil'], ep.calce) + '</select></label>' +
        (hayCam ? '<label>Manga<select id="ep-manga">' + opciones(['Corta', 'Larga'], ep.manga || 'Corta') + '</select></label>' : '') +
        prendas.map(id => '<label>' + esc(nomDT(f, id)) + '<select data-ep-talla="' + esc(id) + '"><option value="">No lleva</option>' +
          opciones(tallasPara(id), (ep.tallas || {})[id] || '').replace('<option value="" selected>—</option>', '') + '</select></label>' +
          (disenosPrenda(f, id).length > 1 ? '<label>Diseño de ' + esc(prendaDe(id).nom.toLowerCase()) + '<select data-ep-dis="' + esc(id) + '"><option value="">—</option>' +
            disenosPrenda(f, id).map(n => '<option value="' + n + '"' + (+(ep.disenos || {})[id] === n ? ' selected' : '') + '>Diseño ' + n + '</option>').join('') + '</select></label>' : '')).join('') +
      '</div>' +
      (ep.arquero ? '<label class="ep-chk"><input type="checkbox" id="ep-arq" checked> ' + esc(nombreArq(f)) + ' <span class="mini">(ficha antigua: ahora el arquero es otro diseño)</span></label>' : '') +
      '<label class="ep-obs" style="margin-top:10px">Observaciones<input type="text" id="ep-obs" maxlength="200" value="' + esc(ep.obs) + '"></label>' +
      (ep.error ? '<div class="aviso error" style="margin-top:10px">' + esc(ep.error) + '</div>' : '') +
      '<div class="btn-par"><button class="btn" id="ep-guardar">' + (ep.nuevo ? 'Agregar' : 'Guardar cambios') + '</button><button class="btn plano" id="ep-cancelar">Cancelar</button></div>' +
      (ep.nuevo ? '' : '<button class="btn plano chico" id="ep-eliminar" style="color:var(--rojo);border-color:var(--rojo)">Eliminar persona</button>') + '</div>';
  }
  function tablaDetalle(f, dets, ids) {
    const cols = ids.map(id => prendaDe(id));
    const hayCam = ids.some(id => basePrenda(id) === 'camiseta');
    const hayArq = dets.some(d => d.arquero);   // solo fichas antiguas: el arquero ahora es otro diseño (otra línea del molde)
    let h = '<div class="tabla-scroll"><table><thead><tr><th>#</th><th>Persona <span class="mini">(no va en la ficha)</span></th><th>Nombre a estampar</th><th>N°</th><th>Calce</th>' +
      (hayCam ? '<th>Manga</th>' : '') + cols.map(p => '<th>' + esc(nomDT(f, p.id)) + '</th>').join('') +
      (hayArq ? '<th>' + esc(nombreArq(f)) + '</th>' : '') + '<th>Observaciones</th><th></th></tr></thead><tbody>';
    dets.forEach((d, i) => {
      const t = tallasDe(d);
      h += '<tr><td>' + (i + 1) + '</td><td>' + (String(d.nombre || '').trim() ? esc(d.nombre) : '<span class="mini">sin nombre</span>') + '</td><td>' + esc(d.estampado || '—') + '</td>' +
        '<td>' + esc(d.numero || '—') + '</td><td>' + esc(d.calce) + '</td>' + (hayCam ? '<td>' + esc(d.manga || '—') + '</td>' : '') +
        cols.map(p => { const dz = t[p.id] ? disenoPersona(f, d, p.id) : null;
          return '<td>' + esc(t[p.id] || '—') + (dz ? ' <span class="mini">· D' + dz + '</span>' : dz === 0 ? ' <span class="mini" style="color:var(--rojo)">· sin diseño</span>' : '') + '</td>'; }).join('') +
        (hayArq ? '<td><button type="button" class="chip' + (d.arquero ? ' on' : '') + '" data-arq="' + esc(d.id) + '" aria-pressed="' + !!d.arquero + '">' +
        (d.arquero ? '✓ ' + esc(nombreArq(f).replace(' o líbero', '/líbero')) : 'No') + '</button></td>' : '') + '<td>' + esc(d.obs || '') + '</td>' +
        '<td class="ep-acc"><button type="button" class="btn plano chico" data-ep-editar="' + esc(d.id) + '">Editar</button>' +
        '<button type="button" class="btn plano chico" data-ep-borrar="' + esc(d.id) + '" style="color:var(--rojo)">Eliminar</button></td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  /* ---- fichas de producción: una hoja por prenda × manga × jugador/arquero,
     igual que el Excel "Fichas - Cancha". El navegador las guarda como PDF. ---- */
  const ORDEN_MANGA = ['Corta', 'Larga', 'Sin mangas'];
  const ORDEN_CALCE = ['Masculino', 'Femenino', 'Infantil'];
  const normManga = m => { const s = String(m || 'Corta').trim().toLowerCase();
    return s.indexOf('larg') === 0 ? 'Larga' : (s.indexOf('sin') === 0 ? 'Sin mangas' : 'Corta'); };
  const idxOr = (lista, v) => { const i = lista.indexOf(v); return i < 0 ? 99 : i; };
  // Manga según el código del molde: …01 manga clásica y …02 manga raglán (corta o larga) · …03 sin mangas.
  // Molde sin mangas (…03, y la E02 por su guía): esa prenda es sin mangas para todos, diga lo que diga la persona
  const serieManga = cod => { const m = String(cod || '').trim().toUpperCase().match(/(\d{2})(?:PRO|RE)?$/); return m ? m[1] : ''; };
  const moldeSinMangas = v => { v = String(v || ''); if (!v) return false; if (esManual(v)) return /sin mangas/i.test(v);
    if (serieManga(v.split('|')[0]) === '03') return true;
    const m = MOLDES.find(x => x.n === +v.split('|')[1]); return !!m && /sin mangas/i.test(m.e); };
  // largo de manga de una persona en una prenda: el del molde si es sin mangas; si no, el que eligió (es el de su camiseta con mangas)
  const mangaEn = (f, id, d) => moldeSinMangas((((specsDe(f) || {})[id] || {}).moldes || {})[d.calce]) ? 'Sin mangas' : normManga(d.manga);

  const fechaCierre = f => f.ventas_id && f.entrega ? f.entrega : (f.created_at || '').slice(0, 10);
  const aprobacionTxt = f => f.montaje_aprobado
    ? 'Aprobado ' + (/^Diseño · /.test(f.montaje_aprobado_por || '') ? 'en ' : 'por ') + (f.montaje_aprobado_por || 'sin registro') + (f.montaje_aprobado_at ? ' · ' + fechaTxt(f.montaje_aprobado_at) : '')
    : '';
  const datosPedido = (f, entD) => {
    const dato = (et, v) => '<div class="dt"><span>' + et + '</span><b>' + (v ? esc(v) : '—') + '</b></div>';
    return dato('Club o empresa', f.cliente) + dato('Nombre del proyecto', f.proyecto) + dato('N° de proyecto', f.ref) + dato('Vendedor', f.vendedor) +
      dato('Fecha de cierre', fechaCierre(f) ? fechaTxt(fechaCierre(f)) : '') +
      dato('Entrega interna', f.entrega_interna ? fechaTxt(f.entrega_interna) : 'por definir') +
      (entD ? dato('Entrega de este diseño', fechaTxt(entD)) : dato('Entrega al cliente', f.entrega_cliente ? fechaTxt(f.entrega_cliente) : 'por definir'));
  };

  function armarFichas(f, dets, ids) {
    const res = [];
    ids.forEach(id => {
      const p = prendaDe(id);
      const cq = porCantidad(id) ? cantidadesDe(f, id) : null;
      if (cq) { if (sumaCant(cq)) res.push({ id: id, p: p, cantidades: cq, unidades: sumaCant(cq), titulo: tieneNombreD(f, id) ? tipoDe(id) : p.nom, grupo: '', dets: [] }); return; }
      const con = dets.filter(d => tallasDe(d)[id]);
      if (!con.length) return;
      const hayArq = con.some(d => d.arquero);
      const mangas = p.manga ? ORDEN_MANGA.filter(m => con.some(d => mangaEn(f, id, d) === m)) : [null];
      // Una hoja por cada montaje: si los montajes de la prenda son de un molde en particular, una hoja por molde
      // (cada una con su montaje y sus tallas); y si el molde tiene varios diseños, una por diseño (0 = no indicado)
      const mDe = d => moldeDe(f, id, d.calce);
      const moldesP = Array.from(new Set(con.map(mDe))).sort((a, b) =>
        Math.min(...con.filter(d => mDe(d) === a).map(d => idxOr(ORDEN_CALCE, d.calce))) - Math.min(...con.filter(d => mDe(d) === b).map(d => idxOr(ORDEN_CALCE, d.calce))));
      const porMolde = moldesP.length > 1 && imgsDe(f).some(i => prendasImg(i).indexOf(id) >= 0 && moldesImg(i).length);
      const dz = d => disenoPersona(f, d, id);
      (porMolde ? moldesP : [null]).forEach(mv => {
        const conM = mv === null ? con : con.filter(d => mDe(d) === mv);
        const disenos = Array.from(new Set(conM.map(dz))).sort((a, b) => (a === null ? -1 : a === 0 ? 99 : a) - (b === null ? -1 : b === 0 ? 99 : b));
        mangas.forEach(m => disenos.forEach(dis => [false, true].forEach(arq => {
          const grupo = conM.filter(d => (m === null || mangaEn(f, id, d) === m) && !!d.arquero === arq && dz(d) === dis);
          if (!grupo.length) return;
          const titulo = (tieneNombreD(f, id) ? tipoDe(id) : p.nom) + (m ? (m === 'Sin mangas' ? ' sin mangas' : ' manga ' + m.toLowerCase()) : '');
          res.push({ id: id, p: p, manga: m, arquero: arq, diseno: dis, molde: mv, titulo: titulo,
            grupo: [mv === null ? '' : mv ? moldeTxt(mv) : 'Sin molde', dis === null ? '' : dis ? 'Diseño ' + dis : 'Diseño sin indicar',
              hayArq ? (arq ? 'Arqueros' : 'Jugadores') : ''].filter(Boolean).join(' · '), dets: grupo });
        })));
      });
    });
    return res;
  }

  // Resumen de tallas como en la planilla: adulto (masculino / femenino) al lado de infantil
  function tablaTallas(fi) {
    const id = fi.id, p = fi.p, cnt = {};
    fi.dets.forEach(d => { const t = tallasDe(d)[id], c = d.calce || 'Sin calce';
      (cnt[c] = cnt[c] || {})[t] = (cnt[c][t] || 0) + 1; });
    const n = (c, t) => (cnt[c] && cnt[c][t]) || 0;
    const celda = v => '<td class="num' + (v ? '' : ' cero') + '">' + (v || '·') + '</td>';
    if (p.escala || p.sinTalla) {
      const todas = {}; Object.keys(cnt).forEach(c => Object.keys(cnt[c]).forEach(t => { todas[t] = (todas[t] || 0) + cnt[c][t]; }));
      const orden = p.escala ? p.escala.filter(t => todas[t]).concat(Object.keys(todas).filter(t => p.escala.indexOf(t) < 0)) : Object.keys(todas);
      return '<table class="tt"><thead><tr><th>Talla</th><th>Cantidad</th></tr></thead><tbody>' +
        orden.map(t => '<tr><td>' + esc(t) + '</td>' + celda(todas[t]) + '</tr>').join('') +
        '</tbody><tfoot><tr><td>Total</td><td class="num">' + fi.dets.length + '</td></tr></tfoot></table>';
    }
    let h = '<table class="tt"><thead><tr><th>Talla</th><th>Masculino</th><th>Femenino</th><th class="sep">Talla</th><th>Infantil</th></tr></thead><tbody>';
    const AD = TALLAS_AD.filter(t => (t !== 'XXS' && t !== 'XXXXL') || n('Masculino', t) || n('Femenino', t));   // XXS y XXXXL solo si alguien la pidió
    for (let i = 0; i < Math.max(AD.length, TALLAS_INF.length); i++) {
      const ta = AD[i], ti = TALLAS_INF[i];
      h += '<tr><td>' + (ta || '') + '</td>' + (ta ? celda(n('Masculino', ta)) + celda(n('Femenino', ta)) : '<td></td><td></td>') +
        '<td class="sep">' + (ti || '') + '</td>' + (ti ? celda(n('Infantil', ti)) : '<td></td>') + '</tr>';
    }
    const sub = c => Object.keys(cnt[c] || {}).reduce((s, t) => s + cnt[c][t], 0);
    h += '</tbody><tfoot><tr><td>Subtotal</td><td class="num">' + sub('Masculino') + '</td><td class="num">' + sub('Femenino') +
      '</td><td class="sep"></td><td class="num">' + sub('Infantil') + '</td></tr>' +
      '<tr class="total"><td>Total</td><td class="num" colspan="4">' + fi.dets.length + ' unidades</td></tr></tfoot></table>';
    // tallas que no calzan con la grilla (por ejemplo, una talla infantil marcada como masculino)
    const raras = [];
    Object.keys(cnt).forEach(c => Object.keys(cnt[c]).forEach(t => {
      const ok = (c === 'Masculino' || c === 'Femenino') ? TALLAS_AD.indexOf(t) >= 0 : (c === 'Infantil' && TALLAS_INF.indexOf(t) >= 0);
      if (!ok) raras.push(c + ' ' + t + ' × ' + cnt[c][t]);
    }));
    if (raras.length) h += '<div class="alerta">⚠ Fuera de la grilla: ' + esc(raras.join(' · ')) + '</div>';
    return h;
  }

  // cómo se identifica a una persona en lo que va a producción: número y nombre estampado, nunca su nombre
  const idEstampado = d => [d.numero ? 'N° ' + d.numero : '', String(d.estampado || '').trim()].filter(Boolean).join(' ') || 'sin número ni nombre';

  const unidadesHoja = fi => fi.cantidades ? fi.unidades : fi.dets.length;
  // Hoja de medias: van por pares por talla, con su montaje (otro color es otra línea de medias, en su propia hoja)
  function hojaMedias(f, fi, k, total, hoy) {
    const sp = specsDe(f)[fi.id] || {}, nd = tieneNombreD(f, fi.id) ? nomD(f, fi.id) : '';
    const dato = (et, v) => '<div class="dt"><span>' + et + '</span><b>' + (v ? esc(v) : '—') + '</b></div>';
    const imgs = imgsDe(f).filter(i => prendasImg(i).indexOf(fi.id) >= 0);
    const tabla = '<table class="tt"><thead><tr><th>Talla</th><th>Pares</th></tr></thead><tbody>' +
      tallasCant(fi.cantidades).map(t => '<tr><td>' + esc(t) + '</td><td class="num">' + (parseInt(fi.cantidades[t], 10) || 0) + '</td></tr>').join('') +
      '</tbody><tfoot><tr class="total"><td>Total</td><td class="num">' + fi.unidades + ' pares</td></tr></tfoot></table>';
    return '<section class="fp">' +
      '<div class="fp-cab"><div class="marca-hoja"><img class="iso-hoja" src="' + ISO + '" alt="">' +
        '<div><div class="logo">PLAY<em>MAKER</em></div><div class="doc">Ficha de producción · ' + (k + 1) + ' de ' + total + '</div></div></div>' +
        '<div class="fp-tit"><div class="prenda">' + esc(fi.titulo) + '</div>' + (nd ? '<div class="diseno-hoja">' + esc(nd) + '</div>' : '') + '</div>' +
        '<div class="refbox"><div class="r">' + esc(f.ref) + '</div><div class="doc">' + esc(fechaTxt(hoy)) + '</div></div></div>' +
      '<div class="fp-datos">' + datosPedido(f, sp.entrega) + dato('Pares de este diseño', String(fi.unidades)) + dato('Origen', sp.origen) + '</div>' +
      '<div class="fp-medio"><div class="fp-montaje"><h3>Montaje' + (nd ? ' · ' + esc(nd) : '') + '</h3>' +
        (f.montaje_aprobado ? '<div class="aprob">' + esc(aprobacionTxt(f)) + '</div>' : '') +
        (imgs.length ? '<div class="mj' + (imgs.length > 1 ? ' dos' : '') + '">' + imgs.slice(0, 4).map(i => '<figure><img src="' + esc(i.url) + '" alt="">' +
          '<figcaption>' + esc(i.vista || i.nombre || '') + '</figcaption></figure>').join('') + '</div>' : '<div class="vacio">Sin montaje cargado para estas medias</div>') + '</div>' +
        '<div class="fp-tallas"><h3>Pares por talla</h3>' + tabla + '</div></div>' +
      '<div class="fp-com"><h3>Comentarios</h3><div class="caja">' + esc(sp.nota || '') + '</div></div>' +
      '<div class="firma"><div>Bodega o compra</div><div>Control de calidad</div></div>' +
      '<div class="fp-pie">' + esc(f.ref) + ' · ' + (nd ? esc(nd) + ' · ' : '') + esc(fi.titulo) + ' · hoja ' + (k + 1) + ' de ' + total + '</div>' +
      '</section>';
  }

  function fichaHoja(f, fi, k, total, hoy) {
    if (fi.cantidades) return hojaMedias(f, fi, k, total, hoy);
    const sp = specsDe(f)[fi.id] || {}, mo = sp.moldes || {};
    // diseño con nombre: el nombre y su molde van bajo el título de la hoja y en el título de cada sección
    const nd = tieneNombreD(f, fi.id) ? nomD(f, fi.id) : '';
    const mTxt = fi.molde ? moldeCorto(fi.molde) : moldesDiseno(sp);
    const tit = (t, conMolde) => esc(nd ? t + ' · ' + nd + (conMolde && mTxt ? ' (' + mTxt + ')' : '') : t);
    const dato = (et, v) => '<div class="dt"><span>' + et + '</span><b>' + (v ? esc(v) : '—') + '</b></div>';
    const moldes = (fi.molde ? ORDEN_CALCE.filter(c => mo[c] === fi.molde).join(' y ') + ': ' + moldeTxt(fi.molde) : '') ||
      ORDEN_CALCE.filter(c => mo[c]).map(c => c + ': ' + moldeTxt(mo[c])).join(' · ') || sp.molde || '';
    const dp = sp.despiece && sp.despiece.piezas && sp.despiece.piezas.length ? sp.despiece : null;
    const despiece = dp
      ? '<table class="tp dsp"><thead><tr><th>Pieza</th><th class="num">Por prenda</th><th>Tela</th><th>Detalle</th><th class="num">Total a cortar</th></tr></thead><tbody>' +
        dp.piezas.map(q => '<tr><td><b>' + esc(q.pieza) + '</b></td><td class="num">' + (q.cant || 1) + '</td><td>' + esc(q.tela || '—') + '</td>' +
          '<td>' + esc(q.detalle || '') + '</td><td class="num"><b>' + ((q.cant || 1) * fi.dets.length) + '</b></td></tr>').join('') + '</tbody></table>'
      : '<div class="vacio chico">Sin despiece definido. Elige el molde en la ficha técnica y carga sus piezas.</div>';
    const tela = sp.tela ? sp.tela + (sp.telaDetalle ? ' / ' + sp.telaDetalle : '') : '';
    // jugadores: los montajes de jugador · arqueros o líberos: el suyo (si no se cargó, el de jugador, con aviso)
    // montajes de esta hoja: de la prenda, de los moldes de estas personas y, si hay varios diseños, del suyo
    const vs = fi.dets.map(d => moldeDe(f, fi.id, d.calce)).filter(Boolean);
    const deLaPrenda = imgsDe(f).filter(i => prendasImg(i).indexOf(fi.id) >= 0 && (!moldesImg(i).length || moldesImg(i).some(v => vs.indexOf(v) >= 0)) &&
      (!fi.diseno || disenoImg(i) === fi.diseno)), deArq = deLaPrenda.filter(i => i.arquero);
    const conDiseno = fi.diseno !== null && fi.diseno !== undefined;
    const imgs = fi.arquero ? (deArq.length ? deArq : deLaPrenda) : deLaPrenda.filter(i => !i.arquero);
    const sinMontajeArq = fi.arquero && !deArq.length && imgs.length;

    // personas ordenadas como se corta: calce, talla y número
    const orden = fi.dets.slice().sort((a, b) =>
      idxOr(ORDEN_CALCE, a.calce) - idxOr(ORDEN_CALCE, b.calce) ||
      idxOr(TALLAS, tallasDe(a)[fi.id]) - idxOr(TALLAS, tallasDe(b)[fi.id]) ||
      (parseInt(a.numero, 10) || 999) - (parseInt(b.numero, 10) || 999));
    const hayObs = orden.some(d => (d.obs || '').trim());
    const conManga = !!fi.p.manga;
    // En la ficha solo va el nombre que se estampa: el nombre de la persona no se imprime, para no confundirlo
    // con lo que hay que estampar. Si nadie lleva nombre estampado, la ficha va sin columna de nombre.
    const conNombre = orden.some(d => String(d.estampado || '').trim());
    // short o calza: si se definió que no lleva número, la hoja va sin esa columna; si lleva, siempre con ella
    const lleva = numeroOpcional(fi.id) ? llevaNumero(f, fi.id) : null;
    const conNumero = lleva !== null ? lleva : (!!fi.p.estampado || orden.some(d => String(d.numero || '').trim()));
    // orden de las columnas: #, calce (masculino, femenino o infantil), talla, manga, número y nombre a estampar
    const filas = orden.map((d, i) => '<tr><td class="chk"></td><td class="num">' + (i + 1) + '</td>' +
      '<td>' + (['Masculino', 'Femenino', 'Infantil'].indexOf(d.calce) >= 0 ? d.calce : '—') + '</td>' +
      '<td class="num"><b>' + esc(tallasDe(d)[fi.id] || '') + '</b></td>' +
      (conManga ? '<td>' + esc(mangaEn(f, fi.id, d)) + '</td>' : '') +
      (conNumero ? '<td class="num"><b>' + esc(d.numero || '') + '</b></td>' : '') +
      (conNombre ? '<td><b>' + esc(d.estampado || '') + '</b></td>' : '') +
      (hayObs ? '<td class="obs">' + esc(d.obs || '') + '</td>' : '') + '</tr>').join('');

    // números repetidos dentro de esta ficha (con el nombre estampado, si lo llevan)
    const porNum = {};
    fi.dets.forEach(d => { const nu = String(d.numero || '').trim(); if (nu) (porNum[nu] = porNum[nu] || []).push(String(d.estampado || '').trim()); });
    const rep = conNumero ? Object.keys(porNum).filter(nu => porNum[nu].length > 1) : [];

    return '<section class="fp">' +
      '<div class="fp-cab"><div class="marca-hoja"><img class="iso-hoja" src="' + ISO + '" alt="">' +
        '<div><div class="logo">PLAY<em>MAKER</em></div><div class="doc">Ficha de producción · ' + (k + 1) + ' de ' + total + '</div></div></div>' +
        '<div class="fp-tit"><div class="prenda">' + esc(fi.titulo) + '</div>' +
          (nd ? '<div class="diseno-hoja">' + esc(nd) + (mTxt ? ' <span>(' + esc(mTxt) + ')</span>' : '') + '</div>' : '') + (fi.grupo ? '<div class="grupo' + (fi.arquero ? ' arq' : '') + '">' + fi.grupo + '</div>' : '') + '</div>' +
        '<div class="refbox"><div class="r">' + esc(f.ref) + '</div><div class="doc">' + esc(fechaTxt(hoy)) + '</div></div></div>' +
      '<div class="fp-datos">' + datosPedido(f, sp.entrega) + dato('Unidades de esta ficha', String(fi.dets.length)) +
        '<div class="dt doble"><span>Molde (catálogo vigente)</span><b>' + (moldes ? esc(moldes) : '—') + '</b></div>' + dato('Tela principal', tela) +
        (fi.p.origen ? dato('Origen', sp.origen) : dato('Aplicación / escudo', sp.aplicacion)) +
        (lleva !== null ? dato('Número', lleva ? 'Sí lleva' : 'No lleva') : '') + '</div>' +
      '<div class="fp-medio"><div class="fp-montaje"><h3>' + tit('Montaje', true) + '</h3>' +
        (f.montaje_aprobado ? '<div class="aprob">' + esc(aprobacionTxt(f)) + '</div>' : '') +
        (sinMontajeArq ? '<div class="aprob">Sin montaje propio de ' + esc(nombreArq(f).toLowerCase()) + ': se muestra el de los jugadores</div>' : '') +
        (fi.diseno === 0 ? '<div class="aprob">Estas personas no tienen el diseño indicado. Arriba van los montajes de todos los diseños de este molde: ' +
          'indica el de cada una en «Editar todo el listado» y vuelve a descargar la ficha.</div>' : '') +
        (imgs.length ? '<div class="mj' + (imgs.length > 1 ? ' dos' : '') + '">' + imgs.slice(0, 4).map(i => '<figure><img src="' + esc(i.url) + '" alt="">' +
          '<figcaption>' + esc((i.vista || i.nombre || '') + (conDiseno ? ' · Diseño ' + disenoImg(i) : '') + (i.arquero ? ' · ' + nombreArq(f) : '')) + '</figcaption></figure>').join('') + '</div>'
          : '<div class="vacio">Sin montaje cargado para esta prenda</div>') + '</div>' +
        '<div class="fp-tallas"><h3>' + tit('Resumen de tallas') + '</h3>' + tablaTallas(fi) + '</div></div>' +
      (fi.p.origen ? '' : '<h3>' + tit('Despiece y telas', true) + '</h3>' + despiece) +
      (rep.length ? '<div class="alerta">⚠ Número repetido: ' + rep.map(nu => 'N° ' + esc(nu) + ' (' + porNum[nu].length + ' veces' + (porNum[nu].some(Boolean) ? ': ' + esc(porNum[nu].map(x => x || 'sin nombre').join(', ')) : '') + ')').join(' · ') + '</div>' : '') +
      '<h3>Detalle de ' + (nd ? esc(nd) + ' · ' : '') + esc(fi.titulo.toLowerCase()) + (fi.grupo ? ' · ' + fi.grupo.toLowerCase() : '') + '</h3>' +
      '<table class="tp"><thead><tr><th class="chk">✓</th><th>#</th><th>Calce</th><th class="num">Talla</th>' +
        (conManga ? '<th>Manga</th>' : '') + (conNumero ? '<th class="num">N°</th>' : '') + (conNombre ? '<th>Nombre a estampar</th>' : '') +
        (hayObs ? '<th>Observaciones</th>' : '') + '</tr></thead><tbody>' + filas + '</tbody></table>' +
      '<div class="fp-com"><h3>' + tit('Comentarios') + '</h3><div class="caja">' + esc(sp.nota || '') + '</div></div>' +
      '<div class="firma"><div>Corte</div><div>Confección</div><div>Control de calidad</div></div>' +
      '<div class="fp-pie">' + esc(f.ref) + ' · ' + (nd ? esc(nd) + ' · ' : '') + esc(fi.titulo) + (fi.grupo ? ' · ' + fi.grupo : '') + ' · hoja ' + (k + 1) + ' de ' + total + '</div>' +
      '</section>';
  }

  // Ficha en PDF de solo lectura: Producción la abre desde las áreas (?pdf=COT-123) sin entrar al panel ni poder editar
  const barraSoloPDF = f => '<div class="pmk-top no-print"><img class="iso" src="' + ISO + '" alt="">' +
    '<div><div class="marca">PLAY<em>MAKER</em></div><div class="sub">Ficha de producción · ' + esc(f.ref) + ' · solo lectura</div></div>' +
    '<div class="pmk-acc"><button class="pmk-volver" onclick="window.close()">Cerrar</button></div></div>';
  async function abrirSoloPDF(ref) {
    st.soloPDF = true;
    app.innerHTML = '<div class="pmk-wrap"><div class="cargando">Cargando la ficha ' + esc(ref) + '…</div></div>';
    try {
      const r = await API.ficha(ref);
      if (!r || !r.length) { app.innerHTML = '<div class="pmk-wrap"><div class="aviso">No existe una ficha para ' + esc(ref) + '.</div>' + pie + '</div>'; return; }
      st.ficha = r[0]; st.dets = await API.detalles(st.ficha.ref) || [];
    } catch (e) { app.innerHTML = '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return; }
    st.pant = 'pdf'; render();
  }

  function pantPDF() {
    const f = st.ficha, dets = st.dets, ids = prendasEnJuego(f, dets);
    const av = avanceFicha(f, dets);
    const hoy = new Date().toISOString().slice(0, 10);
    const fichas = armarFichas(f, dets, ids);
    const arq = dets.filter(d => d.arquero);

    // portada: datos del pedido e índice de fichas
    const faltan = ids.map(id => ({ p: prendaDe(id), n: nomDT(f, id), c: habilitado(f, id), a: asignadas(dets, id, f) })).filter(x => x.c && x.a !== x.c);
    // diseños con fecha de entrega propia: la portada la muestra en cada hoja
    const entD = fi => (specsDe(f)[fi.id] || {}).entrega || '', conEntD = fichas.some(fi => entD(fi));
    const portada = '<section class="fp portada">' +
      '<div class="fp-cab"><div class="marca-hoja"><img class="iso-hoja" src="' + ISO + '" alt="">' +
        '<div><div class="logo">PLAY<em>MAKER</em></div><div class="doc">Fichas de producción · resumen del pedido</div></div></div>' +
        '<div class="refbox"><div class="r">' + esc(f.ref) + '</div><div class="doc">' + esc(fechaTxt(hoy)) + '</div></div></div>' +
      '<div class="fp-datos">' + datosPedido(f) +
        '<div class="dt"><span>Diseño</span><b>' + esc(aprobacionTxt(f) || '—') + '</b></div>' +
        '<div class="dt"><span>Personas</span><b>' + dets.length + '</b></div>' +
        '<div class="dt"><span>Total de prendas</span><b>' + (av.asig + av.extra) + '</b></div>' +
        (arq.length ? '<div class="dt"><span>Arqueros o líberos</span><b>' + esc(arq.map(idEstampado).join(', ')) + '</b></div>' : '') + '</div>' +
      '<h3>Fichas de este pedido</h3><table class="tp"><thead><tr><th>Hoja</th><th>Ficha</th><th>Grupo</th><th>Unidades</th>' + (conEntD ? '<th>Entrega</th>' : '') + '</tr></thead><tbody>' +
        fichas.map((fi, k) => '<tr><td class="num">' + (k + 2) + '</td><td>' + (tieneNombreD(f, fi.id) ? '<b>' + esc(nomD(f, fi.id)) + '</b> · ' : '') + esc(fi.titulo) + '</td><td>' + (fi.grupo || '—') + '</td><td class="num">' + unidadesHoja(fi) + (fi.cantidades ? ' pares' : '') + '</td>' +
          (conEntD ? '<td>' + esc(fechaTxt(entD(fi) || f.entrega_cliente) || 'por definir') + '</td>' : '') + '</tr>').join('') +
        '</tbody><tfoot><tr><td></td><td>Total</td><td></td><td class="num">' + fichas.reduce((n, fi) => n + unidadesHoja(fi), 0) + '</td>' + (conEntD ? '<td></td>' : '') + '</tr></tfoot></table>' +
      (faltan.length ? '<div class="alerta">⚠ Cargado distinto a lo vendido: ' + faltan.map(x => esc(x.n) + ' ' + x.a + ' de ' + x.c).join(' · ') + '</div>' : '') +
      '<div class="firma"><div>Revisó (Playmaker)</div><div>Recibió conforme (cliente)</div></div>' +
      '</section>';

    app.innerHTML = (st.soloPDF ? barraSoloPDF(f) : barra('Fichas de producción', 'ficha')) + '<div class="pmk-wrap">' +
      '<div class="aviso no-print">Se genera <b>una ficha por diseño</b> (y por manga y jugador/arquero, como en la planilla), cada una en su propia hoja, con el nombre del diseño, su molde, su montaje y su fecha de entrega. ' +
      'Si los montajes se cargaron por molde o por diseño, cada montaje tiene su hoja con su detalle de tallas. ' +
      'Toca <b>Imprimir o guardar PDF</b> y elige <b>Guardar como PDF</b>. El tamaño viene ajustado a <b>carta</b>; si tu impresora pregunta, elige Carta (Letter).</div>' +
      (st.soloPDF ? '' : avisoSinDiseno(f, dets)) +
      '<div class="btn-par no-print"><button class="btn oscuro" id="btn-imprimir">Imprimir o guardar PDF</button></div>' +
      '<div class="hoja fichas-prod">' + portada + fichas.map((fi, k) => fichaHoja(f, fi, k + 1, fichas.length + 1, hoy)).join('') + '</div>' + pie + '</div>';

    document.getElementById('btn-imprimir').addEventListener('click', () => window.print());
  }

  // personas cuyo molde tiene varios diseños y aún no tienen el suyo: [{ id, n }] por prenda
  const sinDisenoFicha = (f, dets) => prendasEnJuego(f, dets).map(id => ({ id: id, n: dets.filter(d => tallasDe(d)[id] && disenoPersona(f, d, id) === 0).length })).filter(x => x.n);
  const avisoSinDiseno = (f, dets) => { const xs = sinDisenoFicha(f, dets); if (!xs.length) return '';
    return '<div class="aviso no-print">Hay prendas con más de un diseño y personas sin el suyo: ' + xs.map(x => esc(tieneNombreD(f, x.id) ? nomDT(f, x.id) : prendaDe(x.id).nom.toLowerCase()) + ' ' + x.n).join(' · ') +
      '. En la ficha de producción quedan en una hoja «Diseño sin indicar».' +
      (repartoRepetidos(f, dets.map(d => ({ calce: d.calce, numero: d.numero || '', estampado: d.estampado || '', nombre: d.nombre || '', tallas: tallasDe(d), disenos: disenosDe(d) })), prendasEnJuego(f, dets)).length
        ? ' Hay personas cargadas dos veces (una por diseño): ahí las repartes entre los diseños con un clic.' : '') +
      ' Indícalo en <button class="btn plano chico" data-ir="listado-ed" style="width:auto;display:inline-block;margin:0 0 0 4px">Editar todo el listado</button>' +
      ' (o pídele al cliente que lo elija en su link).</div>'; };

  /* ============ exportar CSV ============ */
  function descargarCSV(f, dets, ids) {
    const cols = ids.map(id => prendaDe(id));
    const colsDis = ids.filter(id => disenosPrenda(f, id).length > 1);   // prendas con varios diseños: una columna con el de cada persona
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const L = [];
    L.push([q('Referencia'), q(f.ref)].join(';'));
    L.push([q('Proyecto'), q(f.proyecto)].join(';'));
    L.push([q('Cliente'), q(f.cliente)].join(';'));
    L.push([q('Vendedor'), q(f.vendedor || '')].join(';'));
    L.push([q('Entrega'), q(f.entrega || '')].join(';'));
    L.push('');
    L.push(['N°', 'Nombre a estampar', 'Numero camiseta', 'Calce', 'Manga']
      .concat(cols.map(p => nomDT(f, p.id))).concat(colsDis.map(id => 'Diseño ' + prendaDe(id).nom.toLowerCase())).concat(['Arquero/Libero', 'Observaciones']).map(q).join(';'));
    dets.forEach((d, i) => {
      const t = tallasDe(d);
      L.push([i + 1, d.estampado || '', d.numero, d.calce, d.manga]
        .concat(cols.map(p => t[p.id] || '')).concat(colsDis.map(id => t[id] ? (disenoPersona(f, d, id) ? 'Diseño ' + disenoPersona(f, d, id) : 'Sin indicar') : ''))
        .concat([d.arquero ? 'X' : '', d.obs]).map(q).join(';'));
    });
    L.push('');
    L.push(['Prenda', 'Talla', 'Cantidad', 'Vendidas'].map(q).join(';'));
    ids.forEach(id => {
      const p = prendaDe(id), cont = {};
      dets.forEach(d => { const t = tallasDe(d)[id]; if (t) cont[t] = (cont[t] || 0) + 1; });
      const orden = p.escala ? p.escala.filter(t => cont[t])
        : (p.sinTalla ? Object.keys(cont) : TALLAS.filter(t => cont[t]));
      orden.forEach(t => L.push([nomDT(f, id), t, cont[t], habilitado(f, id)].map(q).join(';')));
    });
    const blob = new Blob(['\ufeff' + L.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Ficha_Tallas_' + f.ref + '_' + String(f.cliente).replace(/[^\w]+/g, '_') + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* ============ router ============ */
  // Si una pantalla se cae por un dato inesperado, se avisa en pantalla (antes el botón parecía no hacer nada)
  function fallaPantalla(e, p) {
    try { console.error('Pantalla ' + p + ':', e); } catch (x) {}
    const volver = st.ficha && p !== 'ficha' ? 'ficha' : 'lista';
    app.innerHTML = barra('Error', volver) + '<div class="pmk-wrap"><div class="aviso error">No se pudo abrir esta pantalla.<br>' +
      'Detalle para soporte: ' + esc(((e && e.message) || String(e)).slice(0, 200)) + '</div>' +
      '<button class="btn plano" data-ir="' + volver + '">Volver</button>' + pie + '</div>';
  }
  let ultimaPant = null;
  function render() {
    // si seguimos en la misma pantalla, se conserva la posición del scroll
    const y = window.scrollY, misma = (ultimaPant === st.pant);
    const p = st.pant;
    app.classList.toggle('ancho', p === 'listado-ed');   // el editor del listado usa todo el ancho
    try {
    let r;
    if (p === 'pin') r = pantPin();
    else if (p === 'lista') r = pantLista();
    else if (p === 'ventas') r = pantVentas();
    else if (p === 'crear') r = pantCrear();
    else if (p === 'creada') r = pantCreada();
    else if (p === 'editar') r = pantEditar();
    else if (p === 'ficha') r = pantFicha();
    else if (p === 'tecnica') r = pantTecnica();
    else if (p === 'catalogo') r = pantCatalogo();
    else if (p === 'moldes') r = pantMoldes();
    else if (p === 'pdf') r = pantPDF();
    else if (p === 'listado-ed') r = pantListadoEd();
    else if (p === 'usuarios') r = pantUsuarios();
    if (r && typeof r.catch === 'function') r.catch(e => fallaPantalla(e, p));
    } catch (e) { fallaPantalla(e, p); }
    ultimaPant = st.pant;
    if (misma) window.scrollTo({ top: y }); else window.scrollTo({ top: 0 });
  }
  app.addEventListener('click', e => {
    if (e.target.closest('#btn-salir')) return cerrarSesion();
    const b = e.target.closest('[data-ir]');
    if (!b) return;
    if (st.soloPDF) return;
    st.error = '';
    if (b.dataset.ir === 'editar') st.lineas = null;
    if (b.dataset.ir === 'ficha') { st.specsBorrador = null; (st.pendientes || []).forEach(x => { if (x.url) URL.revokeObjectURL(x.url); }); st.pendientes = null; st.editImg = null; }
    if (b.dataset.ir === 'listado-ed') { st.ed = null; st.edListo = null; }
    st.editPersona = null;
    st.pant = b.dataset.ir;
    render();
  });
  // llega desde Planificación con ?volver=…: se recuerda para «Planificación» en la barra de sistemas
  try { const vu = new URLSearchParams(location.search).get('volver'); if (vu && vu.indexOf(PLANIFICACION) === 0) localStorage.setItem('pmk_volver_plan', vu); } catch (e) {}
  // «Planificación» en la barra de sistemas: vuelve a la sección o proyecto de donde se vino
  { const a = document.querySelector('.pmk-sis [data-sis="planificacion"]'); if (a) a.href = urlPlan(); }
  const soloPDF = paramURL('pdf');
  // la ficha abierta sola (enlace ?pdf=) no muestra los accesos a los sistemas
  if (soloPDF) { const b = document.querySelector('.pmk-sis'); if (b) b.remove(); }
  // Acceso único: la sesión Playmaker llega desde la página de sistemas u otro sistema (#pmk_acceso=…) y se valida en la
  // base de Producción. Sin sesión se va a ingresar a la página de sistemas, que vuelve aquí; quien vuelve sin usuario
  // Playmaker entra con su clave anterior del panel.
  const rolPanel = x => { const p = PMK_ACCESO.perfiles(x); return p.includes('admin') ? 'admin' : p.includes('ventas') && !p.includes('fichas') ? 'vendedor' : 'fichas'; };
  const sesionPlaymaker = x => ({ nombre: x.nombre, usuario: x.usuario || null, rol: rolPanel(x), token: null, central: x.token, roles: x.roles });
  async function iniciarAcceso() {
    const marca = PMK_ACCESO.tomarMarca();   // null: no llegó nada · '': volvió sin usuario Playmaker
    let ses = leerSesion(), termino = false;
    const central = marca || (ses && ses.central) || '';
    if (central) {
      let x;
      try { x = await PMK_ACCESO.validar(central); }
      catch (e) { if (ses) return entrarPanel(ses, false); st.error = 'No se pudo validar tu usuario Playmaker. Revisa tu conexión.'; }
      if (x && PMK_ACCESO.permite(x, 'fichas')) return entrarPanel(sesionPlaymaker(x));
      if (x) st.error = x.nombre + ': tu perfil no tiene acceso a Fichas.';
      if (ses && ses.central && x !== undefined) { try { localStorage.removeItem(SESION); } catch (e) {} ses = null; termino = !x; }
    }
    if (ses) return entrarPanel(ses, false);
    if (marca === null && !st.error && PMK_ACCESO.irAIngresar(termino ? 'fin' : '')) return;
    render();
  }
  if (soloPDF) abrirSoloPDF(normalizarRef(soloPDF));
  else iniciarAcceso();
})();
</script>
