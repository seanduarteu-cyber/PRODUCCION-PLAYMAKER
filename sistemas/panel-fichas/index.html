<title>Panel de fichas · Playmaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fff; }

#pmk {
  --negro: #000; --blanco: #fff; --naranja: #ED6C23;
  --humo: #f4f4f4; --linea: #e2e2e2; --gris: #6e6e6e; --verde: #1f7a45; --rojo: #c62828;
  font-family: 'Poppins', system-ui, sans-serif; color: var(--negro); background: var(--blanco);
  max-width: 560px; margin: 0 auto; padding: 0 0 calc(28px + env(safe-area-inset-bottom));
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}
#pmk h1, #pmk h2 { font-family: 'Oswald', 'Poppins', sans-serif; font-weight: 600; letter-spacing: .01em; margin: 0; line-height: 1.1; }
#pmk p { margin: 0; }

.pmk-top { background: var(--negro); color: var(--blanco); display: flex; align-items: center; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top)) 20px 16px; }
.pmk-top .iso { width: 30px; height: 30px; border-radius: 7px; flex: none; }
.hoja .cab-hoja .marca-hoja { display: flex; align-items: center; gap: 9px; }
.hoja .cab-hoja .iso-hoja { width: 34px; height: 34px; border-radius: 5px; flex: none; }
.pmk-top .marca { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; }
.pmk-top .marca em { font-style: normal; color: var(--naranja); }
.pmk-acc { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pmk-acc .pmk-volver { margin-left: 0; }
.pmk-plan { text-decoration: none; color: var(--naranja) !important; border-color: var(--naranja) !important; }
.pmk-top .sub { font-size: 11px; color: #9a9a9a; letter-spacing: .04em; margin-top: 2px; }
.pmk-volver { margin-left: auto; background: none; border: 1px solid #3a3a3a; color: #cfcfcf; border-radius: 999px;
  font-size: 13px; font-family: inherit; padding: 8px 15px; cursor: pointer; min-height: 40px; }

.pmk-wrap { padding: 22px 18px 0; }
.tit { font-size: 26px; text-transform: uppercase; }
.bajada { font-size: 14px; color: var(--gris); margin-top: 8px; }
.mini { font-size: 12px; color: var(--gris); }

.ref-cab { border: 1px solid var(--linea); border-left: 4px solid var(--naranja); border-radius: 0 12px 12px 0; padding: 14px 16px; margin-top: 16px; }
.ref-cab .ref { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: .06em; }
.ref-cab .proy { font-size: 14px; font-weight: 500; margin-top: 2px; }
.ref-cab .meta { font-size: 12px; color: var(--gris); margin-top: 4px; }
.etiqueta { display: inline-block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }

.estado { font-family: 'Oswald', sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: 6px; }
.estado.abierto { background: var(--humo); color: var(--gris); }
.estado.completo { background: var(--naranja); color: var(--blanco); }
.estado.confirmado { background: var(--verde); color: var(--blanco); }

.avance { border-top: 1px solid var(--linea); padding-top: 12px; margin-top: 12px; }
.avance:first-of-type { border-top: none; }
.avance .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.avance .n { font-family: 'Oswald', sans-serif; font-size: 15px; text-transform: uppercase; }
.avance .c { font-family: 'Oswald', sans-serif; font-size: 15px; }
.avance .c.listo { color: var(--verde); }
.avance .c.falta, .avance .c.extra { color: var(--naranja); }
.avance .nota { font-size: 12px; color: var(--naranja); margin-top: 5px; }
.prog { height: 6px; background: var(--humo); border-radius: 99px; overflow: hidden; margin-top: 7px; }
.prog i { display: block; height: 100%; background: var(--naranja); border-radius: 99px; }
.prog i.listo { background: var(--verde); }

.campo { margin-top: 22px; }
.campo > label, .campo > .lab { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.campo .ayuda { font-size: 12px; color: var(--gris); font-weight: 400; margin-top: -4px; margin-bottom: 8px; }
input[type=text], input[type=date], input[type=number], input[type=password], textarea, select {
  width: 100%; font-family: inherit; font-size: 16px; border: 1px solid var(--linea);
  border-radius: 10px; padding: 12px 13px; background: var(--blanco); color: var(--negro); min-height: 48px;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--naranja); outline-offset: 1px; border-color: transparent; }

.btn { width: 100%; font-family: 'Oswald', sans-serif; font-size: 16px; text-transform: uppercase; letter-spacing: .05em;
  background: var(--naranja); color: var(--blanco); border: none; border-radius: 11px; padding: 16px; margin-top: 14px; cursor: pointer; min-height: 52px; }
.btn.oscuro { background: var(--negro); }
.btn.verde { background: var(--verde); }
.btn.plano { background: var(--blanco); color: var(--negro); border: 1px solid var(--linea); }
.btn:disabled { opacity: .45; }
.btn.chico { width: auto; font-size: 13px; padding: 10px 16px; min-height: 44px; }
.btn-par { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn-par .btn { margin-top: 0; flex: 1; min-width: 150px; }

.aviso { border-left: 3px solid var(--naranja); background: var(--humo); padding: 12px 13px; font-size: 13px; border-radius: 0 8px 8px 0; margin-top: 16px; }
.aviso.error { border-left-color: var(--rojo); color: #8e1f1f; }
.aviso.ok { border-left-color: var(--verde); }

@media print {
  .no-print { display: none !important; }

  .hoja .datos { margin-top: 6px; }
  .hoja h2 { margin-top: 10px; page-break-after: avoid; }

  .hoja thead { display: table-header-group; }
  .hoja tr { page-break-inside: avoid; }
  .hoja .firma { margin-top: 16px; page-break-inside: avoid; }

  .hoja .montajes img { max-height: 55mm; object-fit: contain; }
  .pie { display: none !important; }
  @page { margin: 6mm 7mm 8mm 7mm; size: letter portrait; }   /* tamaño carta */
}

<script>
/* Acceso único Playmaker: un solo usuario (el de Planificación) para Planificación, Fichas y Ventas.
   Se ingresa en la página de sistemas (sitio de Planificación); al pasar a otro sistema la sesión viaja en la
   dirección (#pmk_acceso=…) y ese sistema la valida en la base de Producción. Lo que abre cada perfil: permite(). */
const PMK_ACCESO = (() => {
  const PROD_URL = 'https://ygcsqrylpibhofvetdyh.supabase.co';
  const PROD_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnY3NxcnlscGliaG9mdmV0ZHloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjYzMzcsImV4cCI6MjA5NjI0MjMzN30.olLJiMa5-yDNYtoGisy-5Mv7aFsxwvtoQU8yIgHjbto';
  const SITIOS = { planificacion: 'https://planificacion-playmaker.netlify.app', fichas: 'https://panel-fichas-playmaker.netlify.app', ventas: 'https://ventas-playmaker.netlify.app' };
  const NOMBRES = { planificacion: 'Planificación', fichas: 'Fichas', ventas: 'Ventas' };
  const PORTAL = SITIOS.planificacion + '/sistemas.html';
  const GERENCIA = ['Sean Duarte', 'Silvia Urbina'];   // gerencia de Ventas: gastos, flujo de caja y comisiones
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const perfiles = u => !u ? [] : Array.isArray(u.roles) && u.roles.length ? u.roles : u.rol ? [u.rol] : [];
  const esGerencia = u => !!u && GERENCIA.some(g => norm(g) === norm(u.nombre));
  // Planificación: todos · Fichas: todos menos el taller externo · Ventas: vendedores, administración y gerencia
  function permite(u, sis) {
    const p = perfiles(u);

    if (sis === 'planificacion') return true;
    if (sis === 'fichas') return p.some(r => r !== 'taller');
    if (sis === 'ventas') return p.includes('ventas') || p.includes('admin') || esGerencia(u);

  }
  const sistemas = u => Object.keys(SITIOS).filter(s => permite(u, s));
  const sistemaDe = url => Object.keys(SITIOS).find(k => url === SITIOS[k] || String(url).startsWith(SITIOS[k] + '/')) || null;
  async function rpc(fn, args, extra) {
    const r = await fetch(PROD_URL + '/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args || {}), ...(extra || {}),
      headers: { apikey: PROD_KEY, Authorization: 'Bearer ' + PROD_KEY, 'Content-Type': 'application/json' } });
    if (!r.ok) throw new Error(r.status + ' ' + await r.text());
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  async function usuarios() {
    const r = await fetch(PROD_URL + '/rest/v1/plan_usuarios?select=usuario,nombre&activo=eq.true&order=nombre.asc', { headers: { apikey: PROD_KEY, Authorization: 'Bearer ' + PROD_KEY } });

  async function validar(token) {

  // Lee y quita de la dirección la sesión que llega desde otro sistema. null: no llegó nada; '': se volvió sin sesión.
  function tomarMarca() {
    const m = location.hash.match(/[#&]pmk_acceso=([^&]*)/);
    if (!m) return null;
    const resto = location.hash.slice(1).split('&').filter(x => x && !/^pmk_acceso=/.test(x)).join('&');
    try { history.replaceState(null, '', location.pathname + location.search + (resto ? '#' + resto : '')); } catch (e) {}

  function bindMoldesProyecto(lineas, vendido, alCambiar) {

          l.cants = {}; ms.forEach(m => { const v = parseInt(m.value, 10); if (v > 0) l.cants[m.dataset.med] = Math.min(999, v); });
          const sm = sumaCant(l.cants), ci = div.querySelector('[data-campo=cant]'), ss = div.querySelector('[data-med-suma]');

      const l = lineas[+el.closest('[data-linea]').dataset.linea]; if (l && l.cant) { l.confirmar = false; const d = el.closest('[data-linea]');

      render();
    }));
    app.querySelectorAll('[data-cf]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', () => {
      sync(); (st.catMol = st.catMol || {})[el.dataset.cf] = el.value; render();
      if (el.tagName === 'INPUT') { const i = app.querySelector('[data-cf=q]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
    }));
    return sync;
  }


  /* ==========================================================
     MONTAJES — las imágenes van a Storage, nunca a la base.
     En fichas_tallas.imagenes queda solo la dirección.
     ========================================================== */
  const BUCKET = 'montajes';
  const DIAS_MONTAJES = 30;

  const leerJSON = (v, vacio) => { if (v && typeof v === 'object') return v; try { return JSON.parse(v || vacio); } catch (e) { return JSON.parse(vacio); } };
  // fichas antiguas guardaban el molde como número u objeto: se lleva al formato actual "código|número"
  const valorMoldeGuardado = v => {
    if (v == null || v === '') return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'number') { const m = MOLDES.find(x => x.n === v); return m ? m.c + '|' + v : String(v) + '|manual'; }
    if (typeof v === 'object' && v.n != null) return (v.c || (MOLDES.find(x => x.n === +v.n) || { c: '' }).c) + '|' + v.n;
    return '';
  };
  const specsDe = f => {
    const s = leerJSON(f.specs, '{}');
    if (Array.isArray(s)) return {};
    Object.keys(s).forEach(k => {
      const sp = s[k];
      if (!sp || typeof sp !== 'object') return;
      if (sp.moldes && typeof sp.moldes === 'object' && !Array.isArray(sp.moldes))
        Object.keys(sp.moldes).forEach(c => { sp.moldes[c] = valorMoldeGuardado(sp.moldes[c]); });
      else if (sp.moldes) delete sp.moldes;
      if (sp.despiece) {
        const dp = sp.despiece;
        if (typeof dp.piezas === 'string') dp.piezas = dp.piezas.split(',').map(t => ({ pieza: t.trim(), cant: 1, tela: '', detalle: '' })).filter(q => q.pieza);
        dp.piezas = Array.isArray(dp.piezas) ? dp.piezas.filter(q => q && typeof q === 'object') : [];
      }
    });
    return s;
  };
  // arquero (fútbol) o líbero (vóleibol): diseño y confección aparte. El nombre sigue al deporte de la ficha
  const nombreArq = f => {
    const deps = Object.values(specsDe(f) || {}).map(sp => (sp && sp.deporte) || '').join(' ');
    const fut = /fútbol|futbol/i.test(deps), vol = /vóleibol|voleibol|vóley|voley/i.test(deps);
    return fut && !vol ? 'Arquero' : vol && !fut ? 'Líbero' : 'Arquero o líbero';
  };
  const imgsDe  = f => { const a = leerJSON(f.imagenes, '[]'); return Array.isArray(a) ? a.filter(i => i && typeof i === 'object') : []; };
  // un montaje puede servir para varias prendas (los antiguos guardaban solo una)
  // persona cargada sin nombre (camisetas que solo llevan número y talla): se la nombra por su número
  const nomPersona = d => String((d && d.nombre) || '').trim() || (d && d.numero ? 'N° ' + d.numero : 'Sin nombre');
  const prendasImg = i => Array.isArray(i.prendas) && i.prendas.length ? i.prendas : (i.prenda ? [i.prenda] : []);
  // Cada montaje dice de qué molde(s) de la ficha es (sin molde: de todos los de su prenda) y qué diseño es (1, 2…).
  // Si un molde tiene dos o más diseños, el cliente indica cuál lleva cada persona (fichas_detalle.disenos, SQL 13A).
  const disenoImg = i => +i.diseno || 1;
  const moldesImg = i => Array.isArray(i.moldes) ? i.moldes.filter(Boolean) : [];
  const moldeDe = (f, prenda, calce) => ((((specsDe(f) || {})[prenda] || {}).moldes) || {})[calce] || '';
  const imgsMolde = (f, prenda, v) => imgsDe(f).filter(i => prendasImg(i).indexOf(prenda) >= 0 && (!moldesImg(i).length || !v || moldesImg(i).indexOf(v) >= 0));
  // diseños del molde de esa prenda en ese calce (los montajes del arquero van aparte)
  const disenosMolde = (f, prenda, calce) => Array.from(new Set(imgsMolde(f, prenda, moldeDe(f, prenda, calce)).filter(i => !i.arquero).map(disenoImg))).sort((a, b) => a - b);
  // todos los diseños que tiene una prenda en algún calce (para las columnas del listado)
  const disenosPrenda = (f, id) => Array.from(new Set(['Masculino', 'Femenino', 'Infantil'].filter(c => disenosMolde(f, id, c).length > 1)
    .reduce((a, c) => a.concat(disenosMolde(f, id, c)), []))).sort((a, b) => a - b);
  const disenosDe = d => { const x = leerJSON(d && d.disenos, '{}'); return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; };
  // diseño de una persona en una prenda: el número, 0 si su molde tiene varios y no lo indicó, null si no hace falta
  const disenoPersona = (f, d, id) => disenosMolde(f, id, d.calce).length > 1 ? (+disenosDe(d)[id] || 0) : null;
  const codMolde = v => String(v || '').split('|')[0];
  /* ===== Diseños: cada molde que se agrega a la ficha es un diseño propio, con su id interno (camiseta, camiseta_2…),
     su nombre (specs[id].nombre, renombrable: el molde conserva el suyo), molde, tela, despiece, montaje y fecha de
     entrega (specs[id].entrega). Las fichas antiguas, sin nombre, se siguen viendo con el nombre de la prenda. ===== */
  const nomSp = (specs, id) => { const sp = (specs || {})[id]; return (sp && typeof sp === 'object' && String(sp.nombre || '').trim()) || ''; };
  const nomDeSpecs = (specs, id) => nomSp(specs, id) || prendaDe(id).nom;
  const nomD = (f, id) => nomDeSpecs(specsDe(f), id);
  const tieneNombreD = (f, id) => !!nomSp(specsDe(f), id);
  const tipoDe = id => prendaDe(basePrenda(id)).nom;
  // con el tipo de prenda al lado, para que «Diseño 2» diga qué es: «Diseño 2 · Short o calza»
  const nomDT = (f, id) => { const n = nomSp(specsDe(f), id); return n ? n + ' · ' + tipoDe(id) : prendaDe(id).nom; };
  // molde de un diseño como «Molde 10» (o «Molde RB-CR clásica (manual)»)
  const moldeCorto = v => esManual(v) ? 'Molde ' + (String(v).split('|')[0] || 'sin escribir') + ' (manual)' : 'Molde ' + etqMolde(String(v).split('|')[1]);
  const moldesDiseno = sp => { const mo = (sp && sp.moldes) || {};
    return Array.from(new Set(CALCES.filter(c => mo[c] && mo[c] !== '|manual').map(c => mo[c]))).map(moldeCorto).join(' + '); };
  // «Rama Voleibol (Molde 10)»
  const nomDMSpecs = (specs, id) => { const m = moldesDiseno((specs || {})[id]); return nomDeSpecs(specs, id) + (m ? ' (' + m + ')' : ''); };
  const nomDM = (f, id) => nomDMSpecs(specsDe(f), id);
  // Personas cargadas varias veces (mismo calce, número, nombre a estampar y nombre) en una prenda cuyo molde tiene
  // varios diseños, todas sin diseño: lo normal es que sea una copia por diseño (cada persona lleva todos).
  // Devuelve [{ fila, id, diseno }]: la 1.ª copia al Diseño 1, la 2.ª al 2… (son iguales: da lo mismo cuál es cuál).
  const normRep = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  function repartoRepetidos(f, filas, ids) {
    const out = [];
    ids.forEach(id => {
      const grupos = {};
      filas.forEach((x, i) => {
        if (x.borrar || !(x.tallas || {})[id]) return;
        const k = [x.calce, normRep(x.numero), normRep(x.estampado), normRep(x.nombre)].join('|');
        (grupos[k] = grupos[k] || []).push(i);
      });
      Object.keys(grupos).forEach(k => {
        const is = grupos[k], cal = filas[is[0]].calce, ds = disenosMolde(f, id, cal);
        if (ds.length < 2 || is.length < 2 || is.length > ds.length || is.some(i => +(filas[i].disenos || {})[id])) return;
        is.forEach((i, j) => out.push({ fila: i, id: id, diseno: ds[j] }));
      });
    });
    return out;
  }
  // montaje del arquero o líbero: su diseño es distinto y va en la hoja de los arqueros
  const etiquetaImg = (i, f) => (prendasImg(i).map(id => f ? nomD(f, id) : prendaDe(id).nom).join(' + ') || 'Sin prenda asignada') + (i.vista ? ' · ' + i.vista : '') +
    (moldesImg(i).length ? ' · ' + moldesImg(i).map(codMolde).join(' + ') : '') + (disenoImg(i) > 1 || (f && imgsDe(f).some(x => disenoImg(x) > 1)) ? ' · Diseño ' + disenoImg(i) : '') +
    (i.arquero ? ' · ' + (f ? nombreArq(f) : 'Arquero o líbero') : '');

  /* Reduce la foto antes de subirla: 1400px de lado mayor y JPEG.
     Una foto de celular de 4 MB queda en unos 200 KB. */
  function comprimir(file, lado, calidad) {
    return new Promise((res, rej) => {
      const fr = new FileReader(), img = new Image();
      fr.onload = () => { img.src = fr.result; };
      fr.onerror = () => rej(new Error('No se pudo leer el archivo'));
      img.onerror = () => rej(new Error('El archivo no es una imagen válida'));
      img.onload = () => {
        const f = Math.min(1, lado / Math.max(img.width, img.height));
        const w = Math.round(img.width * f), h = Math.round(img.height * f);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la imagen')), 'image/jpeg', calidad);
      };
      fr.readAsDataURL(file);
    });
  }

  // carpeta del pedido en Storage: sin tildes ni símbolos, que Storage no acepta («COT-REPOSICIÓN» → COT-REPOSICION)
  const carpetaRef = ref => String(ref || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'ficha';
  async function subirMontaje(ref, blob, nombre, ext, tipo) {
    const path = carpetaRef(ref) + '/' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1000) + '.' + (ext || 'jpg');
    const r = await fetch(CFG.fichasUrl + '/storage/v1/object/' + BUCKET + '/' + path, {
      method: 'POST',
      headers: { apikey: CFG.fichasKey, Authorization: 'Bearer ' + CFG.fichasKey, 'Content-Type': tipo || 'image/jpeg', 'x-upsert': 'true' },
      body: blob
    });
    if (!r.ok) throw new Error('Storage ' + r.status + ': ' + (await r.text()).slice(0, 140));
    return {
      path: path,
      url: CFG.fichasUrl + '/storage/v1/object/public/' + BUCKET + '/' + path,
      nombre: (nombre || 'Montaje').slice(0, 40),
      subida: new Date().toISOString()
    };
  }

  // Montaje en PDF: cada página se convierte en imagen con pdf.js (se carga solo cuando hace falta), para que se vea
  // igual que una foto en el sitio del cliente y en la ficha de producción. El PDF original queda enlazado.
  const MAX_MONTAJES = 8, MAX_PAG_PDF = 4;   // por diseño · páginas de un PDF que se usan (la hoja muestra hasta 4)
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  let pdfjsCarga = null;
  function cargarPdfjs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!pdfjsCarga) pdfjsCarga = new Promise((res, rej) => {
      const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
      sc.onload = () => { if (!window.pdfjsLib) { pdfjsCarga = null; return rej(new Error('No se pudo abrir el lector de PDF.')); }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); };
      sc.onerror = () => { pdfjsCarga = null; rej(new Error('No se pudo cargar el lector de PDF: revisa tu conexión, o sube el montaje como imagen (JPG o PNG).')); };
      document.head.appendChild(sc);
    });
    return pdfjsCarga;
  }
  const esPDF = a => /pdf$/i.test((a && a.type) || '') || /\.pdf$/i.test((a && a.name) || '');
  async function paginasPDF(file, lado, calidad) {
    const lib = await cargarPdfjs();
    const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const out = [];
    for (let n = 1; n <= Math.min(doc.numPages, MAX_PAG_PDF); n++) {
      const pg = await doc.getPage(n), v1 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: lado / Math.max(v1.width, v1.height) });
      const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: ctx, viewport: vp }).promise;
      out.push(await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('No se pudo convertir la página ' + n)), 'image/jpeg', calidad)));
    }
    return { paginas: out, total: doc.numPages };
  }

  // archivo elegido → montaje por subir (un PDF se convierte en imágenes para verlo antes de subirlo)
  async function prepararMontaje(a) {
    if (esPDF(a)) { const r = await paginasPDF(a, 1600, 0.82); return { file: a, pdf: true, total: r.total, paginas: r.paginas.map(b => ({ blob: b, url: URL.createObjectURL(b) })) }; }
    if (/^image\//.test(a.type || '') || /\.(jpe?g|png|webp|gif)$/i.test(a.name || '')) return { file: a, url: URL.createObjectURL(a) };
    throw new Error(a.name + ' no es una imagen ni un PDF.');
  }
  const liberarMontaje = x => { if (x.url) URL.revokeObjectURL(x.url); (x.paginas || []).forEach(pg => { if (pg.url) URL.revokeObjectURL(pg.url); }); };
  const cuentaImgs = x => x.paginas ? x.paginas.length : 1;
  // sube un montaje de la ficha f y devuelve sus registros (c: prendas, molde, vista…): uno por imagen; un PDF, uno por
  // página, con el PDF original enlazado
  async function subirMontajeArchivo(f, x, c) {
    const conClasif = reg => { Object.assign(reg, c); reg.nombre = etiquetaImg(reg, f).slice(0, 40); return reg; };
    if (!x.pdf) return [conClasif(await subirMontaje(f.ref, await comprimir(x.file, 1400, 0.72), ''))];
    const grupo = 'pdf-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1000);
    let original = null;
    try { original = await subirMontaje(f.ref, x.file, '', 'pdf', 'application/pdf'); } catch (e) { /* sin el PDF original igual quedan sus páginas */ }
    const out = [];
    for (let n = 0; n < x.paginas.length; n++) {
      const reg = await subirMontaje(f.ref, x.paginas[n].blob, '');
      Object.assign(reg, { origen: 'pdf', grupo: grupo, pagina: n + 1, paginas: x.paginas.length, archivo: String(x.file.name || '').slice(0, 60) },
        original ? { pdf: original.url, pdfPath: original.path } : {});
      out.push(conClasif(reg));
    }
    return out;
  }
  // montajes adjuntados en las líneas de molde (crear o editar la ficha): se suben al guardar, con vista «Completo»;
  // la vista y si es del arquero se cambian después en la ficha técnica
  async function subirMontajesLineas(f, lineas, base) {
    const nuevas = (base || []).slice();
    for (const l of lineas) {
      if (!(l.mj || []).length) continue;
      const v = l.tipo === 'molde' || l.tipo === 'manual' ? valorMolde(l) : '';
      const c = { prendas: [l.prenda], prenda: l.prenda, vista: 'Completo', arquero: false, moldes: v && v !== '|manual' ? [v] : [], diseno: 1 };
      for (const x of l.mj) (await subirMontajeArchivo(f, x, c)).forEach(r => nuevas.push(r));
    }
    return nuevas;
  }

  // Guía de tallas de un molde: queda en montajes/moldes/molde-55.jpg (molde-E01.jpg en los especiales)
  async function subirGuiaMolde(numero, file) {
    const blob = await comprimir(file, 1800, 0.88);
    const path = 'moldes/molde-' + etqMolde(numero) + '.jpg';
    const r = await fetch(CFG.fichasUrl + '/storage/v1/object/' + BUCKET + '/' + path, {
      method: 'POST',
      headers: { apikey: CFG.fichasKey, Authorization: 'Bearer ' + CFG.fichasKey, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
      body: blob
    });
    if (!r.ok) throw new Error('Storage ' + r.status + ': ' + (await r.text()).slice(0, 140));
  }
  // «molde-55.jpg», «Molde 55.png», «molde-E01.jpg» → N° del molde (E01 = 101)
  const numeroDeArchivo = nombre => {
    const x = String(nombre || '').match(/molde[\s_\-]*(e)?\s*0*(\d{1,2})(?!\d)/i);
    return x ? (x[1] ? 100 : 0) + (+x[2]) : null;
  };

  async function borrarMontaje(path) {
    try {
      await fetch(CFG.fichasUrl + '/storage/v1/object/' + BUCKET + '/' + path, {
        method: 'DELETE',
        headers: { apikey: CFG.fichasKey, Authorization: 'Bearer ' + CFG.fichasKey }
      });
    } catch (e) { /* si falla, la limpieza diaria lo vuelve a intentar */ }
  }

  /* Limpieza diaria: borra los montajes con más de 30 días.
     El respaldo definitivo lo hace Playmaker bajando el PDF al OneDrive. */
  async function limpiezaMontajes() {
    const hoy = new Date().toISOString().slice(0, 10);
    try { if (localStorage.getItem('pmk_limpieza_montajes') === hoy) return; } catch (e) { return; }
    const corte = Date.now() - DIAS_MONTAJES * 24 * 60 * 60 * 1000;
    try {
      const fichas = await API.fichas();
      for (const f of fichas) {
        const imgs = imgsDe(f);
        if (!imgs.length) continue;
        const viejas = imgs.filter(i => new Date(i.subida).getTime() < corte);
        if (!viejas.length) continue;
        for (const i of viejas) await borrarMontaje(i.path);
        for (const pp of Array.from(new Set(viejas.map(i => i.pdfPath).filter(Boolean)))) await borrarMontaje(pp);
        await API.imagenesFicha(f.ref, imgs.filter(i => new Date(i.subida).getTime() >= corte));
      }
      localStorage.setItem('pmk_limpieza_montajes', hoy);
    } catch (e) { /* se reintenta mañana */ }
  }

  /* Purga diaria: elimina las fichas con más de 30 días y borra
     sus montajes de Storage. El PDF en OneDrive es el respaldo. */
  const DIAS_FICHA = 30;
  async function purgaDiaria() {
    const hoy = new Date().toISOString().slice(0, 10);
    try { if (localStorage.getItem('pmk_purga_fichas') === hoy) return; } catch (e) { return; }
    try {
      const borradas = await API.purgar();
      for (const f of (borradas || [])) {
        const imgs = Array.isArray(f.imagenes) ? f.imagenes : JSON.parse(f.imagenes || '[]');
        for (const i of imgs) await borrarMontaje(i.path);
        for (const pp of Array.from(new Set(imgs.map(i => i.pdfPath).filter(Boolean)))) await borrarMontaje(pp);
      }
      localStorage.setItem('pmk_purga_fichas', hoy);
    } catch (e) { /* se reintenta mañana */ }
  }

  const diasRestantes = f => {
    const creada = new Date(f.created_at).getTime();
    if (!creada) return null;
    return DIAS_FICHA - Math.floor((Date.now() - creada) / 86400000);
  };

  /* ==========================================================
     RESUMEN PARA CORTE
     Agrupa por prenda, calce y largo de manga, que es como
     efectivamente se corta: no sirve saber cuántas M hay si no
     se sabe cuántas son de molde femenino y cuántas masculino.
     ========================================================== */
  function agruparCorte(dets, id, f) {
    const p = prendaDe(id);
    const grupos = {};
    dets.forEach(d => {
      const t = tallasDe(d)[id];
      if (!t) return;
      let clave = d.calce || 'Sin calce';
      if (p.manga) clave += ' · manga ' + (f && mangaEn(f, id, d) === 'Sin mangas' ? 'sin mangas' : (d.manga || 'sin dato').toLowerCase());
      if (p.manga && d.arquero) clave += ' · arquero';
      if (!grupos[clave]) grupos[clave] = {};
      grupos[clave][t] = (grupos[clave][t] || 0) + 1;
    });
    return Object.keys(grupos).sort().map(k => {
      const conteo = grupos[k];
      const orden = p.escala ? p.escala.filter(t => conteo[t])
        : (p.sinTalla ? Object.keys(conteo) : TALLAS.filter(t => conteo[t]));
      return {
        clave: k,
        detalle: orden.map(t => t + ' × ' + conteo[t]).join(' · '),
        total: orden.reduce((n, t) => n + conteo[t], 0)
      };
    });
  }

  function bloqueCorte(f, dets, ids, clase, mostrarVendidas) {
    let h = '<div class="corte ' + (clase || '') + '">';
    let algo = false;
    ids.forEach(id => {
      const p = prendaDe(id), cq = porCantidad(id) ? cantidadesDe(f, id) : null;
      if (cq) { const tm = sumaCant(cq); if (!tm) return; algo = true;
        h += '<div class="corte-prenda"><div class="tit-p">' + esc(nomDT(f, id)) + '<span>' + tm + (mostrarVendidas ? ' de ' + habilitado(f, id) : '') + ' pares</span></div>' +
          '<div class="g">Pares por talla: ' + esc(textoCant(cq)) + '</div></div>'; return; }
      const grupos = agruparCorte(dets, id, f);
      if (!grupos.length) return;
      algo = true;
      const total = grupos.reduce((n, g) => n + g.total, 0);
      h += '<div class="corte-prenda"><div class="tit-p">' + esc(nomDT(f, id)) +
        '<span>' + total + (mostrarVendidas ? ' de ' + habilitado(f, id) : ' unidades') + '</span></div>';
      grupos.forEach(g => {
        h += '<div class="g">' + esc(g.clave) + ': ' + esc(g.detalle) + ' &nbsp;<em>= ' + g.total + '</em></div>';
      });
      h += '</div>';
    });
    return algo ? h + '</div>' : '';
  }

  /* ============ pantallas ============ */
  /* ---- acceso: usuarios definidos por el administrador (tabla fichas_usuarios).
     El login se valida en la base (fichas_login) y entrega un token de sesión. ---- */
  const ROLES_PANEL = { admin: 'Administrador', fichas: 'Encargada de fichas', vendedor: 'Vendedor(a)' };
  const SESION = 'pmk_fichas_sesion';
  // token: sesión propia del panel (clave anterior) · central: sesión Playmaker (usuario de Planificación)
  function guardarSesion(u) { try { localStorage.setItem(SESION, JSON.stringify({ nombre: u.nombre, usuario: u.usuario || null, rol: u.rol || 'fichas', token: u.token || null, central: u.central || null, roles: u.roles || null, t: Date.now() })); } catch (e) {} }
  function leerSesion() {
    try { const s = JSON.parse(localStorage.getItem(SESION) || 'null');
      if (s && (s.token || s.central) && Date.now() - (s.t || 0) < 12 * 60 * 60 * 1000) return s;   // vale por 12 horas (sin token = versión anterior: entrar de nuevo)
    } catch (e) {}
    return null;
  }
  function cerrarSesion() {
    const central = st.central;   // la sesión Playmaker se cierra en todos los sistemas
    if (central) PMK_ACCESO.salir(central);
    if (st.token) API.salir(st.token).catch(() => {}); try { localStorage.removeItem(SESION); } catch (e) {} st.usuario = null; st.usuarioId = null; st.rol = null; st.token = null; st.central = null; st.pant = 'pin';
    PMK_ACCESO.ajustarBarra(null, null);
    if (central && PMK_ACCESO.irAIngresar()) return;
    render();
  }
  const paramURL = k => { try { return new URLSearchParams(location.search).get(k); } catch (e) { return null; } };
  const refDeURL = () => paramURL('ref');
  function entrarPanel(u, guardar) {
    st.error = ''; st.cambio = null; st.usuario = u.nombre; st.usuarioId = u.usuario || null; st.rol = u.rol || 'fichas'; st.token = u.token || null; st.central = u.central || null;
    PMK_ACCESO.ajustarBarra(u.central ? u : null, u.central);
    if (guardar !== false) guardarSesion(u);
    const ref = refDeURL(), nuevo = paramURL('nuevo');
    if (nuevo) { st.crearRef = nuevo; st.pant = 'crear'; }        // llega desde Producción para crear la ficha de ese pedido
    else if (ref) { st.ref = ref; st.ficha = null; st.dets = null; st.pant = 'ficha'; }
    else st.pant = 'lista';
    render();
    cargarMoldes();     // catálogo único de moldes, en segundo plano
    limpiezaMontajes(); // corren una vez al día, en segundo plano
    purgaDiaria();
  }
  async function pantPin() {
    if (st.cambio) {
      app.innerHTML = barra('Panel interno') + '<div class="pmk-wrap"><h1 class="tit">Crea tu clave</h1>' +
        '<p class="bajada">' + esc(st.cambio.nombre) + ', es tu primer ingreso o el administrador restableció tu clave.</p>' +
        '<div class="campo"><label for="c1">Nueva clave</label><input id="c1" type="password" autocomplete="new-password"></div>' +
        '<div class="campo"><label for="c2">Repite la clave</label><input id="c2" type="password" autocomplete="new-password"></div>' +
        (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
        '<button class="btn" id="btn-clave">Guardar y entrar</button>' + pie + '</div>';
      document.getElementById('c1').focus();
      document.getElementById('btn-clave').addEventListener('click', async () => {
        const a1 = document.getElementById('c1').value, a2 = document.getElementById('c2').value;
        if (a1.length < 4) { st.error = 'La clave debe tener al menos 4 caracteres.'; return render(); }
        if (a1 !== a2) { st.error = 'Las claves no coinciden.'; return render(); }
        if (a1 === '1234') { st.error = 'Elige una clave distinta a la inicial.'; return render(); }
        try { await API.cambiarClave(st.cambio.token, a1); entrarPanel(st.cambio); }
        catch (e) { st.error = 'No se pudo guardar la clave.'; render(); }
      });
      return;
    }
    let lista = null;
    try { lista = await API.usuariosActivos(); } catch (e) { lista = null; }
    if (!lista || !lista.length) {
      app.innerHTML = barra('Panel interno') + '<div class="pmk-wrap"><h1 class="tit">Fichas de talla</h1>' +
        (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
        (lista ? '' : '<div class="aviso error">No se pudo conectar con el panel. Revisa tu internet y recarga la página.</div>') +
        '<button class="btn" id="btn-playmaker" type="button">Entrar con mi usuario Playmaker</button>' + pie + '</div>';
      document.getElementById('btn-playmaker').addEventListener('click', () => PMK_ACCESO.irAIngresar());
      return;
    }
    app.innerHTML = barra('Panel interno') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Fichas de talla</h1>' +
      '<p class="bajada">Acceso del equipo Playmaker.</p>' +
      '<button class="btn" id="btn-playmaker" type="button">Entrar con mi usuario Playmaker</button>' +
      '<p class="mini" style="margin:22px 0 10px">¿Aún no tienes usuario Playmaker? Entra con tu clave anterior del panel:</p>' +
      '<div class="campo"><label for="u">Usuario</label><select id="u">' +
      lista.map(u => '<option value="' + esc(u.usuario) + '">' + esc(u.nombre) + '</option>').join('') + '</select></div>' +
      '<div class="campo"><label for="pin">Clave</label>' +
      '<input id="pin" type="password" autocomplete="current-password" style="text-align:center;font-size:20px"></div>' +
      (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
      '<button class="btn plano" id="btn-pin">Entrar con clave anterior</button>' + pie + '</div>';
    document.getElementById('btn-playmaker').addEventListener('click', () => PMK_ACCESO.irAIngresar());
    const inp = document.getElementById('pin');
    const ver = async () => {
      const uval = document.getElementById('u').value, c = inp.value.trim();
      if (!c) return;
      try {
        const r = await API.login(uval, c);
        if (!r) { st.error = 'Clave incorrecta.'; return render(); }
        if (r.debe_cambiar) { st.error = ''; st.cambio = r; return render(); }
        entrarPanel(r);
      } catch (e) { st.error = 'No se pudo validar. Revisa tu conexión.'; render(); }
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ver(); });
    document.getElementById('btn-pin').addEventListener('click', ver);
  }

  /* ---- administración de usuarios del panel (solo administrador) ---- */
  const slugU = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '');
  async function pantUsuarios() {
    if (st.rol !== 'admin' || !st.token) { st.pant = 'lista'; return render(); }
    app.innerHTML = barra(st.usuario, 'lista') + '<div class="pmk-wrap"><div class="cargando">Cargando usuarios…</div></div>';
    let us;
    try { us = await API.usuarios(); }
    catch (e) { app.innerHTML = barra(st.usuario, 'lista') + '<div class="pmk-wrap"><div class="aviso error">Falta crear la tabla de usuarios en Supabase (fichas_usuarios).</div>' + pie + '</div>'; return; }
    let h = barra(st.usuario, 'lista') + '<div class="pmk-wrap"><h1 class="tit">Usuarios del panel</h1>' +
      '<p class="bajada">Tú defines quién entra y con qué rol. La clave inicial es 1234 y cada persona crea la suya en su primer ingreso.</p>';
    h += us.map(u => '<div class="campo" style="' + (u.activo ? '' : 'opacity:.5') + '">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><b>' + esc(u.nombre) + '</b>' +
      '<div class="mini">' + esc(u.usuario) + ' · ' + esc(ROLES_PANEL[u.rol] || u.rol) + ' · ' + (!u.activo ? 'inactivo' : u.debe_cambiar ? 'debe crear su clave' : 'activo') + '</div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn plano chico" data-reset="' + esc(u.usuario) + '">Restablecer clave</button>' +
      '<button class="btn plano chico" data-activo="' + esc(u.usuario) + '">' + (u.activo ? 'Desactivar' : 'Activar') + '</button>' +
      '<select data-rol="' + esc(u.usuario) + '" style="width:auto">' + Object.keys(ROLES_PANEL).map(r => '<option value="' + r + '"' + (u.rol === r ? ' selected' : '') + '>' + ROLES_PANEL[r] + '</option>').join('') + '</select></div></div></div>').join('');
    h += '<div class="campo"><label>Nuevo usuario</label>' +
      '<input id="nu-nombre" type="text" placeholder="Nombre y apellido" style="margin-bottom:8px">' +
      '<select id="nu-rol" style="margin-bottom:8px">' + Object.keys(ROLES_PANEL).map(r => '<option value="' + r + '"' + (r === 'fichas' ? ' selected' : '') + '>' + ROLES_PANEL[r] + '</option>').join('') + '</select>' +
      '<button class="btn" id="btn-nu">Crear usuario</button></div>';
    if (st.error) h += '<div class="aviso error">' + esc(st.error) + '</div>';
    app.innerHTML = h + pie + '</div>';
    const admins = us.filter(u => u.activo && u.rol === 'admin');
    const recargar = () => { st.error = ''; pantUsuarios(); };
    app.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', async () => {
      const u = us.find(x => x.usuario === b.dataset.reset);
      if (!confirm('¿Restablecer la clave de ' + u.nombre + '? Quedará en 1234 y deberá crear una nueva al entrar.')) return;
      try { await API.resetClave(u.usuario); alert('Clave de ' + u.nombre + ' restablecida a 1234.'); recargar(); } catch (e) { st.error = 'No se pudo restablecer.'; render(); }
    }));
    app.querySelectorAll('[data-activo]').forEach(b => b.addEventListener('click', async () => {
      const u = us.find(x => x.usuario === b.dataset.activo);
      if (u.activo && u.usuario === st.usuarioId) return alert('No puedes desactivarte a ti mismo.');
      if (u.activo && u.rol === 'admin' && admins.length <= 1) return alert('Debe quedar al menos un administrador activo.');
      try { await API.editarUsuario(u.usuario, { activo: !u.activo }); recargar(); } catch (e) {}
    }));
    app.querySelectorAll('[data-rol]').forEach(sel => sel.addEventListener('change', async () => {
      const u = us.find(x => x.usuario === sel.dataset.rol);
      if (u.rol === 'admin' && sel.value !== 'admin' && (admins.length <= 1 || u.usuario === st.usuarioId)) { alert('Debe quedar al menos un administrador y no puedes quitarte tu propio acceso.'); return recargar(); }
      try { await API.editarUsuario(u.usuario, { rol: sel.value }); recargar(); } catch (e) {}
    }));
    document.getElementById('btn-nu').addEventListener('click', async () => {
      const nombre = document.getElementById('nu-nombre').value.trim(); const rol = document.getElementById('nu-rol').value;
      const usuario = slugU(nombre);
      if (!nombre || !usuario) { st.error = 'Escribe el nombre.'; return render(); }
      if (us.some(x => x.usuario === usuario)) { st.error = 'Ya existe el usuario ' + usuario + '.'; return render(); }
      try { await API.crearUsuario({ usuario, nombre, rol }); alert('Usuario creado: ' + usuario + ' · clave inicial 1234'); recargar(); }
      catch (e) { st.error = 'No se pudo crear el usuario.'; render(); }
    });
  }
  async function pantLista() {
    if (!st.usuario) { st.pant = 'pin'; return render(); }
    app.innerHTML = barra(st.usuario) + '<div class="pmk-wrap"><div class="cargando">Cargando fichas…</div></div>';
    let fichas, nuevos;
    try { [fichas, nuevos] = await Promise.all([API.fichas(), API.sinVer()]); }   // a la vez, no una tras otra
    catch (e) { app.innerHTML = barra(st.usuario) + '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return; }
    const porRef = {};
    nuevos.forEach(a => { porRef[a.ref] = (porRef[a.ref] || 0) + a.exceso; });

    let h = barra(st.usuario) + '<div class="pmk-wrap">' +
      '<h1 class="tit">Fichas de talla</h1>' +
      '<p class="bajada">Una ficha por venta cerrada. Tú habilitas las prendas; el cliente completa las tallas.</p>';
    if (nuevos.length) {
      h += '<div class="aviso"><b>Clientes agregaron prendas.</b><br>' +
        nuevos.map(a => esc('+' + a.exceso + ' ' + prendaDe(a.prenda).nom.toLowerCase() + ' en ' + a.ref)).join('<br>') +
        '<br><br>Revisa cada ficha para ajustar la cotización antes de producir.</div>';
    }
    h += '<button class="btn" data-ir="ventas">Abrir ficha desde Ventas</button>' +
      '<button class="btn plano" data-ir="crear">Crear ficha manual</button>' +
      (st.rol === 'admin' && st.token ? '<button class="btn plano chico" data-ir="usuarios" style="margin-top:6px">Usuarios del panel</button>' : '') +
      '<button class="btn plano chico" id="btn-salir" style="margin-top:6px">Salir (' + esc(st.usuario || '') + ')</button>';

    if (!fichas.length) {
      h += '<div class="vacio"><div class="t">Sin fichas todavía</div><div class="d">Trae el primer pedido desde Ventas.</div></div>';
    } else {
      h += '<div class="buscador"><span class="lupa">⌕</span>' +
        '<input id="buscar" type="text" placeholder="Buscar por COT, cliente o proyecto" autocomplete="off"></div>';
      fichas.forEach(f => {
        const tot = items(f).reduce((n, i) => n + i.cant, 0);
        const quedan = diasRestantes(f);
        const clave = (f.ref + ' ' + f.cliente + ' ' + f.proyecto).toLowerCase();
        h += '<button class="lista-item" data-abrir="' + esc(f.ref) + '" data-buscar="' + esc(clave) + '">' +
          '<div class="izq"><div class="club">' + (porRef[f.ref] ? '<span class="punto"></span>' : '') + esc(f.proyecto) + '</div>' +
          '<div class="meta">' + esc(f.cliente) + ' · ' + tot + ' unidades · ' + (f.estado === 'confirmado' ? 'confirmado' : 'en carga') +
          (porRef[f.ref] ? ' · +' + porRef[f.ref] + ' agregadas' : '') +
          (quedan !== null && quedan <= 7
            ? ' · <span class="vence">' + (quedan <= 0 ? 'se borra hoy' : 'se borra en ' + quedan + (quedan === 1 ? ' día' : ' días')) + '</span>'
            : '') +
          '</div></div><div class="cod2">' + esc(f.ref) + '</div></button>';
      });
      h += '<div class="sin-resultado" id="sin-resultado">Ninguna ficha coincide con esa búsqueda.</div>';
      h += '<div class="mini" style="margin-top:16px;text-align:center">Las fichas se eliminan a los ' + DIAS_FICHA +
        ' días de creadas. Baja el PDF al OneDrive antes de ese plazo.</div>';
    }
    app.innerHTML = h + pie + '</div>';

    const buscar = document.getElementById('buscar');
    if (buscar) {
      const filtrar = () => {
        const q = buscar.value.trim().toLowerCase().replace(/^cot[-_ ]?/, '');
        let visibles = 0;
        app.querySelectorAll('[data-buscar]').forEach(el => {
          const calza = !q || el.dataset.buscar.replace(/cot-/g, '').indexOf(q) >= 0 || el.dataset.buscar.indexOf(q) >= 0;
          el.style.display = calza ? '' : 'none';
          if (calza) visibles++;
        });
        document.getElementById('sin-resultado').style.display = visibles ? 'none' : 'block';
      };
      buscar.addEventListener('input', filtrar);
      buscar.addEventListener('search', filtrar);
    }
    app.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', () => {
      st.ficha = fichas.find(f => f.ref === b.dataset.abrir);
      st.pest = porRef[b.dataset.abrir] ? 'avisos' : 'avance';
      st.pant = 'ficha'; render();
    }));
  }

  async function pantVentas() {
    app.innerHTML = barra('Pedidos desde Ventas', 'lista') + '<div class="pmk-wrap"><div class="cargando">Consultando el sistema de ventas…</div></div>';
    let pedidos, fichas;
    try { pedidos = await API.ventas(); fichas = await API.fichas(); }
    catch (e) { app.innerHTML = barra('Pedidos desde Ventas', 'lista') + '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return; }
    const conFicha = new Set(fichas.map(f => f.ref));
    const pend = pedidos.filter(p => p.cot && !conFicha.has(normalizarRef(p.cot)) && !/anul/i.test(p.estado || ''));

    let h = barra('Pedidos desde Ventas', 'lista') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Pedidos sin<br>ficha de tallas</h1>' +
      '<p class="bajada">Ingresados desde el ' + esc(fechaTxt(CFG.corte)) + '. ' + pedidos.length + ' en el período, ' + pend.length + ' sin ficha.</p>';
    if (!pend.length) h += '<div class="vacio"><div class="t">Todo con ficha</div><div class="d">Cada pedido del período ya tiene su ficha abierta.</div></div>';
    else pend.forEach(p => {
      h += '<button class="lista-item" data-ped="' + esc(p.id) + '">' +
        '<div class="izq"><div class="club">' + esc(p.cliente || 'Sin cliente') + '</div>' +
        '<div class="meta">' + (p.cantidad || 0) + ' prendas · ' + esc(p.vendedor || 'sin vendedor') +
        (p.fecha ? ' · entrega ' + esc(fechaTxt(p.fecha)) : '') + '</div></div>' +
        '<div class="cod2">' + esc(normalizarRef(p.cot)) + '</div></button>';
    });
    app.innerHTML = h + pie + '</div>';
    app.querySelectorAll('[data-ped]').forEach(b => b.addEventListener('click', () => {
      const p = pend.find(x => String(x.id) === b.dataset.ped);
      st.importado = p;
      st.lineas = null;
      st.pant = 'crear'; render();
    }));
  }

  async function pantCrear() {
    // si venimos desde Producción con ?nuevo=COT-xxxx, se busca el pedido en Ventas y se precarga
    if (st.crearRef && !st.importado) {
      const ref = st.crearRef;
      app.innerHTML = barra('Ficha desde Ventas', 'lista') + '<div class="pmk-wrap"><div class="cargando">Buscando ' + esc(ref) + ' en Ventas…</div></div>';
      const num = String(paramURL('venta') || ref).replace(/^COT-?/i, '').trim();
      let venta = null;
      try {   // el número puede estar guardado como 1235, COT-1235 o con espacios
        const campos = 'id,cliente,cot,cantidad,fecha,vendedor,estado,created_at';
        let vs = await VENTAS.get('pedidos?select=' + campos + '&cot=eq.' + encodeURIComponent(num) + '&limit=1');
        if (!vs || !vs.length) vs = await VENTAS.get('pedidos?select=' + campos + '&cot=ilike.*' + encodeURIComponent(num) + '*&limit=5');
        if (vs && vs.length) venta = vs.find(v => String(v.cot).replace(/^COT-?/i, '').trim() === num) || vs[0];
      } catch (e) {}
      if (!venta) {   // no está en Ventas: se crea igual con lo que envía Producción
        venta = { id: null, cot: num, cliente: paramURL('cliente') || '', cantidad: parseInt(paramURL('cant')) || 0, vendedor: paramURL('vend') || '', fecha: null };
        st.avisoCrear = 'Este pedido no se encontró en Ventas, así que la ficha se crea con los datos enviados desde Producción. Revísalos antes de guardar.';
      }
      st.importado = venta;
      // parte aprobada en Diseño (Planificación): referencia propia, solo sus prendas y la aprobación ya registrada
      st.parte = paramURL('venta') ? {
        ref: normalizarRef(ref), n: parseInt(paramURL('parte'), 10) || 1, venta: normalizarRef(paramURL('venta')),
        cant: parseInt(paramURL('cant'), 10) || 0,
        prendas: (paramURL('prendas') || '').split(',').filter(Boolean).map(x => { const t = x.split(':'); return { prenda: t[0], cant: parseInt(t[1], 10) || 0 }; }),
        aprobPor: paramURL('aprob') || '', aprobAt: paramURL('aprob_at') || ''
      } : null;
      st.lineas = null;
      st.crearRef = null;
    }
    if (!st.moldes && !st.moldesError) {
      app.innerHTML = barra('Nueva ficha', 'lista') + '<div class="pmk-wrap"><div class="cargando">Cargando catálogo de moldes…</div></div>';
      await cargarMoldes();
    }
    const imp = st.importado;
    if (!st.lineas) { st.lineas = []; st.idsUsados = []; st.catMol = null; st.catAbierto = true; st.crearCab = {}; st.reemplazo = null; }
    // lo escrito en la cabecera se conserva al agregar o quitar moldes (la pantalla se vuelve a dibujar)
    const cab = st.crearCab || (st.crearCab = {});
    const vCab = k => cab[k] != null ? ' value="' + esc(cab[k]) + '"' : '';
    const lineas = st.lineas;
    const parte = imp ? st.parte : null;
    const vendido = parte && parte.cant ? parte.cant : imp ? (parseInt(imp.cantidad, 10) || 0) : 0;
    const suma = lineas.reduce((n, l) => n + (l.cant || 0), 0);

    let h = barra(imp ? 'Ficha desde Ventas' : 'Ficha manual', imp ? 'ventas' : 'lista') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Habilitar prendas<br>del proyecto</h1>';
    if (imp) {
      h += '<p class="bajada">La cabecera viene de Ventas. Tú defines qué moldes se fabrican y cuántas unidades de cada uno.</p>' +
        (st.avisoCrear ? '<div class="aviso">' + esc(st.avisoCrear) + '</div>' : '') +
        '<div class="ref-cab"><span class="etiqueta">' + (parte && parte.ref !== parte.venta ? 'Parte ' + parte.n + ' del pedido ' + esc(parte.venta) : 'Pedido de ventas') + '</span>' +
        '<div class="ref">' + esc(parte ? parte.ref : normalizarRef(imp.cot)) + '</div>' +
        '<div class="proy">' + esc(imp.cliente || '') + '</div><div class="meta">' + vendido + (parte ? ' prendas con diseño aprobado' : ' prendas vendidas') +
        (imp.vendedor ? ' · ' + esc(imp.vendedor) : '') + (imp.fecha ? ' · entrega ' + esc(fechaTxt(imp.fecha)) : '') + '</div>' +
        (parte && parte.prendas.length ? '<div class="meta">Aprobado en Diseño: ' + esc(parte.prendas.map(x => prendaDe(x.prenda).nom + ' ' + x.cant).join(' · ')) + '</div>' : '') +
        '</div>';
    } else {
      h += '<p class="bajada">Para ventas que no estén en el sistema. Usa igual la referencia COT.</p>' +
        '<div class="campo"><label for="c-ref">Referencia de venta</label><div class="ayuda">Se guarda como COT-xxxx.</div>' +
        '<input id="c-ref" type="text" placeholder="COT-1234" autocapitalize="characters"' + vCab('c-ref') + '></div>' +

        if (imgsFuera.length || imgsCambian) {
          const quedan = imgsFinal.filter(Boolean);
          await API.imagenesFicha(f.ref, quedan); fn.imagenes = quedan;
          for (const i of imgsFuera) await borrarMontaje(i.path);
          for (const pp of Array.from(new Set(imgsFuera.map(i => i.pdfPath).filter(Boolean)))) if (!quedan.some(i => i.pdfPath === pp)) await borrarMontaje(pp);
        }
        // montajes adjuntados en las líneas de los diseños que quedan
        const conMj = lineas.filter(l => (l.mj || []).length && nuevos.some(i => i.prenda === l.prenda));
        if (conMj.length) {
          b.textContent = 'Subiendo montajes…';
          try { const nuevas = await subirMontajesLineas(fn, conMj, imgsDe(fn)); await API.imagenesFicha(f.ref, nuevas); fn.imagenes = nuevas; }
          catch (e2) { alert('Se guardaron las prendas y moldes, pero no se pudieron subir los montajes (' + String(e2.message || '').slice(0, 100) + '). Súbelos en la ficha técnica, dentro de cada diseño.'); }
          lineas.forEach(l => (l.mj || []).forEach(liberarMontaje));
        }
        await sincronizarAvisos(fn, detsFin);
        st.ficha = fn; st.lineas = null; st.specsBorrador = null; st.error = ''; st.reemplazo = null;
        // con un molde cambiado se abre la ficha técnica en ese diseño, para revisar despiece, telas y montaje
        if (cambiados.length) { st.tecAbiertos = { especif: true }; cambiados.forEach(l => { st.tecAbiertos['p-' + l.prenda] = true; }); st.pant = 'tecnica'; }
        else st.pant = 'ficha';
        render();
      } catch (e) { st.error = 'No se pudo guardar. ' + e.message.slice(0, 600); b.disabled = false; render(); }
    });
  }

  // Proceso de cada pieza: Producción lo usa para saber si el pedido pasa por sublimación o estampado
  const PROCESOS_PIEZA = ['Sublimada', 'Color de tela (sin sublimar)', 'Estampada'];
  const selProceso = (attrs, valor) => '<select ' + attrs + '><option value="">Sin definir</option>' +
    PROCESOS_PIEZA.map(t => '<option' + (t === valor ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
    (valor && PROCESOS_PIEZA.indexOf(valor) < 0 ? '<option value="' + esc(valor) + '" selected>' + esc(valor) + ' (anterior)</option>' : '') + '</select>';

  // Servicios adicionales: los mismos códigos que usa Planificación, con el detalle que necesita Producción
  const SERV_FICHA = [
    ['MEDIAS-ADL', 'Medias adulto', 'Color o detalle (ej: personalizadas, negras con franja blanca)'],
    ['MEDIAS-INF', 'Medias infantil', 'Color o detalle (ej: personalizadas, negras)'],
    ['VINILO', 'Vinilo', 'Qué y dónde (ej: número en la espalda)'],
    ['DTF', 'DTF', 'Qué y dónde (ej: sponsor en el pecho)'],
    ['BORDADOS', 'Bordado', 'Qué y dónde (ej: escudo pecho izquierdo)'],
    ['ESCUDOS TEXTURIZADOS', 'Escudo texturizado', 'Dónde va (ej: pecho izquierdo)'],
    ['ESCUDOS IMPORTADOS', 'Escudo importado', 'Dónde va (ej: pecho izquierdo)']
  ];

  // Los shorts no llevan despiece: delantero y trasero van en la misma tela. Se registra la tela, el proceso,
  // si lleva aplicación de otra tela y si lleva cierre (accesorio). Al guardar se arma su despiece simple.
  const esShort = id => basePrenda(id) === 'short' || basePrenda(id) === 'short_salida';
  // Shorts y calzas pueden llevar número o no: specs[prenda].numero = 'si' / 'no' (sin definir: como antes,
  // la ficha muestra el número si alguien lo tiene). La camiseta siempre lleva número.
  // prendas en que se define si llevan número (las camisetas también: hay pedidos sin nombre ni número)
  const numeroOpcional = id => ['camiseta', 'short', 'short_salida', 'calza_larga'].indexOf(basePrenda(id)) >= 0;
  // ¿esta prenda necesita número? La camiseta sí, salvo que se haya dicho que no lleva; shorts y calzas, solo si se dijo que sí
  const pideNumero = (f, id) => basePrenda(id) === 'camiseta' ? llevaNumero(f, id) !== false : numeroOpcional(id) && llevaNumero(f, id) === true;
  const llevaNumero = (f, id) => { const v = ((specsDe(f) || {})[id] || {}).numero; return v === 'si' ? true : v === 'no' ? false : null; };
  const despieceShort = sp => ({ molde: '', nombre: 'short', piezas:
    [{ pieza: 'Short completo (delantero y trasero)', cant: 1, tela: [sp.tela, sp.telaDetalle].filter(Boolean).join(' · '), detalle: sp.proceso || '' }]
      .concat(sp.conAplic ? [{ pieza: 'Aplicación', cant: 1, tela: sp.aplicTela || '', detalle: '' }] : [])
      .concat(sp.cierre ? [{ pieza: 'Cierre (accesorio)', cant: 1, tela: '', detalle: '' }] : []) });

  /* ---- ficha técnica: tela, molde, aplicación y montajes ---- */
  async function pantTecnica() {
    const f = st.ficha;
    if (!Array.isArray(st.cat)) {
      app.innerHTML = barra('Ficha técnica', 'ficha') + '<div class="pmk-wrap"><div class="cargando">Cargando catálogo…</div></div>';
      try { st.cat = await API.catalogo() || []; }
      catch (e) { app.innerHTML = barra('Ficha técnica', 'ficha') + '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return; }
    }
    if (!st.moldes && !st.moldesError) await cargarMoldes();
    const cat = st.cat;
    // el borrador sobrevive a los re-render que provoca elegir una línea de tela
    if (!st.specsBorrador) st.specsBorrador = JSON.parse(JSON.stringify(specsDe(f)));
    const specs = st.specsBorrador;
    const imgs = imgsDe(f);
    const its = items(f);

    const lineasTela = cat.filter(c => c.tipo === 'tela' && !c.padre);
    const telasDe = idPadre => cat.filter(c => c.tipo === 'tela' && c.padre === idPadre);
    const opciones = tipo => cat.filter(c => c.tipo === tipo && !c.padre);

    function selectSimple(idPrenda, campo, lista, etiqueta, valor) {
      return '<label for="s-' + idPrenda + '-' + campo + '">' + etiqueta + '</label>' +
        '<select id="s-' + idPrenda + '-' + campo + '" data-spec="' + idPrenda + '" data-campo="' + campo + '">' +
        '<option value="">Sin definir</option>' +
        lista.map(o => '<option value="' + esc(o.nombre) + '"' + (valor === o.nombre ? ' selected' : '') + '>' + esc(o.nombre) + '</option>').join('') +
        (valor && !lista.some(o => o.nombre === valor) ? '<option value="' + esc(valor) + '" selected>' + esc(valor) + '</option>' : '') +
        '</select>';
    }

    // secciones desplegables: se recuerda cuáles están abiertas entre una actualización y otra
    const abiertos = st.tecAbiertos || (st.tecAbiertos = { especif: true });
    const sec = (id, titulo, resumen) => '<details class="sec-ft" data-sec="' + id + '"' + (abiertos[id] ? ' open' : '') + '><summary><span class="t">' +
      esc(titulo) + '</span><span class="r">' + esc(resumen || '') + '</span></summary><div class="cuerpo">';
    const finSec = '</div></details>';
    const resumenPrenda = (it, sp) => {
      if (prendaDe(it.prenda).origen) return it.cant + ' u.' + (sp.origen ? ' · ' + sp.origen : '');
      const nM = Object.values(sp.moldes || {}).filter(Boolean).length;
      return (sp.moldeCambiado ? 'molde cambiado: revisar · ' : '') + it.cant + ' u. · ' + tipoDe(it.prenda) + (nM ? '' : ' · falta molde') + ' · ' + (sp.tela ? sp.tela : 'falta tela') + (sp.entrega ? ' · entrega ' + fechaTxt(sp.entrega) : '');
    };

    // ---- montajes: cada diseño tiene los suyos (imagen o PDF; las páginas de un PDF van juntas, mismo «grupo») ----
    const grupoImg = i => i.grupo || i.path;
    const legadoDiseno = imgs.some(i => disenoImg(i) > 1);   // fichas con dos diseños en un mismo molde (antes de los diseños por molde)
    // moldes de la ficha para esas prendas (un molde usado en dos calces aparece una vez)
    const moldesOpc = sel => {
      const out = [];
      sel.forEach(pr => { const mo = (specs[pr] || {}).moldes || {};
        ORDEN_CALCE.forEach(c => { const v = mo[c]; if (!v || v === '|manual') return;
          const ya = out.find(o => o.v === v && o.pr === pr); if (ya) ya.cals.push(c); else out.push({ v: v, pr: pr, cals: [c] }); }); });
      return out.map(o => ({ v: o.v, txt: (sel.length > 1 ? nomDeSpecs(specs, o.pr) + ' · ' : '') + o.cals.join(' y ') + ': ' + moldeTxt(o.v) }));
    };
    const maxDiseno = Math.min(9, Math.max(2, imgs.reduce((n, i) => Math.max(n, disenoImg(i)), 1) + 1));
    // fijo: el diseño al que pertenece (dentro de su ficha no se pregunta la prenda, y el «Diseño N» del molde solo en fichas antiguas que lo usan)
    const formClasif = (attr, sel, vista, arq, grupo, mSel, dis, fijo) => {
      const ops = moldesOpc(sel);
      return '<div class="clasif">' + (fijo ? '' : '<div class="lab-mini">¿De qué prenda es? <span>(puede ser más de una)</span></div><div class="chips">' +
      its.map(it => '<label class="chip' + (sel.indexOf(it.prenda) >= 0 ? ' on' : '') + '"><input type="checkbox" ' + attr + ' data-prenda="' + it.prenda + '"' +
        (sel.indexOf(it.prenda) >= 0 ? ' checked' : '') + '>' + esc(nomDeSpecs(specs, it.prenda)) + '</label>').join('') + '</div>') +
      (ops.length > 1 ? '<div class="lab-mini">¿De qué molde? <span>(los que se eligieron al crear la ficha; puede ser más de uno)</span></div><div class="chips">' +
        ops.map(o => '<label class="chip' + ((mSel || []).indexOf(o.v) >= 0 ? ' on' : '') + '"><input type="checkbox" ' + attr + ' data-mimg="' + esc(o.v) + '"' +
          ((mSel || []).indexOf(o.v) >= 0 ? ' checked' : '') + '>' + esc(o.txt) + '</label>').join('') + '</div>'
        : ops.length === 1 && !fijo ? '<div class="mini" style="margin-top:8px">Molde: <b>' + esc(ops[0].txt) + '</b></div>' : '') +
      (!fijo || legadoDiseno ? '<div class="lab-mini">¿Qué diseño es? <span>(si el molde tiene más de un diseño, el cliente indica cuál lleva cada persona)</span></div><select ' + attr + ' data-diseno="1">' +
        Array.from({ length: maxDiseno }, (x, k) => k + 1).map(n => '<option value="' + n + '"' + ((+dis || 1) === n ? ' selected' : '') + '>Diseño ' + n + '</option>').join('') + '</select>' : '') +
      '<div class="lab-mini">¿Qué vista muestra?</div><select ' + attr + ' data-vista="1"><option value="">Elegir vista…</option>' +
      VISTAS.map(v => '<option' + (v === vista ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>' +
      (!arq ? '' : '<div class="lab-mini" style="margin-top:10px">¿Es de ' + esc(nombreArq(f).toLowerCase()) + '? <span>(su diseño va aparte, en la hoja de ' + esc(nombreArq(f) === 'Líbero' ? 'los líberos' : 'los arqueros') + ')</span></div><div class="chips">' +
      [['no', 'No'], ['si', 'Sí']].map(o => '<label class="chip' + ((arq ? 'si' : 'no') === o[0] ? ' on' : '') + '"><input type="radio" name="arq-' + grupo + '" ' + attr + ' data-arq="' + o[0] + '"' +
        ((arq ? 'si' : 'no') === o[0] ? ' checked' : '') + '>' + o[1] + '</label>').join('') + '</div>') + '</div>';
    };
    // molde(s) con que queda registrado: el único de la prenda, o los marcados si tiene varios
    const moldesFinal = obj => { const ops = moldesOpc(obj.prendas); return ops.length === 1 ? [ops[0].v] : (obj.moldes || []).filter(v => ops.some(o => o.v === v)); };
    const faltaMolde = obj => moldesOpc(obj.prendas).length > 1 && !moldesFinal(obj).length;
    const pend = st.pendientes || [];
    const capMontaje = (i, id) => [i.vista || 'sin vista', i.origen === 'pdf' ? 'PDF' + (i.paginas > 1 ? ' · ' + i.paginas + ' págs.' : '') : '',
      legadoDiseno ? 'Diseño ' + disenoImg(i) : '', i.arquero ? nombreArq(f) : '',
      id && prendasImg(i).length > 1 ? 'también en ' + prendasImg(i).filter(k => k !== id).map(k => nomDeSpecs(specs, k)).join(', ') : ''].filter(Boolean).join(' · ');
    const miniMontaje = (i, k, id) => '<div class="mini-img' + (prendasImg(i).length && i.vista ? '' : ' sin-clasif') + '">' +
      '<a href="' + esc(i.pdf || i.url) + '" target="_blank" rel="noopener" title="Ver en grande"><img src="' + esc(i.url) + '" alt="' + esc(i.nombre || 'Montaje') + '"></a>' +
      '<button class="quitar" data-quitar-img="' + k + '" aria-label="Eliminar montaje">×</button>' +
      '<div class="cap">' + esc(id ? capMontaje(i, id) : etiquetaImg(i, f)) + '<br>' + esc(fechaTxt(i.subida)) + '</div>' +
      '<button class="btn plano chico" data-reemplazar-img="' + k + '">Reemplazar</button>' +
      '<button class="btn plano chico" data-editar-img="' + k + '" data-dis="' + esc(id) + '">' + (id ? 'Cambiar vista' : 'Cambiar prenda, molde o vista') + '</button></div>';
    const primeraDelGrupo = (x, k) => imgs.findIndex(y => grupoImg(y) === grupoImg(x)) === k;
    const montajesDe = id => imgs.map((i, k) => ({ i: i, k: k })).filter(x => prendasImg(x.i).indexOf(id) >= 0 && primeraDelGrupo(x.i, x.k));
    const huerfanos = imgs.map((i, k) => ({ i: i, k: k })).filter(x => !prendasImg(x.i).some(id => its.some(it => it.prenda === id)) && primeraDelGrupo(x.i, x.k));
    const formEdit = id => st.editImg && st.editImg.dis === id && imgs[st.editImg.k] ? '<div class="pend editar"><img src="' + esc(imgs[st.editImg.k].url) + '" alt="">' +
      formClasif('data-ed="1"', st.editImg.prendas, st.editImg.vista, st.editImg.arquero, 'ed', st.editImg.moldes, st.editImg.diseno, id) + '</div>' +
      '<div class="btn-par"><button class="btn" id="btn-guardar-clasif">Guardar</button><button class="btn plano" id="btn-cancelar-clasif">Cancelar</button></div>' : '';
    const bloqueMontaje = id => {
      const ms = montajesDe(id), pd = pend.map((x, k) => ({ p: x, k: k })).filter(x => x.p.prendas[0] === id), ops = moldesOpc([id]);
      let b = '<div class="ayuda">Imagen o PDF del montaje de este diseño' + (ops.length === 1 ? ' (' + esc(ops[0].txt) + ')' : '') +
        '. Lo ve el cliente al cargar las tallas y sale en la hoja de este diseño en la ficha de producción.</div>';
      if (ms.length) b += '<div class="miniaturas">' + ms.map(x => miniMontaje(x.i, x.k, id)).join('') + '</div>';
      b += formEdit(id);
      if (pd.length) {
        b += '<div class="pendientes">' + pd.map(x => '<div class="pend"><div class="pend-prev">' +
            (x.p.pdf ? x.p.paginas.map(pg => '<img src="' + pg.url + '" alt="">').join('') + '<div class="mini">PDF · ' + x.p.paginas.length + (x.p.paginas.length > 1 ? ' páginas' : ' página') +
              (x.p.total > x.p.paginas.length ? ' (de ' + x.p.total + '; se usan las primeras ' + x.p.paginas.length + ')' : '') + '</div>' : '<img src="' + x.p.url + '" alt="">') + '</div>' +
            formClasif('data-pend="' + x.k + '"', x.p.prendas, x.p.vista, x.p.arquero, 'p' + x.k, x.p.moldes, x.p.diseno, id) + '</div>').join('') + '</div>' +
          '<div class="btn-par"><button class="btn" data-mj-subir="' + esc(id) + '">Subir ' + (pd.length > 1 ? pd.length + ' montajes' : 'montaje') + '</button>' +
          '<button class="btn plano" data-mj-cancelar="' + esc(id) + '">Cancelar</button></div>';
      } else b += '<button class="btn plano chico" data-mj-agregar="' + esc(id) + '">' + (ms.length ? '+ Agregar otro montaje' : '+ Adjuntar montaje (imagen o PDF)') + '</button>';
      if (st.subiendo && st.subiendoDis === id) b += '<div class="subiendo">' + esc(st.subiendo) + '</div>';
      return b;
    };

    let h = barra('Ficha técnica', 'ficha') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Ficha técnica<br>y montajes</h1>' +
      '<p class="bajada">Lo que define cómo se produce cada diseño. El cliente no ve esto: solo ve los montajes.</p>' +
      cabFicha(f) +
      sec('especif', 'Especificaciones por prenda', its.map(it => nomDeSpecs(specs, it.prenda)).join(' · ')) +
      '<div class="ayuda">Cada molde agregado es un <b>diseño</b> propio: toca uno para ver su nombre, molde, tela, despiece y montaje. Si falta una tela, un molde o una aplicación, agrégala al catálogo con el botón de más abajo. ' +
      'Los montajes se guardan ' + DIAS_MONTAJES + ' días y después se borran solos: el respaldo definitivo es el PDF que ustedes bajan al OneDrive.</div>' +
      (f.montaje_aprobado && /^Diseño · /.test(f.montaje_aprobado_por || '') ? '<div class="mini" style="margin-top:6px">Diseño aprobado en Planificación (' + esc(f.montaje_aprobado_por.replace(/^Diseño · /, '')) +
        (f.montaje_aprobado_at ? ' · ' + esc(fechaTxt(f.montaje_aprobado_at)) : '') + ').</div>' : '');

    its.forEach(it => {
      const p = prendaDe(it.prenda), sp = specs[it.prenda] || {};
      let np = 0; const paso = t => '<div class="paso-ft">' + (++np) + ' · ' + t + '</div>';
      h += '<details class="spec-prenda" data-sec="p-' + it.prenda + '"' + (abiertos['p-' + it.prenda] ? ' open' : '') + '><summary class="nom">' +
        '<span data-dis-tit="' + it.prenda + '">' + esc(p.origen ? nomDeSpecs(specs, it.prenda) : nomDMSpecs(specs, it.prenda)) + '</span><span class="r">' + esc(resumenPrenda(it, sp)) + '</span></summary>';

      // molde cambiado en «Editar prendas y moldes»: se avisa hasta que alguien marque que lo revisó
      if (sp.moldeCambiado && typeof sp.moldeCambiado === 'object') {
        const mc = sp.moldeCambiado;
        h += '<div class="aviso mc-aviso" data-mc="' + it.prenda + '">Se cambió el molde de este diseño' + (mc.antes ? ': antes <b>' + esc(mc.antes) + '</b>' : '') +
          (mc.ahora ? ', ahora <b>' + esc(mc.ahora) + '</b>' : '') + (mc.at ? ' (' + esc(fechaTxt(mc.at)) + (mc.por ? ', ' + esc(mc.por) : '') + ')' : '') + '. ' +
          'Las personas, sus tallas y los montajes se conservaron. Revisa el despiece, la tela de cada pieza y el montaje.' +
          '<label class="chk-ft"><input type="checkbox" data-mc-ok="' + it.prenda + '"' + (mc.revisado ? ' checked' : '') + '> Ya lo revisé (se guarda con «Guardar ficha técnica»)</label></div>';
      }

      // a · nombre del diseño y su fecha de entrega (las medias no son un diseño: se compran o salen de stock)
      if (!p.origen) {
        h += paso('Nombre del diseño') +
          '<div class="ayuda">El nombre es del diseño (ej: «Rama Voleibol»); el molde conserva el suyo.</div>' +
          '<input type="text" id="dn-' + it.prenda + '" maxlength="60" data-dis-nombre="' + it.prenda + '" value="' + esc(sp.nombre || '') + '" placeholder="' + esc(prendaDe(it.prenda).nom) + '" aria-label="Nombre del diseño">' +
          '<div class="mini" style="margin-top:6px">En la ficha: <b data-dis-ve="' + it.prenda + '">' + esc(nomDMSpecs(specs, it.prenda)) + '</b> · ' + esc(tipoDe(it.prenda)) + '</div>' +
          '<label for="fd-' + it.prenda + '">Fecha de entrega de este diseño</label>' +
          '<input type="date" id="fd-' + it.prenda + '" data-dis-fecha="' + it.prenda + '" value="' + esc(sp.entrega || '') + '">' +
          '<div class="mini">Si queda vacía, vale la entrega al cliente de la ficha' + (f.entrega_cliente ? ' (' + esc(fechaTxt(f.entrega_cliente)) + ')' : '') + '.</div>' +
          '<div class="aviso error" data-dis-fecha-aviso="' + it.prenda + '" style="display:none"></div>';
      }

      // las medias no llevan molde: se compran o salen de stock
      if (p.origen) {
        const cq = sp.cantidades && typeof sp.cantidades === 'object' ? sp.cantidades : null;
        if (porCantidad(it.prenda)) h += '<div class="ayuda">Cada línea de medias es un diseño: otro color va en otra línea, con su montaje. El nombre y los pares por talla se cambian en «Editar prendas y moldes».</div>' +
          '<div class="mini">Pares por talla: <b>' + esc(cq && sumaCant(cq) ? textoCant(cq) + ' (' + sumaCant(cq) + ' pares)' : 'los indica el cliente') + '</b></div>';
        h += '<label for="o-' + it.prenda + '">Origen</label>' +
          '<select id="o-' + it.prenda + '" data-spec="' + it.prenda + '" data-campo="origen">' +
          ['', 'PMK', 'Externa'].map(o => '<option value="' + o + '"' + ((sp.origen || '') === o ? ' selected' : '') + '>' +
            (o === '' ? 'Sin definir' : (o === 'PMK' ? 'PMK — stock propio' : 'Externa — proveedor externo')) + '</option>').join('') +
          '</select>';
      }

      // b · molde según el calce: solo los calces con molde (del catálogo; si no está, ingreso manual, que queda marcado)
      const moldes = sp.moldes || {};
      if (!p.origen) {
      h += '<div class="moldes-calce">' + paso('Molde según el calce') +
        '<div class="ayuda">' + (esShort(it.prenda) ? 'El molde de cada calce, del catálogo de moldes vigentes' : 'Primero el molde: trae su despiece. Del catálogo de moldes vigentes') + '; si no está, elige «Otro» y escríbelo (queda marcado como ingreso manual). Cuántas prendas lleva cada molde se define en «Editar prendas y moldes».</div>';
      const deps = deportesPara(it.prenda);
      if (deps.length > 1 || (deps.length === 1 && sp.deporte && sp.deporte !== deps[0])) {
        h += '<label for="dep-' + it.prenda + '">Deporte</label><select id="dep-' + it.prenda + '" data-spec="' + it.prenda + '" data-campo="deporte">' +

      const fc = document.getElementById('fe-cliente').value;
      // los shorts guardan su despiece simple (tela, proceso, aplicación y cierre) para Producción
      its.forEach(it => { if (esShort(it.prenda) && specs[it.prenda]) specs[it.prenda].despiece = despieceShort(specs[it.prenda]); });
      // molde cambiado ya revisado: deja de avisarse
      its.forEach(it => { const sp = specs[it.prenda]; if (sp && sp.moldeCambiado && (typeof sp.moldeCambiado !== 'object' || sp.moldeCambiado.revisado)) delete sp.moldeCambiado; });
      try {
        await API.specsFicha(f.ref, specs);
        await API.fechasFicha(f.ref, fi, fc);

      } catch (e) { st.error = 'No se pudo guardar. ' + (e.message || '').slice(0, 600); b.disabled = false; render(); }
    });

    const file = document.getElementById('file-montaje'), fileR = document.getElementById('file-reemplazo');
    const mostrarSubiendo = () => { const s2 = document.querySelector('.subiendo'); if (s2) s2.textContent = st.subiendo; else render(); };
    const liberarPend = liberarMontaje, prepararArchivo = prepararMontaje;
    const fConSpecs = () => Object.assign({}, f, { specs: specs });   // nombres del borrador en las etiquetas
    const subirUno = (x, c) => subirMontajeArchivo(fConSpecs(), x, c);
    app.querySelectorAll('[data-mj-agregar]').forEach(b => b.addEventListener('click', () => { st.mjDestino = b.dataset.mjAgregar; file.value = ''; file.click(); }));
    file.addEventListener('change', async e => {
      const archivos = Array.from(e.target.files || []), id = st.mjDestino;

      }
      const yaHay = imgs.filter(i => prendasImg(i).indexOf(id) >= 0).length + (st.pendientes || []).filter(x => x.prendas[0] === id).reduce((n, x) => n + cuentaImgs(x), 0);
      if (yaHay + nuevos.reduce((n, x) => n + cuentaImgs(x), 0) > MAX_MONTAJES) {

      }

    });
    // marcar molde, diseño, vista y arquero (en montajes por registrar y al corregir uno ya subido)
    const marcar = (obj, el) => {
      if (el.dataset.vista) { obj.vista = el.value; return; }
      if (el.dataset.diseno) { obj.diseno = +el.value || 1; return; }
      if (el.dataset.mimg) {
        obj.moldes = (obj.moldes || []).filter(x => x !== el.dataset.mimg); if (el.checked) obj.moldes.push(el.dataset.mimg);

      }
      if (el.dataset.arq) {
        obj.arquero = el.dataset.arq === 'si';
        el.closest('.chips').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
        return;
      }
      const id = el.dataset.prenda;
      obj.prendas = obj.prendas.filter(x => x !== id);
      if (el.checked) obj.prendas.push(id);
      obj.prendas.sort((a, b) => its.findIndex(x => x.prenda === a) - its.findIndex(x => x.prenda === b));
      el.parentElement.classList.toggle('on', el.checked);

    };
    app.querySelectorAll('[data-pend]').forEach(el => el.addEventListener('change', () => marcar(st.pendientes[+el.dataset.pend], el)));
    app.querySelectorAll('[data-ed]').forEach(el => el.addEventListener('change', () => marcar(st.editImg, el)));
    app.querySelectorAll('[data-mj-cancelar]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.mjCancelar; st.pendientes = (st.pendientes || []).filter(x => { if (x.prendas[0] !== id) return true; liberarPend(x); return false; });
      st.error = ''; render();
    }));
    app.querySelectorAll('[data-mj-subir]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.mjSubir, lote = (st.pendientes || []).filter(x => x.prendas[0] === id);
      const faltan = lote.map((x, k) => (!x.vista || faltaMolde(x)) ? k + 1 : 0).filter(Boolean);
      if (faltan.length) { st.error = 'Indica ' + (moldesOpc([id]).length > 1 ? 'el molde y ' : '') + 'la vista de cada montaje' + (lote.length > 1 ? ' (falta en el ' + faltan.join(', ') + ')' : '') + '.'; return render(); }
      b.disabled = true;
      const nuevas = imgs.slice();
      st.subiendoDis = id;
      for (let i = 0; i < lote.length; i++) {
        st.subiendo = 'Subiendo montaje ' + (i + 1) + ' de ' + lote.length + '…'; mostrarSubiendo();
        try { (await subirUno(lote[i], { prendas: lote[i].prendas.slice(), prenda: id, vista: lote[i].vista, arquero: !!lote[i].arquero, moldes: moldesFinal(lote[i]), diseno: +lote[i].diseno || 1 }))
          .forEach(r => nuevas.push(r)); }
        catch (err) { st.subiendo = ''; st.error = 'No se pudo subir ' + lote[i].file.name + '. ' + (err.message || '').slice(0, 100); return render(); }
      }
      try {
        await API.imagenesFicha(f.ref, nuevas);
        st.ficha = Object.assign({}, f, { imagenes: nuevas });
        lote.forEach(liberarPend); st.pendientes = st.pendientes.filter(x => lote.indexOf(x) < 0); st.subiendo = ''; st.error = ''; render();
      } catch (err) { st.subiendo = ''; st.error = 'Los montajes subieron pero no se pudieron enlazar. Intenta de nuevo.'; render(); }
    }));
    // reemplazar un montaje (con todas sus páginas, si era un PDF) por otro archivo: conserva diseño, molde, vista y arquero
    app.querySelectorAll('[data-reemplazar-img]').forEach(b => b.addEventListener('click', () => { st.mjReemplazo = +b.dataset.reemplazarImg; fileR.value = ''; fileR.click(); }));
    fileR.addEventListener('change', async e => {
      const a = (e.target.files || [])[0], k = st.mjReemplazo; if (!a || k == null || !imgs[k]) return;
      const viejo = imgs[k], del = imgs.filter(x => grupoImg(x) === grupoImg(viejo));
      st.subiendoDis = prendasImg(viejo).find(id => its.some(it => it.prenda === id)) || ''; st.error = ''; st.editImg = null;

        st.subiendo = 'Reemplazando el montaje…'; mostrarSubiendo();
        const regs = await subirUno(x, { prendas: prendasImg(viejo).slice(), prenda: prendasImg(viejo)[0], vista: viejo.vista || 'Completo', arquero: !!viejo.arquero,
          moldes: moldesImg(viejo).slice(), diseno: disenoImg(viejo) });
        liberarPend(x);
        const pos = imgs.indexOf(del[0]), nuevas = imgs.filter(y => del.indexOf(y) < 0);
        nuevas.splice(pos, 0, ...regs);
        await API.imagenesFicha(f.ref, nuevas);

        for (const y of del) await borrarMontaje(y.path);
        for (const pp of Array.from(new Set(del.map(y => y.pdfPath).filter(Boolean)))) await borrarMontaje(pp);

      } catch (err) { st.subiendo = ''; st.error = 'No se pudo reemplazar el montaje. ' + (err.message || '').slice(0, 120); render(); }

    app.querySelectorAll('[data-editar-img]').forEach(b => b.addEventListener('click', () => {
      const k = +b.dataset.editarImg;

      try { await API.imagenesFicha(f.ref, nuevas); st.ficha = Object.assign({}, f, { imagenes: nuevas }); st.editImg = null; st.error = ''; render(); }
      catch (err) { st.error = 'No se pudo guardar. ' + (err.message || '').slice(0, 100); render(); }
    });
    // eliminar un montaje (un PDF, con todas sus páginas)
    app.querySelectorAll('[data-quitar-img]').forEach(b => b.addEventListener('click', async () => {

      const quedan = imgs.filter(x => del.indexOf(x) < 0);
      st.editImg = null;

      for (const pp of Array.from(new Set(del.map(y => y.pdfPath).filter(Boolean)))) await borrarMontaje(pp);
      try {
        await API.imagenesFicha(f.ref, quedan);
