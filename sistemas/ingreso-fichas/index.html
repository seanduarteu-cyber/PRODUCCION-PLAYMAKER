<style>
/* ============================================================
   Base pensada para celular. El computador es la adaptación,
   en el bloque @media de más abajo.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fff; }

#pmk {
  --negro: #000; --blanco: #fff; --naranja: #ED6C23;
  --humo: #f4f4f4; --linea: #e2e2e2; --gris: #6e6e6e; --verde: #1f7a45; --rojo: #c62828;
  font-family: 'Poppins', system-ui, sans-serif;
  color: var(--negro); background: var(--blanco);
  max-width: 560px; margin: 0 auto;
  padding: 0 0 calc(28px + env(safe-area-inset-bottom));
  line-height: 1.5; -webkit-font-smoothing: antialiased;
}
#pmk h1, #pmk h2 { font-family: 'Oswald', 'Poppins', sans-serif; font-weight: 600; letter-spacing: .01em; margin: 0; line-height: 1.1; }
#pmk p { margin: 0; }

.pmk-top { background: var(--negro); color: var(--blanco); display: flex; align-items: center; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top)) 20px 16px; }
.pmk-top .iso { width: 30px; height: 30px; border-radius: 7px; flex: none; }
.pmk-top .marca { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; }
.pmk-top .marca em { font-style: normal; color: var(--naranja); }
.pmk-top .sub { font-size: 11px; color: #9a9a9a; letter-spacing: .04em; margin-top: 2px; }
.pmk-volver { margin-left: auto; background: none; border: 1px solid #3a3a3a; color: #cfcfcf; border-radius: 999px;
  font-size: 13px; font-family: inherit; padding: 8px 15px; cursor: pointer; min-height: 40px; }
.pmk-volver:active { border-color: var(--naranja); color: var(--naranja); }

.pmk-wrap { padding: 22px 18px 0; }
.tit { font-size: 26px; text-transform: uppercase; }
.bajada { font-size: 14px; color: var(--gris); margin-top: 8px; }
.mini { font-size: 12px; color: var(--gris); }

.ref-cab { border: 1px solid var(--linea); border-left: 4px solid var(--naranja); border-radius: 0 12px 12px 0; padding: 14px 16px; margin-top: 16px; }
.ref-cab .ref { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: .06em; }
.ref-cab .proy { font-size: 14px; font-weight: 500; margin-top: 2px; }
.ref-cab .meta { font-size: 12px; color: var(--gris); margin-top: 4px; }
.etiqueta { display: inline-block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }

.acceso { display: block; width: 100%; text-align: left; border: 1px solid var(--linea); background: var(--blanco);
  border-radius: 14px; padding: 18px; margin-top: 12px; font-family: inherit; cursor: pointer; }
.acceso .rot { font-family: 'Oswald', sans-serif; font-size: 17px; text-transform: uppercase; letter-spacing: .02em; }
.acceso .det { font-size: 13px; color: var(--gris); margin-top: 3px; }
.acceso.primario { background: var(--negro); border-color: var(--negro); color: var(--blanco); }
.acceso.primario .det { color: #a8a8a8; }
.acceso.primario .rot { color: var(--naranja); }

.avance { border-top: 1px solid var(--linea); padding-top: 12px; margin-top: 12px; }
.avance:first-of-type { border-top: none; }
.avance .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.avance .n { font-family: 'Oswald', sans-serif; font-size: 15px; text-transform: uppercase; }
.avance .c { font-family: 'Oswald', sans-serif; font-size: 15px; }
.avance .c.listo { color: var(--verde); }
.avance .c.falta, .avance .c.extra { color: var(--naranja); }
.avance .nota { font-size: 12px; color: var(--naranja); margin-top: 5px; }
.prog { height: 6px; background: var(--humo); border-radius: 99px; overflow: hidden; margin-top: 7px; }
.prog i { display: block; height: 100%; background: var(--naranja); border-radius: 99px; }
.prog i.listo { background: var(--verde); }

.jersey-box { background: var(--negro); border-radius: 16px; padding: 18px 16px 14px; display: flex; gap: 16px; align-items: center; }
.jersey-box svg { width: 92px; flex: none; }
.jersey-datos .et { font-size: 10px; color: #8c8c8c; letter-spacing: .14em; text-transform: uppercase; }
.jersey-datos .val { font-family: 'Oswald', sans-serif; color: var(--blanco); font-size: 17px; text-transform: uppercase; word-break: break-word; }
.jersey-datos .val.naranja { color: var(--naranja); }
.jersey-datos div + div { margin-top: 10px; }

.campo { margin-top: 22px; }
.campo > label, .campo > .lab { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.campo .ayuda { font-size: 12px; color: var(--gris); font-weight: 400; margin-top: -4px; margin-bottom: 8px; }
/* 16px evita el zoom automático de iOS al enfocar un campo */
input[type=text], input[type=number], textarea, select {
  width: 100%; font-family: inherit; font-size: 16px; border: 1px solid var(--linea);
  border-radius: 10px; padding: 12px 13px; background: var(--blanco); color: var(--negro); min-height: 48px;
}

  const SB = {

    upsert(p, b) { return this.req('POST', p, b, { Prefer: 'resolution=merge-duplicates,return=representation' }); },

  /* ============ estado ============ */

  function normalizarRef(v) {
    let s = (v || '').toString().trim().toUpperCase().replace(/\s+/g, '').replace(/^COT[-_]?/, '');

  }
  function fechaTxt(iso) {
    if (!iso) return '';
    const p = iso.slice(0, 10).split('-');
    const m = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  }
  const leerJSON = (v, vacio) => { if (v && typeof v === 'object') return v; try { return JSON.parse(v || vacio); } catch (e) { return JSON.parse(vacio); } };
  const items = f => { const a = leerJSON(f.items, '[]'); return Array.isArray(a) ? a : []; };

  const pideNumero = (f, id) => basePrenda(id) === 'camiseta' ? llevaNumero(f, id) !== false : numeroOpcional(id) && llevaNumero(f, id) === true;
  const llevaNumero = (f, id) => { const v = ((specsDe(f) || {})[id] || {}).numero; return v === 'si' ? true : v === 'no' ? false : null; };

  const imgsMolde = (f, prenda, calce) => { const v = moldesDe(specsDe(f)[prenda])[calce] || '';

  const disenosMolde = (f, prenda, calce) => Array.from(new Set(imgsMolde(f, prenda, calce).filter(i => !i.arquero).map(disenoImg))).sort((a, b) => a - b);

    return { n: n, img: is.find(i => /frente/i.test(i.vista || '')) || is[0] }; }).filter(x => x.img);
  const fotosDisenosHTML = fs => '<div class="montajes-cli">' + fs.map(x => '<a href="' + esc(x.img.url) + '" target="_blank" rel="noopener">' +
    '<img src="' + esc(x.img.url) + '" alt="Diseño ' + x.n + '" loading="lazy"><div class="cap"><b>Diseño ' + x.n + '</b></div></a>').join('') + '</div>';
  // N° del molde como en el catálogo: 01…99, y los especiales (guardados como 101…) son E01…
  const etqMolde = n => { n = +n; return n > 100 && n < 200 ? 'E' + String(n - 100).padStart(2, '0') : String(n).padStart(2, '0'); };
  const URL_MOLDE = n => CFG.url + '/storage/v1/object/public/montajes/moldes/molde-' + etqMolde(n) + '.jpg';

  /* Guías de talla del molde que corresponde al calce elegido.
     Playmaker las define en la ficha técnica; si no hay, no se muestra nada. */
  /* Detalle de moldes del pedido: todos los calces, para que el cliente
     vea con qué se corta su indumentaria antes de empezar a cargar. */
  function moldesHTML(f) {
    const specs = specsDe(f);
    const filas = [];
    items(f).forEach(it => {
      const mo = moldesDe(specs[it.prenda]);
      ['Femenino', 'Masculino', 'Infantil'].forEach(cal => {
        if (!mo[cal] || /\|manual$/.test(String(mo[cal]))) return;
        const par = String(mo[cal]).split('|'), cod = par[0], num = par[1];
        filas.push('<a href="' + esc(URL_MOLDE(num)) + '" target="_blank" rel="noopener">' +
          '<img src="' + esc(URL_MOLDE(num)) + '" alt="" loading="lazy">' +
          '<span class="t">' + esc(prendaDe(it.prenda).nom) + ' · ' + cal +
          '<br><span class="cod">' + esc(cod) + ' — molde ' + esc(etqMolde(num)) + '</span></span>' +
          '<span class="v">Ver medidas</span></a>');
      });
    });
    if (!filas.length) return '';
    return '<div class="campo"><div class="lab">Moldes y medidas de tu indumentaria</div>' +
      '<div class="ayuda">Toca cualquiera para ver la tabla de medidas de la prenda estirada.</div>' +
      '<div class="guias">' + filas.join('') + '</div></div>';
  }

  function guiasHTML(f, calce) {
    if (!calce) return '';
    const specs = specsDe(f);
    const filas = [];
    items(f).forEach(it => {
      const m = moldesDe(specs[it.prenda])[calce];
      if (!m || /\|manual$/.test(String(m))) return;
      const num = String(m).split('|')[1];
      filas.push('<a href="' + esc(URL_MOLDE(num)) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(URL_MOLDE(num)) + '" alt="" loading="lazy">' +
        '<span class="t">Medidas de ' + esc(minP(it.prenda)) + '</span>' +
        '<span class="v">Ver</span></a>');
    });
    if (!filas.length) return '';
    return '<div class="ayuda">Estas son las medidas reales de la prenda, con el molde que se va a cortar.</div>' +
      filas.join('');
  }
  const tallasDe = d => (d.tallas && typeof d.tallas === 'object') ? d.tallas : JSON.parse(d.tallas || '{}');
  const asignadas = (dets, id) => dets.reduce((n, d) => n + (tallasDe(d)[id] ? 1 : 0), 0);
  const habilitado = (f, id) => { const it = items(f).find(x => x.prenda === id); return it ? it.cant : 0; };
  function prendasEnJuego(f, dets) {
    const ids = items(f).map(i => i.prenda);
    dets.forEach(d => { const t = tallasDe(d); Object.keys(t).forEach(k => { if (t[k] && ids.indexOf(k) < 0) ids.push(k); }); });
    return ids;
  }
  function avanceFicha(f, dets) {
    let vend = 0, asig = 0, extra = 0;
    prendasEnJuego(f, dets).forEach(id => {
      const c = habilitado(f, id), a = asignadas(dets, id);
      vend += c; asig += Math.min(a, c); extra += Math.max(0, a - c);
    });
    return { vend: vend, asig: asig, extra: extra, completo: asig >= vend && vend > 0 };
  }

  /* Avisos automáticos para Playmaker: una fila por ficha+prenda con el excedente vigente */
  async function sincronizarAvisos(f, dets) {
    for (const id of prendasEnJuego(f, dets)) {
      const c = habilitado(f, id), a = asignadas(dets, id), exceso = a - c;
      try {
        if (exceso > 0) await API.guardarAviso({ id: f.ref + ':' + id, ref: f.ref, prenda: id, habilitadas: c,
          agregadas: a, exceso: exceso, visto: false, visto_por: null, visto_at: null, created_at: new Date().toISOString() });
        else await API.borrarAviso(f.ref + ':' + id);
      } catch (e) { /* informativo: nunca bloquea al cliente */ }
    }
  }

  const nomPersona = d => String((d && d.nombre) || '').trim() || (d && d.numero ? 'N° ' + d.numero : 'Sin nombre');
  function chips(nombre, ops, valor, acento) {
    return ops.map(o => {
      const v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
      const cl = (typeof o === 'object' && o.clase ? o.clase : '') + (acento ? ' acento' : '');
      return '<button type="button" class="chip ' + cl + (valor === v ? ' on' : '') + '" data-chip="' + nombre + '" data-val="' + esc(v) + '">' + esc(t) + '</button>';
    }).join('');

    .some(v => MOLDES_CON[talla].indexOf(String(v || '').split('|')[1]) >= 0));
  const tallasAd = v => TALLAS_AD.filter(t => !MOLDES_CON[t] || t === v || pedidoCon(st.ficha, t));
  const tallaChips = (n, v) => chips(n, TALLAS_INF, v) + '<span class="sep-tallas"></span>' + chips(n, tallasAd(v), v) + chips(n, [{ v: '', t: 'No lleva', clase: 'nolleva' }], v);

        : '<div class="aviso">Para entrar, abre el link que te enviamos por WhatsApp. Si no lo tienes, pídeselo a tu vendedor.</div>') +
      (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') + pie + '</div>';
  }

  function pantRef() {
    if (!CFG.permitirRef) { st.pant = 'inicio'; return pantInicio(); }
    app.innerHTML = barra('Ingreso', 'inicio') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Escribe tu<br>referencia</h1>' +
      '<p class="bajada">Es el número COT de tu cotización. Viene en el mensaje que te enviamos.</p>' +
      '<div class="campo"><input id="ref-input" type="text" maxlength="12" placeholder="COT-1234" autocomplete="off" autocapitalize="characters" enterkeyhint="go"></div>' +
      (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
      '<button class="btn" id="btn-entrar">Abrir mi pedido</button>' + pie + '</div>';
    const inp = document.getElementById('ref-input');
    inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
    document.getElementById('btn-entrar').addEventListener('click', entrar);
    async function entrar() {

      b.disabled = true; b.textContent = 'Buscando…';
      try {
        const f = await API.ficha(ref);

        st.error = ''; st.ficha = f; st.pant = 'confirmar'; render();
      } catch (e) { st.error = 'No pudimos conectar. Revisa tu internet y vuelve a intentar.'; render(); }
    }
  }

  function pantConfirmar() {
    const f = st.ficha, tot = items(f).reduce((n, i) => n + i.cant, 0);
    let h = barra('Confirma tu pedido', 'ref') + '<div class="pmk-wrap">' +
      '<h1 class="tit">¿Es este<br>tu pedido?</h1>' +
      '<p class="bajada">Revisa que coincida con lo que compraste antes de cargar las tallas.</p>' +

      '<button class="btn plano" data-ir="ref">No es este</button>' +
      '<div class="mini" style="margin-top:12px">Si necesitas más unidades o una prenda que no aparece, entra igual: puedes agregarlas adentro.</div>' + pie + '</div>';
    app.innerHTML = h;
  }

  async function pantPedido() {
    const f = st.ficha;
    app.innerHTML = barra(f.cliente, 'inicio') + '<div class="pmk-wrap"><div class="cargando">Cargando tu pedido…</div></div>';
    let dets;

      '<h1 class="tit">Detalle del pedido</h1>' +
      '<p class="bajada">Carga a cada persona con su nombre, número y talla. Esto es lo que entra a producción.</p>' + cabFicha(f);

    if (f.entrega_cliente) {
      h += '<div class="aviso ok">Fecha de entrega comprometida: ' + esc(fechaTxt(f.entrega_cliente)) + '.</div>';

      (rev.nota ? ': ' + esc(String(rev.nota).replace(/[.\s]+$/, '')) : '') + '. Revísala y, si está todo bien, vuelve a enviarla con «Revisar y enviar a producción».</div>';

    const montajes = imgsDe(f);
    if (montajes.length) {
      h += '<div class="campo"><div class="lab">Así va tu diseño</div>' +
        '<div class="ayuda">Toca una imagen para verla completa.</div><div class="montajes-cli">' +
        montajes.map(i => '<a href="' + esc(i.url) + '" target="_blank" rel="noopener">' +
          '<img src="' + esc(i.url) + '" alt="' + esc(i.nombre) + '" loading="lazy">' +
          '<div class="cap">' + esc((i.vista ? ((Array.isArray(i.prendas) && i.prendas.length ? i.prendas : [i.prenda || '']).map(id => prendaDe(id).nom).join(' + ') + ' · ' + i.vista) : i.nombre) +
            (montajes.some(x => disenoImg(x) > 1) ? ' · Diseño ' + disenoImg(i) : '') + (i.arquero ? ' · arquero/líbero' : '')) + '</div></a>').join('') + '</div>' +
        '<div class="ayuda" style="margin-top:10px">Si quieres algún cambio en el diseño, escríbele a tu vendedor.</div></div>';
    }

    h += moldesHTML(f);
    if (confirmado) h += '<div class="aviso ok">' + (f.entrega_cliente
        ? 'Tallas confirmadas: tu pedido está en producción.'
        : 'Tallas confirmadas. Tu pedido entra a producción cuando Playmaker defina la fecha de entrega.') +
      ' Para corregir algo, escríbele a tu vendedor.</div>';
    if (av.extra > 0) h += '<div class="aviso">Agregaste ' + av.extra + (av.extra === 1 ? ' unidad' : ' unidades') +
      ' por sobre lo vendido. Playmaker ya está avisado y te confirma el valor antes de producir.</div>';

    h += pasosHTML(f, dets, !confirmado);
    if (confirmado) h += '<button class="btn" id="btn-pdf">Descargar mi copia (PDF)</button>';

    if (dets.length) {
      h += '<div class="campo"><div class="lab">Personas cargadas (' + dets.length + ')</div>';
      dets.forEach(d => {
        const t = tallasDe(d);
        const txt = Object.keys(t).filter(k => t[k]).map(k => prendaDe(k).nom + ' ' + t[k] +
          (disenosMolde(f, k, d.calce).length > 1 ? (+disenosDe(d)[k] ? ' (diseño ' + disenosDe(d)[k] + ')' : ' (falta el diseño)') : '')).join(' · ');
        h += '<button class="lista-item" data-editar="' + esc(d.id) + '"' + (confirmado ? ' disabled' : '') + '>' +
          '<div class="izq"><div class="club">' + (String(d.nombre || '').trim() ? esc(d.nombre) : '<span style="color:var(--gris)">Sin nombre</span>') + '</div><div class="meta">' + esc(txt || 'Sin prendas') + '</div></div>' +
          '<div class="cod2">' + (d.numero ? '#' + esc(d.numero) : (confirmado ? '' : 'Editar')) + '</div></button>';
      });
      h += '</div>';
    } else {
      h += '<div class="vacio"><div class="t">Sin detalle todavía</div><div class="d">Empieza por la primera persona.</div></div>';
    }

    if (!confirmado) {
      h += '<button class="btn plano" id="btn-agregar">Agregar una persona suelta</button>';

      // detalle de lo que falta, prenda por prenda
      const faltantes = [];
      items(f).forEach(it => {
        const falta = it.cant - Math.min(asignadas(dets, it.prenda), it.cant);
        if (falta > 0) faltantes.push(falta + ' ' + minP(it.prenda) + (falta > 1 && !nomDiseno(it.prenda) ? 's' : ''));
      });

      if (av.asig > 0) {
        if (av.completo) {
          h += '<button class="btn verde" id="btn-revisar">Revisar y enviar a producción</button>';
        } else {
          h += '<button class="btn oscuro" disabled>Revisar y enviar a producción</button>' +
            '<div class="aviso">Falta completar ' + esc(faltantes.join(' y ')) +
            ' antes de confirmar el pedido. Si compraste más unidades de las que vas a usar, avísale a tu vendedor para que ajuste el pedido.</div>';
        }
      }
    }
    app.innerHTML = h + pie + '</div>';

    const bAdd = document.getElementById('btn-agregar');
    if (bAdd) bAdd.addEventListener('click', () => {
      st.form = { nombre: '', estampado: '', numero: '', calce: '', manga: 'Corta', arquero: false, obs: '', tallas: {}, disenos: {} };
      st.editando = null; st.verOtras = false; st.pant = 'form'; render();
    });
    if (!confirmado) app.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => {
      const d = dets.find(x => String(x.id) === b.dataset.editar);
      st.form = { nombre: d.nombre, estampado: d.estampado || '', numero: d.numero || '', calce: d.calce || '',
        manga: d.manga || 'Corta', arquero: !!d.arquero, obs: d.obs || '', tallas: Object.assign({}, tallasDe(d)), disenos: Object.assign({}, disenosDe(d)) };
      st.editando = d.id; st.verOtras = false; st.pant = 'form'; render();
    }));
    const brv = document.getElementById('btn-revisar');
    if (brv) brv.addEventListener('click', () => { st.rev = { tallas: false, diseno: false }; st.error = ''; st.pant = 'revision'; render(); });
    app.querySelectorAll('[data-paso]').forEach(b => b.addEventListener('click', () => {
      const g = gruposFicha(f, dets)[+b.dataset.paso];
      st.lote = { grupo: g, texto: '', calce: g.calce || g.calceDef || '', manga: 'Corta', filas: null, numero: numeroOpcional(g.prenda) ? llevaNumero(f, g.prenda) : null };
      st.error = ''; st.pant = 'lote'; render();
    }));
    enlazarPDF(f, dets);
    if (st.unisex === undefined) {   // catálogo de moldes: para avisar cuando un molde es unisex
      st.unisex = null;
      SB.get('moldes?select=numero,calce,descripcion').then(r => {
        st.unisex = (r || []).filter(m => m.calce === 'Unisex').map(m => String(m.numero));
        st.sinMangas = (r || []).filter(m => /sin mangas/i.test(m.descripcion || '')).map(m => String(m.numero));
        if ((st.unisex.length || st.sinMangas.length) && (st.pant === 'pedido' || st.pant === 'form')) render();
      }).catch(() => {});
    }
  }

  /* ==========================================================
     PASOS GUIADOS — un paso por prenda y calce, según los moldes
     que Playmaker definió en la ficha (ej: camiseta masculina,
     camiseta femenina, short masculino, short femenino)
     ========================================================== */
  const ORDEN_CALCE = ['Masculino', 'Femenino', 'Infantil'];
  const numMolde = v => String(v || '').split('|')[1] || '';
  const esUnisex = v => !!(st.unisex && st.unisex.indexOf(numMolde(v)) >= 0);
  // Moldes sin mangas (vóley, hockey, E02…): esa camiseta es sin mangas por el molde y no se pregunta el largo de manga
  const SIN_MANGAS_BASE = ['55', '56', '57', '64', '65', '102'];
  const moldeSinMangas = v => !!v && (st.sinMangas || SIN_MANGAS_BASE).indexOf(numMolde(v)) >= 0;
  const camisetaSinMangas = (f, id, calce) => {
    const mo = moldesDe(specsDe(f)[id]), vs = (calce ? [mo[calce]] : Object.values(mo)).filter(Boolean);
    return vs.length > 0 && vs.every(moldeSinMangas);
  };
  // largo de manga que se guarda para la persona: el de su camiseta con mangas; si solo lleva camisetas sin mangas, «Sin mangas»
  const mangaPersona = (f, tallas, calce, elegida) => {
    const cams = Object.keys(tallas || {}).filter(k => tallas[k] && basePrenda(k) === 'camiseta');
    if (!cams.length) return '';
    return cams.some(k => !camisetaSinMangas(f, k, calce)) ? (elegida || 'Corta') : 'Sin mangas';
  };
  function gruposFicha(f, dets) {
    const specs = specsDe(f), out = [];
    items(f).forEach(it => {
      const sp = specs[it.prenda] || {}, mo = moldesDe(sp), un = (sp.unidades && typeof sp.unidades === 'object') ? sp.unidades : {};
      const cals = Object.keys(mo).filter(c => mo[c]).sort((a, b) => ORDEN_CALCE.indexOf(a) - ORDEN_CALCE.indexOf(b));
      if (!cals.length) { out.push({ prenda: it.prenda, calce: '', cant: it.cant, molde: '' }); return; }
      // un mismo molde unisex para hombres y mujeres = un solo paso
      const uni = cals.filter(c => esUnisex(mo[c]) && c !== 'Infantil');
      if (uni.length > 1 && uni.every(c => numMolde(mo[c]) === numMolde(mo[uni[0]]))) {
        const suma = uni.every(c => typeof un[c] === 'number') ? uni.reduce((n, c) => n + un[c], 0) : null;
        out.push({ prenda: it.prenda, calce: '', calceDef: uni[0], unisex: true, cant: suma, molde: String(mo[uni[0]]).split('|')[0] });
        cals.filter(c => uni.indexOf(c) < 0).forEach(c => out.push({ prenda: it.prenda, calce: c, cant: typeof un[c] === 'number' ? un[c] : null, molde: String(mo[c]).split('|')[0] }));
        return;
      }
      cals.forEach(c => out.push({ prenda: it.prenda, calce: c, unisex: esUnisex(mo[c]), molde: String(mo[c]).split('|')[0],
        cant: typeof un[c] === 'number' ? un[c] : (cals.length === 1 ? it.cant : null) }));
    });
    out.forEach(g => {
      g.disenos = disenosMolde(f, g.prenda, g.calce || g.calceDef || '');
      g.n = personasGrupo(g, dets).length;
      g.extra = g.cant != null ? Math.max(0, g.n - g.cant) : 0;
      g.listo = g.cant != null ? g.n >= g.cant && g.cant > 0 : (g.n > 0 && asignadas(dets, g.prenda) >= habilitado(f, g.prenda));
    });
    return out;
  }
  const nombreGrupo = g => prendaDe(g.prenda).nom + (g.unisex ? ' · Unisex' : (g.calce ? ' · ' + g.calce : ''));
  const ordenNum = d => { const n = parseInt(d.numero, 10); return isNaN(n) ? 9999 : n; };
  const personasGrupo = (g, dets) => dets.filter(d => tallasDe(d)[g.prenda] && (!g.calce || d.calce === g.calce))
    .sort((a, b) => ordenNum(a) - ordenNum(b) || String(a.nombre).localeCompare(String(b.nombre)));
  // pasos + prendas cargadas fuera de ellos (otro calce o prenda que no venía en la compra)
  function gruposRevision(f, dets) {
    const gs = gruposFicha(f, dets), extra = {};
    dets.forEach(d => { const t = tallasDe(d); Object.keys(t).forEach(pr => {
      if (!t[pr] || gs.some(g => g.prenda === pr && (!g.calce || g.calce === d.calce))) return;
      const k = pr + '|' + (d.calce || ''); extra[k] = extra[k] || { prenda: pr, calce: d.calce || '', cant: null, molde: '', fuera: true };
    }); });
    return gs.concat(Object.values(extra).map(g => Object.assign(g, { n: personasGrupo(g, dets).length })));
  }
  const ORDEN_TALLA = TALLAS_INF.concat(TALLAS_AD, ['Infantil', 'Juvenil', 'Adulto', 'Sí']);
  function resumenTallas(pers, prenda) {
    const c = {}; pers.forEach(d => { const t = tallasDe(d)[prenda]; c[t] = (c[t] || 0) + 1; });
    return Object.keys(c).sort((a, b) => ORDEN_TALLA.indexOf(a) - ORDEN_TALLA.indexOf(b)).map(t => t + ': ' + c[t]).join(' · ');
  }
  function pasosHTML(f, dets, activo) {
    const gs = gruposFicha(f, dets); let sig = -1;
    gs.forEach((g, i) => { if (sig < 0 && !g.listo) sig = i; });
    const hechos = gs.filter(g => g.listo).length;
    return '<div class="campo"><div class="lab">Carga de tallas · ' + hechos + ' de ' + gs.length + ' pasos listos</div>' +
      (activo ? '<div class="ayuda">Ve paso por paso: cada uno es una prenda con su molde. En cada paso pegas la lista de esas personas con su número y talla. ' +
        'Si el número ya está cargado (por ejemplo en la camiseta), el short se le suma a esa misma persona.</div>' : '') +
      gs.map((g, i) => '<div class="paso' + (g.listo ? ' listo' : (activo && i === sig ? ' sig' : '')) + '">' +
        '<div class="ico">' + (g.listo ? '✓' : (i + 1)) + '</div>' +
        '<div class="txt"><div class="n">' + esc(nombreGrupo(g)) + '</div><div class="d">' + g.n + (g.cant != null ? ' de ' + g.cant : '') + ' cargadas' +
          (g.molde ? ' · molde ' + esc(g.molde) : '') + (g.disenos && g.disenos.length > 1 ? ' · ' + g.disenos.length + ' diseños' : '') + (g.extra > 0 ? ' · ' + g.extra + ' de más' : '') + (g.listo ? ' · listo' : (activo && i === sig ? ' · sigue este' : '')) + '</div></div>' +
        (activo ? '<button type="button" class="btn-paso" data-paso="' + i + '">' + (g.listo ? 'Agregar' : (g.n ? 'Seguir' : 'Cargar')) + '</button>' : '') + '</div>').join('') + '</div>';
  }

  /* ==========================================================
     REVISIÓN FINAL Y ENVÍO A PRODUCCIÓN
     ========================================================== */
  function tablasRevisionHTML(f, dets) {
    return gruposRevision(f, dets).map(g => {
      const pers = personasGrupo(g, dets), manga = !!prendaDe(g.prenda).manga, dis = disenosMolde(f, g.prenda, g.calce || g.calceDef || '').length > 1;
      const cuenta = {}; pers.forEach(d => { const k = d.calce + '|' + normNum(d.numero); if (normNum(d.numero)) cuenta[k] = (cuenta[k] || 0) + 1; });
      return '<div class="rev-g"><div class="t">' + esc(nombreGrupo(g)) + ' · ' + pers.length + (g.cant != null ? ' de ' + g.cant : '') + (g.fuera ? ' (adicional)' : '') + '</div>' +
        '<div class="r">' + esc(resumenTallas(pers, g.prenda)) + '</div>' +
        '<table class="rev"><tr><th>N°</th><th>Nombre</th><th>Talla</th>' + (manga ? '<th>Manga</th>' : '') + (dis ? '<th>Diseño</th>' : '') + '</tr>' +
        pers.map(d => '<tr><td><b>' + esc(d.numero || '—') + '</b>' + (cuenta[d.calce + '|' + normNum(d.numero)] > 1 ? ' <span title="Número repetido">⚠</span>' : '') + '</td><td>' + (String(d.nombre || '').trim() ? esc(d.nombre) : '<span class="mini">sin nombre</span>') + (d.arquero ? ' <span class="mini">(arquero)</span>' : '') + '</td><td>' +
          esc(tallasDe(d)[g.prenda]) + '</td>' + (manga ? '<td>' + esc(d.manga || '') + '</td>' : '') +
          (dis ? '<td>' + (+disenosDe(d)[g.prenda] ? 'Diseño ' + esc(disenosDe(d)[g.prenda]) : '<b style="color:var(--naranja)">Falta</b>') + '</td>' : '') + '</tr>').join('') + '</table></div>';
    }).join('');
  }
  async function pantRevision() {
    const f = st.ficha;
    if (f.estado === 'confirmado') { st.pant = 'pedido'; return render(); }
    app.innerHTML = barra(f.cliente, 'pedido') + '<div class="pmk-wrap"><div class="cargando">Preparando la revisión…</div></div>';
    let dets;
    try { dets = await API.detalles(f.ref); } catch (e) { app.innerHTML = barra(f.cliente, 'pedido') + '<div class="pmk-wrap">' + errorConexion(e) + pie + '</div>'; return; }
    st.dets = dets;
    if (!avanceFicha(f, dets).completo) { st.pant = 'pedido'; return render(); }
    const rv = st.rev || (st.rev = { tallas: false });
    const montajes = imgsDe(f);   // el diseño se muestra solo como referencia: no se aprueba aquí
    const reps = repetidosDe(dets, d => d.calce);
    let h = barra(f.cliente, 'pedido') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Revisa y envía<br>a producción</h1>' +
      '<p class="bajada">Es el último paso. Revisa con calma: después de enviar, cualquier cambio se pide a tu vendedor.</p>' + cabFicha(f) +
      '<div class="campo"><div class="lab">1 · Nombres, números y tallas</div>' + tablasRevisionHTML(f, dets) +
      '<button class="btn plano" data-ir="pedido" style="margin-top:12px">Corregir algo</button></div>';
    if (montajes.length) h += '<div class="campo"><div class="lab">2 · Tu diseño</div><div class="montajes-cli">' + montajes.map(i => '<a href="' + esc(i.url) + '" target="_blank" rel="noopener">' +
      '<img src="' + esc(i.url) + '" alt="" loading="lazy"><div class="cap">' + esc((i.vista || i.nombre || '') + (i.arquero ? ' · arquero/líbero' : '')) + '</div></a>').join('') + '</div>' +
      '<div class="ayuda" style="margin-top:10px">Si quieres algún cambio en el diseño, escríbele a tu vendedor.</div></div>';
    h += '<div class="campo"><div class="lab">' + (montajes.length ? '3' : '2') + ' · Confirmación</div>' +
      '<label class="check' + (rv.tallas ? ' on' : '') + '" data-rev="tallas"><input type="checkbox"' + (rv.tallas ? ' checked' : '') + '>' +
      '<span>Revisé el detalle completo: los nombres, números y tallas son correctos.</span></label>' +
      (reps.length ? avisoRepetidos(reps, 'No impide enviar: si están bien, confírmalo.') +
        '<label class="check' + (rv.repetidos ? ' on' : '') + '" data-rev="repetidos"><input type="checkbox"' + (rv.repetidos ? ' checked' : '') + '>' +
        '<span>Los números o nombres repetidos están bien así.</span></label>' : '') + '</div>';
    if (st.error) h += '<div class="aviso error">' + esc(st.error) + '</div>';
    h += '<button class="btn verde" id="btn-enviar">Enviar a producción</button>';
    app.innerHTML = h + pie + '</div>';
    app.querySelectorAll('[data-rev]').forEach(l => l.addEventListener('change', e => { rv[l.dataset.rev] = e.target.checked; l.classList.toggle('on', e.target.checked); }));
    document.getElementById('btn-enviar').addEventListener('click', async () => {
      if (!rv.tallas) { st.error = 'Marca la confirmación de que revisaste nombres, números y tallas.'; return render(); }
      if (reps.length && !rv.repetidos) { st.error = 'Hay números o nombres repetidos: confirma que están bien, o corrígelos con "Corregir algo".'; return render(); }
      const b = document.getElementById('btn-enviar'); b.disabled = true; b.textContent = 'Enviando…';
      try {

  const latin1 = s => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b; };

    const W = 595.28, H = 841.89, M = 42, paginas = [], fotos = [];

    const limpio = s => String(s == null ? '' : s)
      .replace(/[\u2014\u2013]/g, '-').replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\u2026/g, '...')
      .replace(/[^\x20-\xFF]/g, '?').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');

    d.lugar = h => { if (d.y - h < M) { d.nueva(); return true; } return false; };
    d.texto = (x, y, s, size, bold, color) => ops.push((color || '0 0 0') + ' rg BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + n1(x) + ' ' + n1(y) + ' Td (' + limpio(s) + ') Tj ET');

    d.caja = (x, y, w, h, color) => ops.push(color + ' rg ' + [x, y, w, h].map(n1).join(' ') + ' re f');
    d.foto = (ft, x, y, w, h) => { fotos.push(ft); ops.push('q ' + n1(w) + ' 0 0 ' + n1(h) + ' ' + n1(x) + ' ' + n1(y) + ' cm /Im' + fotos.length + ' Do Q'); };

      const partes = [], offs = []; let largo = 0;

      const obj = (n, cuerpo) => { offs[n] = largo; add(n + ' 0 obj\n'); cuerpo(); add('\nendobj\n'); };

      obj(3, () => add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'));
      obj(4, () => add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'));
      fotos.forEach((ft, i) => obj(5 + i, () => {
        add('<< /Type /XObject /Subtype /Image /Width ' + ft.w + ' /Height ' + ft.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + ft.bytes.length + ' >>\nstream\n');
        add(ft.bytes); add('\nendstream');

      const xo = fotos.map((_, i) => '/Im' + (i + 1) + ' ' + (5 + i) + ' 0 R').join(' ');
      paginas.forEach((o, i) => {
        const cont = latin1(o.join('\n'));

          (xo ? ' /XObject << ' + xo + ' >>' : '') + ' >> /Contents ' + (base + i * 2 + 1) + ' 0 R >>'));
        obj(base + i * 2 + 1, () => { add('<< /Length ' + cont.length + ' >>\nstream\n'); add(cont); add('\nendstream'); });

  // foto del montaje → JPEG chico para el PDF (si el navegador no la deja leer, se omite)
  function fotoJPEG(url) {

        const k = Math.min(1, 900 / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));

        fin({ w: w, h: h, bytes: latin1(atob(c.toDataURL('image/jpeg', 0.82).split(',')[1])) });

    const cab = () => { d.caja(M, d.y - 5, W - 2 * M, 17, '0.93 0.93 0.93'); let x = M + 4; cols.forEach(c => { d.texto(x, d.y, c[0], 9, true); x += c[1]; }); d.y -= 18; };

      if (Object.keys(fo.tallas).some(k => fo.tallas[k] && basePrenda(k) === 'camiseta' && pideNumero(f, k)) && !fo.numero) { st.error = 'La camiseta necesita un número.'; return render(); }
      const sinDis = Object.keys(fo.tallas).filter(k => fo.tallas[k] && disenosMolde(f, k, fo.calce).length > 1 && disenosMolde(f, k, fo.calce).indexOf(+fo.disenos[k]) < 0);
      if (sinDis.length) { st.error = 'Elige el diseño de ' + sinDis.map(k => minP(k)).join(' y ') + '.'; return render(); }
      const conNum = Object.keys(fo.tallas).filter(k => fo.tallas[k] && numeroOpcional(k) && llevaNumero(f, k) === true);
      if (conNum.length && !String(fo.numero || '').trim()) { st.error = 'En este pedido, ' + conNum.map(k => minP(k)).join(' y ') + ' lleva número: escríbelo.'; return render(); }
      const b = document.getElementById('btn-guardar');
      b.disabled = true; b.textContent = 'Guardando…';
      try {
        await API.guardarDetalle({
          id: yo || (Date.now() * 1000 + Math.floor(Math.random() * 1000)).toString(),
          ref: f.ref, nombre: fo.nombre.trim(), estampado: fo.estampado.trim().toUpperCase(), numero: fo.numero,
          calce: fo.calce, manga: mangaPersona(f, fo.tallas, fo.calce, fo.manga), arquero: !!fo.arquero, obs: fo.obs.trim(), tallas: fo.tallas,
          disenos: Object.keys(fo.tallas).filter(k => fo.tallas[k] && disenosMolde(f, k, fo.calce).length > 1).reduce((o, k) => { o[k] = +fo.disenos[k]; return o; }, {})
        });
        await sincronizarAvisos(f, await API.detalles(f.ref));
        st.error = ''; st.editando = null; st.pant = 'pedido'; render();
      } catch (e) { st.error = 'No se pudo guardar. Revisa la conexión y vuelve a intentar.'; render(); }
    }
  }

  /* ==========================================================
     CARGA MASIVA — pegar la lista que el club ya tiene armada
     ========================================================== */
  const TODAS_TALLAS = TALLAS_INF.concat(TALLAS_AD);

  /* Interpreta una línea suelta: nombre, número y talla en cualquier orden.
     Acepta separación por espacios, comas, punto y coma o tabulaciones
     (esto último es lo que sale al copiar una columna de Excel). */
  // palabras que nunca son un nombre: instrucciones, etiquetas y pronombres
  // palabras sueltas de instrucciones que no son parte de lo que se escribe (los artículos sí quedan: «LA ROCA», «María de la Fuente»)
  const NO_NOMBRE = ['aqui', 'aquí', 'va', 'nombre', 'nombres', 'jugador', 'jugadora',
    'apellido', 'talla', 'tallas', 'numero', 'número', 'n', 'camiseta', 'short', 'medias',
    'ella', 'ellos', 'ellas', 'sr', 'sra', 'don', 'doña'];

  // Lo que se estampa en la espalda (nombre, apellido o frase), cuando las camisetas llevan nombre estampado: el texto
  // de cada línea tal como se escribió («P. Salinas» → P. SALINAS). En la revisión se ve y se puede cambiar.
  const estampadoDe = texto => String(texto || '').trim().replace(/\s+/g, ' ').toUpperCase().slice(0, 20);
  // lo que se estampa en una fila: lo escrito en «Estampa»; si no, lo que ya tenía la persona; si no, el texto de la línea
  const estampadoFila = (x, previo) => (x.estEditado ? String(x.est || '') : (previo ? previo : estampadoDe(x.nombre))).trim().toUpperCase().slice(0, 20);
  const filaEstampa = (x, previo) => '<div class="l3"><label>Estampa</label><input class="est" type="text" maxlength="20" value="' +
    esc(estampadoFila(x, previo)) + '" placeholder="Lo que va en la espalda" autocapitalize="characters" aria-label="Nombre a estampar"></div>';
  function leerLinea(linea) {
    let bruto = linea;
    // "Aquí va el nombre: SOYA" → se queda con lo que viene después de los dos puntos
    if (bruto.indexOf(':') >= 0) {
      const der = bruto.slice(bruto.indexOf(':') + 1).trim();
      if (der) bruto = der;
    }
    const limpia = bruto.replace(/\t/g, ' ').replace(/[;,|]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!limpia) return null;
    let talla = '', numero = '';
    const nombre = [];
    limpia.split(' ').forEach(tok => {
      const up = tok.toUpperCase().replace(/[.\-#]/g, '');
      const tx = { '2XS': 'XXS', '2XL': 'XXL', '3XL': 'XXXL', '4XL': 'XXXXL' }[up] || up;
      if (!talla && TALLAS_AD.indexOf(tx) >= 0) { talla = tx; return; }
      // número de camiseta: dígitos, y combinaciones como 9+1 o 10/11
      if (/^\d{1,3}([+\-\/]\d{1,3})?$/.test(up)) {
        if (!talla && TALLAS_INF.indexOf(up) >= 0 && numero) { talla = up; return; }
        if (!numero) { numero = up; return; }
        if (!talla && TALLAS_INF.indexOf(up) >= 0) { talla = up; return; }
        return;
      }
      // descarta etiquetas e instrucciones sueltas
      const plano = tok.toLowerCase().replace(/[^a-záéíóúñ]/g, '');
      if (plano && NO_NOMBRE.indexOf(plano) >= 0) return;
      nombre.push(tok);
    });
    const nom = nombre.join(' ').trim();
    if (!nom && !numero && !talla) return null;   // «10 M»: persona sin nombre (camisetas solo con número)
    return { nombre: nom, numero: numero, talla: talla };
  }

  function pantLote() {
    const f = st.ficha;
    const lote = st.lote || (st.lote = { texto: '', calce: '', manga: 'Corta', filas: null });
    const g = lote.grupo, pg = g ? prendaDe(g.prenda) : null;
    const yaG = g ? personasGrupo(g, st.dets || []).length : 0;
    app.innerHTML = barra(f.cliente, 'pedido') + '<div class="pmk-wrap">' +
      (g ? '<h1 class="tit">' + esc(pg.nom) + '<br>' + esc(g.unisex ? 'Unisex' : (g.calce || 'Todas las personas')) + '</h1>' +
        '<p class="bajada">Pega la lista de las personas que llevan ' + esc(minP(g.prenda)) + (g.calce && !g.unisex ? ' ' + esc(g.calce.toLowerCase()) : '') +
        ': del grupo de WhatsApp, de una planilla o escrita a mano. Una persona por línea.</p>' +
        '<div class="aviso">' + (g.cant != null ? 'Este paso es de <b>' + g.cant + ' unidades</b>; llevas ' + yaG + '.' : 'Llevas ' + yaG + ' cargadas en este paso.') +
        (g.molde ? ' Molde ' + esc(g.molde) + '.' : '') + ' Si un número ya está cargado en otra prenda, se junta con esa persona.</div>' +
        (g.disenos && g.disenos.length > 1 ? '<div class="campo"><div class="lab">Esta prenda tiene ' + g.disenos.length + ' diseños</div>' +
          '<div class="ayuda">Después de revisar la lista te preguntamos qué diseño lleva cada persona.</div>' + fotosDisenosHTML(fotosDisenos(f, g.prenda, g.calce || g.calceDef || '')) + '</div>'
          : nomDiseno(g.prenda) && imgsMolde(f, g.prenda, g.calce || g.calceDef || '').length ? '<div class="campo"><div class="lab">Así va ' + esc(nomDiseno(g.prenda)) + '</div><div class="montajes-cli">' +
            imgsMolde(f, g.prenda, g.calce || g.calceDef || '').map(i => '<a href="' + esc(i.url) + '" target="_blank" rel="noopener"><img src="' + esc(i.url) + '" alt="" loading="lazy">' +
              '<div class="cap">' + esc((i.vista || '') + (i.arquero ? ' · arquero/líbero' : '')) + '</div></a>').join('') + '</div></div>' : '')
       : '<h1 class="tit">Cargar varias<br>personas</h1>' +
        '<p class="bajada">Pega la lista tal como la tienes: del grupo de WhatsApp, de una planilla o escrita a mano. Una persona por línea.</p>') +
      (g && !pg.estampado ? '' : '<div class="campo"><label>¿Las camisetas llevan nombre estampado?</label>' +
      '<div class="ayuda">Es lo que va en la espalda: un nombre, un apellido o una frase. Si llevan, escríbelo en cada línea junto al número y la talla, tal como se estampa (ej: P. SALINAS 5 M); antes de guardar lo ves y lo puedes cambiar. ' +
      'Si no llevan, basta con el número y la talla (ej: 5 M). El nombre de la persona no es necesario.</div>' +
      '<div class="chips">' + chips('lote_estampar', [{ v: 'si', t: 'Sí, llevan nombre estampado' }, { v: 'no', t: 'No, solo número' }], lote.estampar == null ? '' : (lote.estampar ? 'si' : 'no')) + '</div></div>') +
      (g && numeroOpcional(g.prenda) ? '<div class="campo"><label>' + esc(preguntaNumero(g.prenda)) + '</label>' +
        '<div class="ayuda">' + (basePrenda(g.prenda) === 'camiseta'
          ? 'Es el número estampado en la camiseta. Si llevan, escríbelo en cada línea junto a la talla (ej: 10 M). Si no llevan nombre ni número, basta con la talla en cada línea (ej: M).'
          : 'Es el número estampado en la prenda. Si llevan, escríbelo en cada línea junto a la talla (ej: 10 M). ' +
            'Si no llevan, basta con la talla; si la persona también lleva camiseta, puedes poner su número o su nombre para juntarlos (en esta prenda no se estampa).') + '</div>' +
        '<div class="chips">' + chips('lote_numero', [{ v: 'si', t: 'Sí, llevan número' }, { v: 'no', t: 'No, sin número' }], lote.numero == null ? '' : (lote.numero ? 'si' : 'no')) + '</div></div>' : '') +
      '<div class="campo"><label for="lote-texto">Pega tu lista aquí</label>' +
      '<div class="ayuda">Una persona por línea: lo que se estampa (si lleva), número y talla, en cualquier orden. Todas estas formas funcionan:<br>' +
      'P. SALINAS 10 M<br>7 Rojas L<br>Antonia, 4, XS<br>Sin nombre: 10 M</div>' +
      '<textarea id="lote-texto" placeholder="Camila Rojas 10 M&#10;Diego Salas 7 L&#10;Antonia Pérez 4 XS">' + esc(lote.texto) + '</textarea></div>' +
      (g && (g.calce || g.calceDef) ? '' : '<div class="campo"><label>Calce para todo el grupo</label>' +
      '<div class="ayuda">Después puedes cambiarlo persona por persona si alguien lleva otro calce.</div>' +
      '<div class="chips">' + chips('lote_calce', ['Masculino', 'Femenino', 'Infantil'], lote.calce, true) + '</div></div>') +
      (g && (!pg.manga || camisetaSinMangas(f, g.prenda, g.calce || g.calceDef || lote.calce)) ? '' : '<div class="campo"><label>Largo de manga para todo el grupo</label>' +
      '<div class="chips">' + chips('lote_manga', ['Corta', 'Sin mangas', 'Larga'], lote.manga) + '</div></div>') +
      (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
      '<div class="barra-fija"><button class="btn" id="btn-leer">Revisar la lista</button></div>' + pie + '</div>';

    const ta = document.getElementById('lote-texto');
    ta.addEventListener('input', e => { lote.texto = e.target.value; });
    app.querySelectorAll('[data-chip]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.chip === 'lote_calce') lote.calce = b.dataset.val;
      else if (b.dataset.chip === 'lote_estampar') lote.estampar = b.dataset.val === 'si';
      else if (b.dataset.chip === 'lote_numero') lote.numero = b.dataset.val === 'si';
      else lote.manga = b.dataset.val;
      b.parentElement.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    }));

    document.getElementById('btn-leer').addEventListener('click', () => {
      if (!lote.calce && !(lote.grupo && (lote.grupo.calce || lote.grupo.calceDef))) { st.error = 'Elige el calce del grupo antes de continuar.'; return render(); }
      if (!(g && !pg.estampado) && lote.estampar == null) { st.error = 'Responde si las camisetas llevan nombre estampado.'; return render(); }
      if (g && numeroOpcional(g.prenda) && lote.numero == null) { st.error = 'Responde si ' + losDe(g.prenda) + ' llevan número.'; return render(); }
      const filas = (lote.texto || '').split('\n').map(leerLinea).filter(Boolean);
      if (g && basePrenda(g.prenda) === 'camiseta' && lote.numero === false)
        filas.forEach(x => { if (!x.talla && x.numero && TALLAS_INF.indexOf(x.numero) >= 0) { x.talla = x.numero; x.numero = ''; } });
      if (!filas.length) { st.error = 'No pudimos leer ninguna persona. Revisa que sea una por línea (lo que se estampa, número y talla, o solo número y talla).'; return render(); }
      if (filas.length > 300) { st.error = 'Son ' + filas.length + ' líneas y el máximo por ficha es 300. Divídela en dos cargas.'; return render(); }
      lote.filas = filas; st.error = ''; st.pant = 'lote-revisar'; render();
    });
  }

  /* Cruce: al cargar un paso, la persona se busca entre las ya cargadas del mismo calce,
     primero por número y después por nombre. Si existe, se le suma la prenda. */
  const normNom = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zñ ]/g, ' ').replace(/\s+/g, ' ').trim();
  const normNum = s => String(s || '').toUpperCase().trim();
  // Un número puede repetirse (el cliente lo confirma): si coincide el número pero el nombre es otro, es otra persona.
  function buscarPersona(dets, g, x) {
    const cal = g.calce || '', mismos = dets.filter(d => !cal || d.calce === cal);
    const num = normNum(x.numero), nom = normNom(x.nombre);
    const porNum = num ? mismos.filter(d => normNum(d.numero) === num) : [];
    let d = null, por = 'numero';
    if (porNum.length) d = nom ? porNum.find(d => normNom(d.nombre) === nom) || null : porNum[0];
    if (!d && nom) { d = mismos.find(d => normNom(d.nombre) === nom) || null; por = 'nombre'; }
    if (!d) return null;
    return { d: d, por: por, ya: tallasDe(d)[g.prenda] || '' };
  }
  // otra persona del mismo calce que ya usa ese número
  function numeroDeOtro(dets, g, x) {
    const cal = g.calce || '', num = normNum(x.numero), nom = normNom(x.nombre);
    return num ? dets.find(d => (!cal || d.calce === cal) && normNum(d.numero) === num && (!nom || normNom(d.nombre) !== nom)) || null : null;
  }
  // Números (por calce) y nombres que se repiten en una lista de personas
  function repetidosDe(lista, calceDe) {
    const porNum = {}, porNom = {};
    lista.forEach(x => {
      const num = normNum(x.numero), nom = normNom(x.nombre), cal = calceDe(x) || '';
      if (num) (porNum[cal + '|' + num] = porNum[cal + '|' + num] || []).push(x);
      if (nom) (porNom[nom] = porNom[nom] || []).push(x);
    });
    const out = [];
    Object.keys(porNum).forEach(k => { if (porNum[k].length > 1) { const [cal, num] = k.split('|');
      out.push({ tipo: 'numero', clave: k, txt: 'N° ' + num + (cal ? ' (' + cal.toLowerCase() + ')' : '') + ': ' + porNum[k].map(x => (x.nombre || '').trim() || 'sin nombre').join(', ') }); } });
    Object.keys(porNom).forEach(k => { if (porNom[k].length > 1)
      out.push({ tipo: 'nombre', clave: k, txt: (porNom[k][0].nombre || '').trim() + ' aparece ' + porNom[k].length + ' veces' + (porNom[k].some(x => x.numero) ? ' (N° ' + porNom[k].map(x => x.numero || '—').join(', ') + ')' : '') }); });
    return out;
  }
  const avisoRepetidos = (reps, pie) => '<div class="aviso"><b>Hay números o nombres repetidos:</b><ul style="margin:6px 0 6px 18px">' +
    reps.map(r => '<li>' + esc(r.txt) + '</li>').join('') + '</ul>' + pie + '</div>';
  function textoCruce(dets, g, x) {
    const m = buscarPersona(dets, g, x);
    if (!m) { const o = numeroDeOtro(dets, g, x);
      return o ? { c: 'ojo', t: 'Persona nueva · el N° ' + o.numero + ' también lo tiene ' + nomPersona(o) + ' (número repetido). Si es la misma persona, escribe el nombre igual.' } : { c: '', t: 'Persona nueva' }; }
    const otras = Object.keys(tallasDe(m.d)).filter(k => k !== g.prenda && tallasDe(m.d)[k]).map(k => minP(k) + ' ' + tallasDe(m.d)[k]).join(', ');
    if (m.ya && g.disenos && g.disenos.length > 1) return { c: 'ojo', t: nomPersona(m.d) + ' ya tiene ' + minP(g.prenda) + ' ' + m.ya +
      (+disenosDe(m.d)[g.prenda] ? ' (diseño ' + disenosDe(m.d)[g.prenda] + ')' : '') + '. Si esta fila es de otro diseño, se agrega aparte; si es del mismo, se reemplaza la talla.' };
    if (m.ya) return { c: 'ojo', t: nomPersona(m.d) + ' ya tenía ' + minP(g.prenda) + ' ' + m.ya + ': se reemplaza por la talla de esta fila.' };
    return { c: 'suma', t: 'Se suma a ' + nomPersona(m.d) + (m.d.numero && String(m.d.nombre || '').trim() ? ' #' + m.d.numero : '') + (otras ? ' (ya tiene ' + otras + ')' : '') };
  }
  function pantLoteRevisar() {
    if (st.lote && st.lote.grupo) return pantLoteRevisarGrupo();
    const f = st.ficha, lote = st.lote, filas = lote.filas;
    const conTalla = items(f).map(i => i.prenda).filter(id => !prendaDe(id).sinTalla && !prendaDe(id).escala);
    const sinTalla = items(f).map(i => i.prenda).filter(id => prendaDe(id).sinTalla || prendaDe(id).escala);
    const faltan = filas.filter(x => !x.talla).length;

    let h = barra(f.cliente, 'lote') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Revisa antes<br>de guardar</h1>' +
      '<p class="bajada">La talla que dejes en cada fila se aplica a ' +
      esc(conTalla.map(id => minP(id)).join(', ') || 'las prendas del pedido') +
      (sinTalla.length ? ', y se marca ' + esc(sinTalla.map(id => minP(id)).join(', ')) : '') + '.</p>' +
      '<div class="contador" id="contador">' + filas.length + ' personas' +
      (faltan ? ' <span>· ' + faltan + ' sin talla</span>' : '') + '</div>';

    filas.forEach((x, i) => {
      h += '<div class="fila-lote' + (x.talla ? '' : ' falta') + '" data-fila="' + i + '">' +
        '<div class="l1"><span class="idx">' + (i + 1) + '</span>' +
        '<input class="nom" type="text" value="' + esc(x.nombre) + '" placeholder="Nombre de la persona (opcional)">' +
        '<button type="button" class="x" data-quitar="' + i + '" aria-label="Quitar">×</button></div>' +
        '<div class="l2"><input class="num" type="text" maxlength="6" value="' + esc(x.numero) + '" placeholder="N°">' +
        '<select class="tal"><option value="">Sin talla</option>' +
        TALLAS_INF.concat(tallasAd(x.talla)).map(t => '<option value="' + t + '"' + (x.talla === t ? ' selected' : '') + '>' + t + '</option>').join('') +
        '</select></div>' + (lote.estampar ? filaEstampa(x) : '') + '</div>';
    });

    if (st.error) h += '<div class="aviso error">' + esc(st.error) + '</div>';
    h += '<div class="barra-fija"><button class="btn" id="btn-guardar-lote">Guardar ' + filas.length + ' personas</button></div>';
    app.innerHTML = h + pie + '</div>';

    const refrescarContador = () => {
      const f2 = filas.filter(x => !x.talla).length;
      document.getElementById('contador').innerHTML = filas.length + ' personas' + (f2 ? ' <span>· ' + f2 + ' sin talla</span>' : '');
    };
    app.querySelectorAll('[data-fila]').forEach(div => {
      const i = +div.dataset.fila;
      const est = div.querySelector('.est');
      div.querySelector('.nom').addEventListener('input', e => { filas[i].nombre = e.target.value; if (est && !filas[i].estEditado) est.value = estampadoFila(filas[i]); });
      if (est) est.addEventListener('input', e => { filas[i].est = e.target.value; filas[i].estEditado = true; });
      div.querySelector('.num').addEventListener('input', e => {
        e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z+\-\/]/g, '').slice(0, 6);
        filas[i].numero = e.target.value;
      });
      div.querySelector('.tal').addEventListener('change', e => {
        filas[i].talla = e.target.value;
        div.classList.toggle('falta', !e.target.value);
        refrescarContador();
      });
    });
    app.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', () => {
      filas.splice(+b.dataset.quitar, 1);
      if (!filas.length) { st.pant = 'lote'; }
      render();
    }));

    document.getElementById('btn-guardar-lote').addEventListener('click', async () => {
      const validas = filas.filter(x => String(x.nombre || '').trim() || String(x.numero || '').trim() || x.talla);
      if (!validas.length) { st.error = 'La lista quedó vacía.'; return render(); }
      const sinEst = lote.estampar ? validas.filter(x => !estampadoFila(x)).length : 0;
      if (sinEst) { st.error = (sinEst === 1 ? 'Falta 1 nombre' : 'Faltan ' + sinEst + ' nombres') + ' a estampar: dijiste que las camisetas llevan nombre estampado. Escríbelos en «Estampa» o, si no llevan, vuelve atrás y elige «No, solo número».'; return render(); }
      const sin = validas.filter(x => !x.talla).length;
      if (sin) { st.error = 'Quedan ' + sin + ' personas sin talla. Complétalas o quítalas de la lista.'; return render(); }

      const b = document.getElementById('btn-guardar-lote');
      b.disabled = true; b.textContent = 'Guardando…';
      const base = Date.now().toString(36);
      const regs = validas.map((x, i) => {
        const tallas = {};
        conTalla.forEach(id => { tallas[id] = x.talla; });
        sinTalla.forEach(id => {
          const p2 = prendaDe(id);
          tallas[id] = p2.escala ? (lote.calce === 'Infantil' ? 'Infantil' : 'Adulto') : 'Sí';
        });
        return {
          id: base + '-' + i + '-' + Math.floor(Math.random() * 1000),
          ref: f.ref, nombre: x.nombre.trim(),
          estampado: lote.estampar ? estampadoFila(x) : '',
          numero: x.numero || '', calce: lote.calce, manga: mangaPersona(f, tallas, lote.calce, lote.manga),
          arquero: false, obs: '', tallas: tallas
        };
      });
      try {
        // un solo envío a la base, no uno por persona
        await API.guardarDetalle(regs);
        await sincronizarAvisos(f, await API.detalles(f.ref));
        st.lote = null; st.error = ''; st.pant = 'pedido'; render();
      } catch (e) {
        st.error = 'No se pudo guardar la lista. ' + (e.message || '').slice(0, 400);
        b.disabled = false; render();
      }
    });
  }

  function pantLoteRevisarGrupo() {
    const f = st.ficha, lote = st.lote, filas = lote.filas, g = lote.grupo, pg = prendaDe(g.prenda), dets = st.dets || [];
    lote.disListo = false;   // si se vuelve a la lista, se vuelve a preguntar el diseño (con lo ya elegido)
    const opciones = pg.escala ? pg.escala : (pg.sinTalla ? ['Sí'] : TALLAS_INF.concat(tallasAd()));
    const calce = g.calce || g.calceDef || lote.calce;
    filas.forEach(x => { if (pg.escala && opciones.indexOf(x.talla) < 0) x.talla = calce === 'Infantil' ? 'Infantil' : 'Adulto'; });
    const ya = personasGrupo(g, dets).length;
    const nuevasEnGrupo = () => filas.filter(x => { const m = buscarPersona(dets, g, x); return !m || !m.ya; }).length;
    const faltan = filas.filter(x => !x.talla).length;
    // si las camisetas llevan nombre, cada fila necesita el suyo; si no, basta con el número y la talla
    // una persona que ya estaba cargada conserva su nombre estampado (salvo que se cambie aquí)
    const previoDe = x => { const m = buscarPersona(dets, g, x); return m ? (m.d.estampado || '') : null; };
    // si las camisetas llevan nombre estampado, cada fila necesita lo que se estampa; el nombre de la persona nunca es obligatorio
    const pideEstampa = !!(lote.estampar && pg.estampado), sinEstampa = x => pideEstampa && !estampadoFila(x, previoDe(x));
    const textoContador = () => { const f2 = filas.filter(x => !x.talla).length, n2 = filas.filter(sinEstampa).length, n3 = filas.filter(sinNumero).length;
      return filas.length + ' personas' + (f2 ? ' <span>· ' + f2 + ' sin talla</span>' : '') + (n2 ? ' <span>· ' + n2 + ' sin nombre a estampar</span>' : '') +
        (n3 ? ' <span>· ' + n3 + ' sin número</span>' : ''); };
    const pideNumero = numeroOpcional(g.prenda) && lote.numero === true;
    const sinNumero = x => { if (!pideNumero || String(x.numero || '').trim()) return false; const m = buscarPersona(dets, g, x); return !(m && String(m.d.numero || '').trim()); };
    const falta = x => !x.talla || sinEstampa(x) || sinNumero(x);

    let h = barra(f.cliente, 'lote') + '<div class="pmk-wrap">' +
      '<h1 class="tit">Revisa antes<br>de guardar</h1>' +
      '<p class="bajada">' + esc(nombreGrupo(g)) + ': cada fila es una persona con su talla. Revisa el número: con él se junta la camiseta y el short de la misma persona.' +
        (pideEstampa ? ' En «Estampa» va lo que se estampa en la espalda: revísalo.' : pg.estampado ? ' Las camisetas no llevan nombre estampado: basta con el número y la talla.' : '') +
        (numeroOpcional(g.prenda) ? (lote.numero ? ' Esta prenda lleva número estampado: cada fila necesita el suyo.'
          : basePrenda(g.prenda) === 'camiseta' ? ' Las camisetas no llevan número: basta con la talla (el nombre de la persona es opcional).'
          : ' Esta prenda no lleva número: el número solo sirve para juntarla con la camiseta de la misma persona.') : '') + '</p>' +
      '<div class="contador" id="contador">' + textoContador() + '</div>';
    if (g.cant != null && ya + nuevasEnGrupo() > g.cant) h += '<div class="aviso">Con esta lista quedarían ' + (ya + nuevasEnGrupo()) + ' en este paso y el pedido tiene ' + g.cant +
      '. Las unidades de más se avisan a Playmaker, que te confirma el valor antes de producir.</div>';
    filas.forEach((x, i) => {
      const cr = textoCruce(dets, g, x);
      h += '<div class="fila-lote' + (falta(x) ? ' falta' : '') + '" data-fila="' + i + '">' +
        '<div class="l1"><span class="idx">' + (i + 1) + '</span>' +
        '<input class="nom" type="text" value="' + esc(x.nombre) + '" placeholder="Nombre de la persona (opcional)">' +
        '<button type="button" class="x" data-quitar="' + i + '" aria-label="Quitar">×</button></div>' +
        '<div class="l2"><input class="num" type="text" maxlength="6" value="' + esc(x.numero) + '" placeholder="N°">' +
        '<select class="tal"><option value="">Sin talla</option>' +
        (opciones.indexOf(x.talla) < 0 && TALLAS_AD.indexOf(x.talla) >= 0 ? opciones.concat([x.talla]) : opciones)
          .map(t => '<option value="' + t + '"' + (x.talla === t ? ' selected' : '') + '>' + t + '</option>').join('') +
        '</select></div>' + (lote.estampar && pg.estampado ? filaEstampa(x, previoDe(x)) : '') + '<div class="tag-fila ' + cr.c + '">' + esc(cr.t) + '</div></div>';
    });
    if (lote.pideOk && lote.reps) h += avisoRepetidos(lote.reps, 'Si están bien (por ejemplo, dos personas con el mismo número), confírmalo y se guardan igual. Si es un error, corrígelo en la lista.');
    if (st.error) h += '<div class="aviso error">' + esc(st.error) + '</div>';
    h += '<div class="barra-fija"><button class="btn" id="btn-guardar-lote">' + (lote.pideOk ? 'Sí, están bien · guardar ' : 'Guardar ') + filas.length + ' personas</button></div>';
    app.innerHTML = h + pie + '</div>';

    const refrescar = () => { document.getElementById('contador').innerHTML = textoContador(); };
    app.querySelectorAll('[data-fila]').forEach(div => {
      const i = +div.dataset.fila, tag = div.querySelector('.tag-fila');
      const est = div.querySelector('.est');
      const cruce = () => { const cr = textoCruce(dets, g, filas[i]); tag.className = 'tag-fila ' + cr.c; tag.textContent = cr.t;
        if (est && !filas[i].estEditado) est.value = estampadoFila(filas[i], previoDe(filas[i])); };
      div.querySelector('.nom').addEventListener('input', e => { filas[i].nombre = e.target.value; cruce(); div.classList.toggle('falta', falta(filas[i])); refrescar(); });
      if (est) est.addEventListener('input', e => { filas[i].est = e.target.value; filas[i].estEditado = true; div.classList.toggle('falta', falta(filas[i])); refrescar(); });
      div.querySelector('.num').addEventListener('input', e => {
        e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z+\-\/]/g, '').slice(0, 6);
        filas[i].numero = e.target.value; cruce(); div.classList.toggle('falta', falta(filas[i])); refrescar();
      });
      div.querySelector('.tal').addEventListener('change', e => { filas[i].talla = e.target.value; div.classList.toggle('falta', falta(filas[i])); refrescar(); });
    });
    app.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', () => {
      filas.splice(+b.dataset.quitar, 1); if (!filas.length) st.pant = 'lote'; render();
    }));

    document.getElementById('btn-guardar-lote').addEventListener('click', async () => {
      if (lote.pideOk) lote.okRepetidos = lote.pideOk;   // el cliente confirmó que los repetidos están bien
      lote.pideOk = null;
      const validas = filas.filter(x => String(x.nombre || '').trim() || String(x.numero || '').trim() || x.talla);
      if (!validas.length) { st.error = 'La lista quedó vacía.'; return render(); }
      const sin = validas.filter(x => !x.talla).length;
      if (sin) { st.error = 'Quedan ' + sin + ' personas sin talla. Complétalas o quítalas de la lista.'; return render(); }
      const sinNum = validas.filter(sinNumero).length;
      if (sinNum) { st.error = (sinNum === 1 ? 'Falta 1 número' : 'Faltan ' + sinNum + ' números') + ': dijiste que llevan número. Escríbelos o, si no llevan, vuelve atrás y elige «No, sin número».'; return render(); }
      const sinEst = validas.filter(sinEstampa).length;
      if (sinEst) { st.error = (sinEst === 1 ? 'Falta 1 nombre' : 'Faltan ' + sinEst + ' nombres') + ' a estampar: dijiste que las camisetas llevan nombre estampado. Escríbelos en «Estampa» o, si no llevan, vuelve atrás y elige «No, solo número».'; return render(); }
      // números o nombres repetidos (en la lista o con personas ya cargadas): se avisa y el cliente decide
      // se compara con las personas ya cargadas del mismo calce (salvo las que esta lista completa, que son la misma persona)
      const yaCargadas = dets.filter(d => d.calce === calce && !validas.some(v => buscarPersona([d], g, v)))
        .map(d => ({ nombre: d.nombre, numero: d.numero }));
      const reps = repetidosDe(validas.concat(yaCargadas), () => calce);
      const firma = reps.map(r => r.txt).join('|');
      if (reps.length && lote.okRepetidos !== firma) { lote.pideOk = firma; lote.reps = reps; st.error = ''; return render(); }
      // camisetas: antes de guardar se pregunta quién es arquero/a o líbero (como en la carga de una persona)
      // el molde tiene varios diseños: se pregunta cuál lleva cada persona (las ya cargadas traen el suyo)
      if (g.disenos && g.disenos.length > 1 && !lote.disListo) {
        validas.forEach(x => { if (!x.diseno) { const m = buscarPersona(dets, g, x), v = m ? +disenosDe(m.d)[g.prenda] : 0; x.diseno = g.disenos.indexOf(v) >= 0 ? v : 0; } });
        lote.validas = validas; st.error = ''; st.pant = 'lote-diseno'; return render();
      }
      if (pg.manga && !lote.arqListo) {
        validas.forEach(x => { if (x.arquero == null) { const m = buscarPersona(dets, g, x); x.arquero = !!(m && m.d.arquero); } });
        lote.validas = validas; st.error = ''; st.pant = 'lote-arquero'; return render();
      }
      await guardarLoteGrupo(validas, document.getElementById('btn-guardar-lote'));
    });
  }
  // Guarda la lista de un paso: personas nuevas y personas ya cargadas a las que se suma la prenda
  async function guardarLoteGrupo(validas, b) {
    const f = st.ficha, lote = st.lote, g = lote.grupo, pg = prendaDe(g.prenda), calce = g.calce || g.calceDef || lote.calce;
    lote.arqListo = false; lote.disListo = false;
    b.disabled = true; b.textContent = 'Guardando…';
    try {
      const actuales = await API.detalles(f.ref); // se cruza contra lo último guardado
      const base = Date.now().toString(36), usados = {};
      const fila = r => ({ id: r.id, ref: f.ref, nombre: r.nombre, estampado: r.estampado || '', numero: r.numero || '', calce: r.calce || '',
        manga: r.manga || '', arquero: !!r.arquero, obs: r.obs || '', tallas: r.tallas, disenos: r.disenos || {} });
      const conDiseno = (previos, x) => Object.assign({}, previos, x.diseno ? { [g.prenda]: x.diseno } : {});
      // con varios diseños, una persona puede llevar uno de cada uno: la fila de otro diseño se agrega aparte
      // (se junta con la suya del mismo diseño, o con la que aún no tiene diseño en esta prenda)
      const buscarParaGuardar = x => {
        if (!(g.disenos && g.disenos.length > 1 && x.diseno)) return buscarPersona(actuales, g, x);
        const cands = actuales.filter(d => !usados[d.id] && buscarPersona([d], g, x));
        const d = cands.find(c => +disenosDe(c)[g.prenda] === x.diseno) || cands.find(c => !tallasDe(c)[g.prenda] || !+disenosDe(c)[g.prenda]);
        return d ? buscarPersona([d], g, x) : null;
      };
      const regs = [], sinMg = !!pg.manga && camisetaSinMangas(f, g.prenda, calce);
      validas.forEach((x, i) => {
        const m = buscarParaGuardar(x);
        if (m && !usados[m.d.id]) {
          usados[m.d.id] = true;
          const t = Object.assign({}, tallasDe(m.d)); t[g.prenda] = x.talla;
          // la manga es la de su camiseta con mangas: en una segunda camiseta se respeta la que ya tenía
          const tenia = Object.keys(tallasDe(m.d)).some(k => tallasDe(m.d)[k] && basePrenda(k) === 'camiseta' && !camisetaSinMangas(f, k, m.d.calce));
          const elegida = !pg.manga ? m.d.manga : (tenia && (pg.variante || sinMg) ? m.d.manga : lote.manga);
          regs.push(fila({ id: m.d.id, nombre: m.d.nombre, estampado: x.estEditado && lote.estampar && pg.estampado ? estampadoFila(x) : m.d.estampado, numero: m.d.numero || x.numero, calce: m.d.calce,
            manga: pg.manga ? mangaPersona(f, t, m.d.calce, elegida) : m.d.manga, arquero: x.arquero != null ? !!x.arquero : m.d.arquero, obs: m.d.obs, tallas: t,
            disenos: conDiseno(disenosDe(m.d), x) }));
          return;
        }
        const t = {}; t[g.prenda] = x.talla;
        regs.push(fila({ id: base + '-' + i + '-' + Math.floor(Math.random() * 1000), nombre: x.nombre.trim(),
          estampado: lote.estampar && pg.estampado ? estampadoFila(x) : '',
          numero: x.numero || '', calce: calce, manga: pg.manga ? mangaPersona(f, t, calce, lote.manga) : '', arquero: !!x.arquero, tallas: t, disenos: conDiseno({}, x) }));
      });
      if (numeroOpcional(g.prenda) && lote.numero != null && llevaNumero(f, g.prenda) !== lote.numero) {
        let fr = null;
        try { fr = f.acceso ? await API.fichaPorCodigo(f.acceso) : await API.ficha(f.ref); } catch (e) {}
        const specs = JSON.parse(JSON.stringify(specsDe(fr || f)));
        specs[g.prenda] = Object.assign({}, specs[g.prenda], { numero: lote.numero ? 'si' : 'no' });
        await API.specsFicha(f.ref, specs);
        st.ficha = Object.assign({}, st.ficha, { specs: specs });
      }
      await API.guardarDetalle(regs);   // un solo envío: personas nuevas y personas a las que se suma la prenda
      await sincronizarAvisos(f, await API.detalles(f.ref));
      st.lote = null; st.error = ''; st.pant = 'pedido'; render();
    } catch (e) {
      st.error = 'No se pudo guardar la lista. ' + (e.message || '').slice(0, 400);
      b.disabled = false; render();
    }
  }
  // Antes de guardar una lista de un molde con varios diseños: cuál lleva cada persona
  function pantLoteDiseno() {
    const f = st.ficha, lote = st.lote, vs = (lote && lote.validas) || [], g = lote && lote.grupo;
    if (!vs.length || !g) { st.pant = 'lote-revisar'; return render(); }
    const pg = prendaDe(g.prenda), ds = g.disenos || [];
    const cuenta = () => ds.map(n => 'Diseño ' + n + ': ' + vs.filter(x => x.diseno === n).length).join(' · ') +
      (vs.some(x => !x.diseno) ? ' · sin elegir: ' + vs.filter(x => !x.diseno).length : '');
    const quien = x => (x.numero ? '<b>N° ' + esc(x.numero) + '</b>' + (String(x.nombre || '').trim() ? ' · ' : '') : '') +
      esc(String(x.nombre || '').trim() || (x.numero ? '' : 'Sin nombre')) + (x.talla ? ' <span class="mini">· ' + esc(x.talla) + '</span>' : '');
    app.innerHTML = barra(f.cliente, 'lote-revisar') + '<div class="pmk-wrap">' +
      '<h1 class="tit">¿Qué diseño<br>lleva cada uno?</h1>' +
      '<p class="bajada">' + esc(nombreGrupo(g)) + ' tiene ' + ds.length + ' diseños. Elige el de cada persona. Toca una imagen para verla completa.</p>' +
      fotosDisenosHTML(fotosDisenos(f, g.prenda, g.calce || g.calceDef || '')) +
      '<div class="chips" style="margin-top:12px">' + ds.map(n => '<button type="button" class="chip" data-todos="' + n + '">Todos con Diseño ' + n + '</button>').join('') + '</div>' +
      '<div class="contador" id="dis-cuenta">' + esc(cuenta()) + '</div>' +
      vs.map((x, i) => '<div class="fila-dis' + (x.diseno ? '' : ' falta') + '" data-dis="' + i + '"><span>' + quien(x) + '</span><div class="chips">' +
        ds.map(n => '<button type="button" class="chip' + (x.diseno === n ? ' on' : '') + '" data-d="' + n + '">Diseño ' + n + '</button>').join('') + '</div></div>').join('') +
      (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
      '<button class="btn plano" data-ir="lote-revisar" style="margin-top:14px">Volver a la lista</button>' +
      '<div class="barra-fija"><button class="btn" id="btn-guardar-dis">' + (pg.manga ? 'Seguir' : 'Guardar ' + vs.length + ' personas') + '</button></div>' + pie + '</div>';
    app.querySelectorAll('[data-todos]').forEach(b => b.addEventListener('click', () => { vs.forEach(x => { x.diseno = +b.dataset.todos; }); st.error = ''; render(); }));
    app.querySelectorAll('[data-dis]').forEach(fila => fila.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
      vs[+fila.dataset.dis].diseno = +b.dataset.d;
      fila.querySelectorAll('[data-d]').forEach(c => c.classList.toggle('on', c === b)); fila.classList.remove('falta');
      document.getElementById('dis-cuenta').textContent = cuenta();
    })));
    document.getElementById('btn-guardar-dis').addEventListener('click', e => {
      const sin = vs.filter(x => !x.diseno).length;
      if (sin) { st.error = 'Falta elegir el diseño de ' + sin + (sin === 1 ? ' persona.' : ' personas.'); return render(); }
      st.error = ''; lote.disListo = true;
      if (pg.manga) {
        vs.forEach(x => { if (x.arquero == null) { const m = buscarPersona(st.dets || [], g, x); x.arquero = !!(m && m.d.arquero); } });
        lote.validas = vs; st.pant = 'lote-arquero'; return render();
      }
      guardarLoteGrupo(vs, e.currentTarget);
    });
  }
  // Antes de guardar una lista de camisetas: quién es arquero/a o líbero (llevan otro diseño y se confeccionan aparte)
  function pantLoteArquero() {
    const f = st.ficha, lote = st.lote, vs = (lote && lote.validas) || [];
    if (!vs.length) { st.pant = 'lote-revisar'; return render(); }
    const marcados = () => vs.filter(x => x.arquero);
    const cuenta = () => { const m = marcados(); return m.length ? m.length + (m.length === 1 ? ' marcado: ' : ' marcados: ') + m.map(nomPersona).join(', ') : 'Nadie marcado'; };
    let h = barra(f.cliente, 'lote-revisar') + '<div class="pmk-wrap">' +
      '<h1 class="tit">¿Hay arqueros<br>o líberos?</h1>' +
      '<p class="bajada">Su camiseta lleva otro diseño y se confecciona aparte. Marca a quien sea arquero/a o líbero. Si nadie lo es, guarda así.</p>' +
      '<div class="contador" id="arq-cuenta">' + esc(cuenta()) + '</div>' +
      vs.map((x, i) => '<label class="check' + (x.arquero ? ' on' : '') + '" style="margin-top:8px" data-arq="' + i + '"><input type="checkbox"' + (x.arquero ? ' checked' : '') + '>' +
        '<span>' + (x.numero ? '<b>N° ' + esc(x.numero) + '</b>' + (String(x.nombre || '').trim() ? ' · ' : '') : '') + esc(String(x.nombre || '').trim() || (x.numero ? '' : 'Sin nombre')) + (x.talla ? ' <span class="mini">· ' + esc(x.talla) + '</span>' : '') + '</span></label>').join('') +
      (st.error ? '<div class="aviso error">' + esc(st.error) + '</div>' : '') +
      '<button class="btn plano" data-ir="lote-revisar" style="margin-top:14px">Volver a la lista</button>' +
      '<div class="barra-fija"><button class="btn" id="btn-guardar-arq">Guardar ' + vs.length + ' personas</button></div>' + pie + '</div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-arq]').forEach(l => l.querySelector('input').addEventListener('change', e => {
      vs[+l.dataset.arq].arquero = e.target.checked; l.classList.toggle('on', e.target.checked);
      document.getElementById('arq-cuenta').textContent = cuenta();
    }));
    document.getElementById('btn-guardar-arq').addEventListener('click', e => guardarLoteGrupo(vs, e.currentTarget));
  }

  /* ============ router ============ */
  let ultimaPant = null;
  function render() {
    const y = window.scrollY, misma = (ultimaPant === st.pant);
    const p = st.pant;
    if (p === 'inicio') pantInicio();
    else if (p === 'ref') pantRef();
    else if (p === 'confirmar') pantConfirmar();
    else if (p === 'pedido') pantPedido();
    else if (p === 'form') pantForm();
    else if (p === 'lote') pantLote();
    else if (p === 'lote-revisar') pantLoteRevisar();
    else if (p === 'lote-arquero') pantLoteArquero();
    else if (p === 'lote-diseno') pantLoteDiseno();
    else if (p === 'revision') pantRevision();
    else if (p === 'cerrado') pantCerrado();
    ultimaPant = st.pant;
    if (misma) window.scrollTo({ top: y }); else window.scrollTo({ top: 0 });
  }
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-ir]');
    if (!b) return;
    st.error = ''; st.pant = b.dataset.ir; render();
  });

  // Link directo: ?f=código secreto (nuevo) · ?ref=COT-1234 (antiguo, solo durante la transición)
  (async function () {
    const params = new URLSearchParams(location.search);
    const codigo = params.get('f'), q = params.get('ref');
    if (codigo) {
      try { const f = await API.fichaPorCodigo(codigo); if (f) { st.ficha = f; st.pant = 'confirmar'; return render(); } } catch (e) {}
      st.error = 'Este link no es válido o ya no está vigente. Pide uno nuevo a tu vendedor.';
    } else if (q && CFG.permitirRef) {
      try { const f = await API.ficha(normalizarRef(q)); if (f) { st.ficha = f; st.pant = 'confirmar'; return render(); } } catch (e) {}
    } else if (q) {
      st.error = 'Este link ya no está vigente. Pide el nuevo link a tu vendedor.';
    }
    render();
  })();
})();
</script>
